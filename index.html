<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<title>训练搭子</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="description" content="两个人的训练打卡 App：每天练什么、练几组、要领、打卡、回看，还有一个角落留给彼此。" />
<meta name="theme-color" content="#f4f5f9" />
<meta name="color-scheme" content="light dark" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="训练搭子" />
<meta name="format-detection" content="telephone=no" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="icon-180.png" />
<style>
/* ==========================================================================
   训练搭子 · 样式 app.css
   配色靠 CSS 变量，切换身份时整站的强调色会跟着变（蓝色=他，粉色=她）
   ========================================================================== */

:root {
  --bg: #f4f5f9;
  --bg2: #ffffff;
  --card: #ffffff;
  --ink: #11131a;
  --ink2: #5c6373;
  --ink3: #8b91a1;
  --line: #e8eaf1;
  --chip: #eef0f6;
  --accent: #4c8dff;
  --accent-2: #7db0ff;
  --accent-rgb: 76, 141, 255;
  --accent-ink: #ffffff;
  --good: #16a34a;
  --good-bg: #e8f7ee;
  --warn: #e11d48;
  --radius: 18px;
  --shadow: 0 10px 30px -18px rgba(17, 19, 26, .45);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Noto Sans SC", "Microsoft YaHei", sans-serif;
}

html[data-who="him"] {
  --accent: #3f7bf6;
  --accent-2: #6aa4ff;
  --accent-rgb: 63, 123, 246;
}

html[data-who="her"] {
  --accent: #ff6b8a;
  --accent-2: #ffa0b5;
  --accent-rgb: 255, 107, 138;
}

html[data-theme="dark"] {
  --bg: #0f1117;
  --bg2: #171a22;
  --card: #171a22;
  --ink: #f2f4f8;
  --ink2: #a2a9ba;
  --ink3: #767d8e;
  --line: #242833;
  --chip: #21252f;
  --good: #34d399;
  --good-bg: #10362a;
  --shadow: 0 12px 34px -20px rgba(0, 0, 0, .9);
}

* { -webkit-tap-highlight-color: transparent; }

html, body { margin: 0; padding: 0; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

body.locked { overflow: hidden; }

button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
}

input, textarea, select {
  font: inherit;
  color: var(--ink);
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 11px 12px;
  width: 100%;
  box-sizing: border-box;
  -webkit-appearance: none;
  appearance: none;
  transition: border-color .15s, box-shadow .15s;
}

input:focus, textarea:focus, select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(var(--accent-rgb), .16);
}

textarea { resize: vertical; min-height: 44px; line-height: 1.55; }

::placeholder { color: var(--ink3); }

a { color: var(--accent); }

/* ---------------------------------------------------------------- 骨架 */
.app {
  max-width: 560px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  padding-bottom: calc(132px + env(safe-area-inset-bottom));
  position: relative;
}

.view { outline: none; }

.page {
  padding: 4px 16px 12px;
  animation: fadeUp .3s cubic-bezier(.2, .8, .2, 1);
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}

/* ---------------------------------------------------------------- 顶栏 */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  background: linear-gradient(180deg, var(--bg) 62%, rgba(244, 245, 249, 0));
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}

html[data-theme="dark"] .topbar {
  background: linear-gradient(180deg, var(--bg) 62%, rgba(15, 17, 23, 0));
}

.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }

.brand-mark {
  width: 34px;
  height: 34px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  background: linear-gradient(140deg, var(--accent), var(--accent-2));
  color: #fff;
  font-weight: 700;
  font-size: 15px;
  box-shadow: 0 8px 18px -10px rgba(var(--accent-rgb), .9);
  flex: none;
  transition: background .3s;
}

.brand-text { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.brand-text strong { font-size: 15px; letter-spacing: -.01em; }
.brand-text small { font-size: 11px; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 身份切换 */
.who {
  display: flex;
  gap: 3px;
  padding: 3px;
  background: var(--chip);
  border-radius: 14px;
  flex: none;
}

.who-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px 9px 5px 6px;
  border-radius: 11px;
  color: var(--ink2);
  transition: background .2s, color .2s, box-shadow .2s;
  font-size: 12.5px;
  font-weight: 550;
}

.who-btn .who-av { font-size: 15px; line-height: 1; }
.who-btn.on {
  background: var(--bg2);
  color: var(--ink);
  box-shadow: 0 2px 8px -3px rgba(0, 0, 0, .22);
}

/* ---------------------------------------------------------------- 日期条 */
.datebar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 0 12px;
}

.db-arrow {
  width: 36px;
  height: 36px;
  border-radius: 12px;
  background: var(--bg2);
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  color: var(--ink2);
}
.db-arrow svg { width: 18px; height: 18px; }
.db-arrow:active { transform: scale(.94); }

.db-center { flex: 1; text-align: center; padding: 2px 8px; }
.db-main { display: block; font-size: 16px; font-weight: 650; letter-spacing: -.01em; }
.db-sub { display: block; font-size: 11.5px; color: var(--ink3); margin-top: 1px; }

.backbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: var(--ink2);
  background: rgba(var(--accent-rgb), .08);
  border-radius: 12px;
  padding: 8px 12px;
  margin-bottom: 10px;
}

.chip-btn {
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--bg2);
}

/* ---------------------------------------------------------------- 主卡 */
.hero {
  position: relative;
  overflow: hidden;
  border-radius: 24px;
  padding: 16px 16px 14px;
  color: #fff;
  background: linear-gradient(145deg, var(--accent), var(--accent-2));
  box-shadow: 0 20px 40px -22px rgba(var(--accent-rgb), .95);
  transition: background .35s;
}

.hero::after {
  content: "";
  position: absolute;
  width: 240px;
  height: 240px;
  right: -90px;
  top: -120px;
  border-radius: 50%;
  background: rgba(255, 255, 255, .14);
  pointer-events: none;
}

.hero.tone-light {
  background: linear-gradient(145deg, rgba(var(--accent-rgb), .22), rgba(var(--accent-rgb), .07));
  color: var(--ink);
  box-shadow: var(--shadow);
  border: 1px solid rgba(var(--accent-rgb), .22);
}
.hero.tone-light::after { background: rgba(var(--accent-rgb), .10); }

.hero.tone-rest {
  background: linear-gradient(145deg, #2f9e6b, #57c08d);
  box-shadow: 0 20px 40px -22px rgba(47, 158, 107, .9);
}
.hero.tone-rest::after { background: rgba(255, 255, 255, .16); }

.hero-chips { display: flex; gap: 6px; flex-wrap: wrap; position: relative; z-index: 1; }

.chip {
  font-size: 11.5px;
  font-weight: 600;
  padding: 5px 10px;
  border-radius: 999px;
  background: rgba(255, 255, 255, .22);
  color: inherit;
  backdrop-filter: blur(4px);
}

.chip.ghost { background: rgba(255, 255, 255, .12); font-weight: 500; opacity: .92; }

.hero.tone-light .chip { background: rgba(var(--accent-rgb), .14); }
.hero.tone-light .chip.ghost { background: rgba(var(--accent-rgb), .07); }

.hero-body {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 14px;
  position: relative;
  z-index: 1;
}

.hero-big { font-size: 46px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
.hero-big i { font-size: 22px; font-weight: 600; font-style: normal; margin-left: 2px; opacity: .8; }
.hero-sub { font-size: 12.5px; opacity: .86; margin-top: 6px; }

.hero-ring { flex: none; width: 82px; height: 82px; }
.hero-ring .ring { width: 82px; height: 82px; }

.ring { transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: rgba(255, 255, 255, .25); stroke-width: 9; }
.ring-fg {
  fill: none;
  stroke: currentColor;
  stroke-width: 9;
  stroke-linecap: round;
  transition: stroke-dashoffset .45s cubic-bezier(.2, .8, .2, 1);
}
.hero.tone-light .ring-bg { stroke: rgba(var(--accent-rgb), .18); }
.hero.tone-light .ring-fg { stroke: var(--accent); }

.hero-note {
  margin: 14px 0 0;
  font-size: 12px;
  line-height: 1.6;
  opacity: .88;
  position: relative;
  z-index: 1;
}

.hero-quote {
  margin: 8px 0 0;
  font-size: 12.5px;
  opacity: .72;
  position: relative;
  z-index: 1;
}

.hero-actions { display: flex; gap: 8px; margin-top: 14px; position: relative; z-index: 1; }

.hero-btn {
  flex: 1;
  font-size: 12px;
  font-weight: 600;
  padding: 9px 10px;
  border-radius: 12px;
  background: rgba(255, 255, 255, .18);
  color: inherit;
}
.hero.tone-light .hero-btn { background: rgba(var(--accent-rgb), .12); }
.hero-btn:active { transform: scale(.98); }

/* ---------------------------------------------------------------- 提示卡 */
.note-card {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 12px 14px;
  margin-top: 10px;
  border-radius: 16px;
  background: var(--bg2);
  border: 1px solid var(--line);
  font-size: 12.5px;
  color: var(--ink2);
}
.note-card b { display: block; color: var(--ink); font-size: 12.5px; margin-bottom: 2px; }
.note-card p { margin: 0; line-height: 1.6; }
.note-card .nc-icon { font-size: 16px; line-height: 1.4; }
.note-card.warm { background: #fff8ec; border-color: #f7e3c3; }
.note-card.calm { background: #eff9f3; border-color: #d6efe0; }
html[data-theme="dark"] .note-card.warm { background: #2a2113; border-color: #4a3a1c; }
html[data-theme="dark"] .note-card.calm { background: #13241b; border-color: #1f4232; }

/* ---------------------------------------------------------------- 动作卡 */
.ex-list { margin-top: 14px; }

.ex {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 13px 14px 11px;
  margin-bottom: 10px;
  transition: background .25s, border-color .25s, transform .12s;
}

.ex.is-done {
  background: linear-gradient(180deg, rgba(var(--accent-rgb), .07), rgba(var(--accent-rgb), .02));
  border-color: rgba(var(--accent-rgb), .32);
}

.ex-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

.ex-title { display: flex; align-items: center; gap: 8px; min-width: 0; }

.ex-no {
  flex: none;
  width: 20px;
  height: 20px;
  border-radius: 7px;
  background: var(--chip);
  color: var(--ink3);
  font-size: 11px;
  font-weight: 700;
  display: grid;
  place-items: center;
}

.ex-title h3 {
  margin: 0;
  font-size: 15.5px;
  font-weight: 650;
  letter-spacing: -.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ex.is-done .ex-title h3 { color: var(--accent); }

.icon-btn {
  width: 30px;
  height: 30px;
  border-radius: 10px;
  color: var(--ink3);
  display: grid;
  place-items: center;
  font-size: 17px;
  line-height: 1;
  flex: none;
}
.icon-btn:active { background: var(--chip); }

.ex-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 7px;
  font-size: 11.5px;
  color: var(--ink3);
}

.tag-strong {
  font-weight: 650;
  color: var(--ink);
  font-size: 12.5px;
}
.ex.is-done .tag-strong { color: var(--accent); }

.tag {
  padding: 2px 7px;
  border-radius: 7px;
  background: var(--chip);
  color: var(--ink2);
}

.link {
  color: var(--accent);
  font-size: 12px;
  font-weight: 600;
  padding: 2px 0;
}
.link.mini { font-size: 11.5px; }
.link.danger { color: var(--warn); }

.sets { display: flex; gap: 8px; flex-wrap: wrap; margin: 11px 0 9px; }

.set {
  width: 46px;
  height: 38px;
  border-radius: 12px;
  border: 1.5px solid var(--line);
  background: var(--bg2);
  color: var(--ink2);
  font-weight: 650;
  font-size: 13px;
  transition: transform .12s, background .18s, color .18s, border-color .18s, box-shadow .18s;
}

.set:active { transform: scale(.92); }

.set.on {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  box-shadow: 0 8px 18px -10px rgba(var(--accent-rgb), 1);
}

.tip-body {
  display: none;
  margin: 2px 0 8px;
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--chip);
  font-size: 12px;
  line-height: 1.65;
  color: var(--ink2);
}
.tip-body p { margin: 0 0 3px; }
.tip-body p:last-child { margin-bottom: 0; }
.ex.open .tip-body { display: block; animation: fadeUp .2s; }
.ex.open { border-color: rgba(var(--accent-rgb), .4); }

.ex-foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px; }

.wgt {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11.5px;
  color: var(--ink3);
}

.wgt input {
  width: 58px;
  padding: 6px 8px;
  border-radius: 9px;
  font-size: 12.5px;
  text-align: center;
}
.wgt i { font-style: normal; }

.ex-note {
  font-size: 11.5px;
  color: var(--ink3);
  background: var(--chip);
  padding: 3px 8px;
  border-radius: 8px;
}

.add-line {
  width: 100%;
  padding: 12px;
  border-radius: 14px;
  border: 1.5px dashed var(--line);
  color: var(--ink3);
  font-size: 13px;
  font-weight: 550;
  margin-bottom: 6px;
}
.add-line:active { background: var(--chip); }

/* ---------------------------------------------------------------- 休息日 */
.rest-list { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }

.rest-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 14px;
  border-radius: 16px;
  background: var(--card);
  border: 1px solid var(--line);
  text-align: left;
  transition: background .2s, border-color .2s;
}

.rest-item .ri-box {
  width: 24px;
  height: 24px;
  border-radius: 8px;
  border: 1.5px solid var(--line);
  display: grid;
  place-items: center;
  font-size: 13px;
  color: #fff;
  flex: none;
  transition: background .2s, border-color .2s;
}

.rest-item .ri-txt { font-size: 14px; color: var(--ink); }

.rest-item.on { background: var(--good-bg); border-color: rgba(22, 163, 74, .28); }
.rest-item.on .ri-box { background: var(--good); border-color: var(--good); }
.rest-item.on .ri-txt { color: var(--good); text-decoration: line-through; text-decoration-thickness: 1px; opacity: .85; }

/* ---------------------------------------------------------------- 打卡 */
.checkin {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 16px;
  padding: 14px;
  border-radius: 20px;
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
}

.ci-left { display: flex; align-items: center; gap: 11px; min-width: 0; }

.ci-badge {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-size: 17px;
  background: var(--accent);
  color: #fff;
  flex: none;
}
.ci-badge.ghost { background: var(--chip); color: var(--ink2); font-size: 16px; }

.ci-left b { display: block; font-size: 14px; letter-spacing: -.01em; }
.ci-left small { display: block; font-size: 11.5px; color: var(--ink3); margin-top: 2px; }

.checkin.done { background: linear-gradient(120deg, rgba(var(--accent-rgb), .10), rgba(var(--accent-rgb), .03)); border-color: rgba(var(--accent-rgb), .3); }
.checkin.done b { color: var(--accent); }

.btn-primary {
  background: var(--accent);
  color: #fff;
  font-weight: 650;
  font-size: 14px;
  padding: 12px 22px;
  border-radius: 14px;
  box-shadow: 0 12px 24px -14px rgba(var(--accent-rgb), 1);
  transition: transform .12s, opacity .15s;
  white-space: nowrap;
}
.btn-primary:active { transform: scale(.97); }
.btn-primary.big { padding: 14px 26px; font-size: 15px; }
.btn-primary.wide { width: 100%; }

.btn-ghost {
  background: var(--bg2);
  border: 1px solid var(--line);
  color: var(--ink);
  font-weight: 550;
  font-size: 13.5px;
  padding: 11px 16px;
  border-radius: 13px;
}
.btn-ghost:active { background: var(--chip); }
.btn-ghost.danger { color: var(--warn); border-color: rgba(225, 29, 72, .25); }
.btn-ghost.wide { width: 100%; }

/* ---------------------------------------------------------------- 通用卡片 */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  margin-top: 14px;
}

.lc-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 10px;
}
.lc-head b { font-size: 14px; letter-spacing: -.01em; }
.lc-head span { font-size: 11.5px; color: var(--ink3); }

.lab {
  display: block;
  font-size: 12px;
  color: var(--ink3);
  margin: 12px 0 6px;
}
.lab:first-child { margin-top: 0; }

.hint { font-size: 11.5px; color: var(--ink3); line-height: 1.65; margin: 10px 0 0; }

.day-note textarea { margin-top: 8px; }

.empty {
  text-align: center;
  padding: 28px 10px;
  color: var(--ink3);
}
.empty-emoji { font-size: 30px; margin-bottom: 6px; }
.empty p { margin: 0 0 12px; font-size: 13px; }

.empty .btn-ghost { margin: 0 auto; display: inline-block; }

/* ---------------------------------------------------------------- 底部导航 */
.tabbar {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 0;
  width: 100%;
  max-width: 560px;
  z-index: 50;
  display: flex;
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  background: rgba(255, 255, 255, .88);
  backdrop-filter: blur(18px) saturate(1.6);
  -webkit-backdrop-filter: blur(18px) saturate(1.6);
  border-top: 1px solid var(--line);
}

html[data-theme="dark"] .tabbar { background: rgba(20, 23, 30, .9); }

.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 5px 0;
  border-radius: 12px;
  color: var(--ink3);
  font-size: 10.5px;
  font-weight: 550;
  transition: color .2s;
}
.tab svg { width: 22px; height: 22px; }
.tab.on { color: var(--accent); }

/* 悬浮计时器 */
.fab {
  position: fixed;
  z-index: 60;
  right: max(16px, calc(50vw - 264px));
  bottom: calc(84px + env(safe-area-inset-bottom));
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 10px 14px 10px 11px;
  border-radius: 999px;
  background: var(--card);
  color: var(--accent);
  font-size: 12px;
  font-weight: 650;
  border: 1px solid rgba(var(--accent-rgb), .25);
  box-shadow: 0 14px 30px -16px rgba(0, 0, 0, .5);
}
.fab svg { width: 17px; height: 17px; }
.fab:active { transform: scale(.95); }

/* ---------------------------------------------------------------- 弹层 */
.modal-root {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.modal-root[hidden] { display: none; }

.modal-mask {
  position: absolute;
  inset: 0;
  background: rgba(9, 11, 16, .45);
  opacity: 0;
  transition: opacity .25s;
  backdrop-filter: blur(2px);
}
.modal-root.in .modal-mask { opacity: 1; }

.sheet {
  position: relative;
  width: 100%;
  max-width: 560px;
  max-height: 90dvh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  border-radius: 26px 26px 0 0;
  box-shadow: 0 -20px 50px -20px rgba(0, 0, 0, .4);
  transform: translateY(100%);
  transition: transform .3s cubic-bezier(.2, .85, .25, 1);
  overflow: hidden;
}
.modal-root.in .sheet { transform: none; }

.sheet-grip {
  width: 38px;
  height: 4px;
  border-radius: 999px;
  background: var(--line);
  margin: 9px auto 0;
  flex: none;
}

.sheet-head { padding: 12px 20px 4px; flex: none; }
.sheet-head h2 { margin: 0; font-size: 17px; letter-spacing: -.01em; }
.sheet-head p { margin: 4px 0 0; font-size: 12px; color: var(--ink3); line-height: 1.5; }

.sheet-body {
  padding: 12px 20px 16px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  flex: 1 1 auto;
}

.sheet-foot {
  flex: none;
  display: flex;
  gap: 10px;
  padding: 12px 20px calc(14px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--line);
  background: var(--bg);
}
.sheet-foot .btn-ghost { flex: 1; }
.sheet-foot .btn-primary { flex: 1.4; }

/* 分段控件 */
.seg {
  display: flex;
  gap: 3px;
  padding: 3px;
  background: var(--chip);
  border-radius: 13px;
}
.seg button {
  flex: 1;
  padding: 8px 6px;
  border-radius: 10px;
  font-size: 12.5px;
  font-weight: 550;
  color: var(--ink2);
  transition: background .2s, color .2s;
}
.seg button.on {
  background: var(--bg2);
  color: var(--ink);
  box-shadow: 0 2px 8px -4px rgba(0, 0, 0, .3);
}

/* ---------------------------------------------------------------- 表单 */
.field-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
}
.field-row:last-child { border-bottom: 0; }
.field-row input { flex: 1; border-color: transparent; background: var(--chip); }
.field-row input[type="number"] { max-width: 110px; flex: none; }
.field-row input[type="date"] { max-width: 190px; flex: none; }
.field-row input:focus { border-color: var(--accent); background: var(--bg2); }
.fr-av { font-size: 20px; width: 26px; text-align: center; }
.fr-label { font-size: 13px; color: var(--ink2); min-width: 84px; }
.fr-hint { font-size: 12px; color: var(--ink3); }

.field-row .seg { flex: 1; }

.inp { margin-bottom: 2px; }
.inp.slim { padding: 8px 10px; font-size: 12.5px; }
.inp.file { padding: 9px; font-size: 12px; background: var(--chip); }

.btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn-grid.one { grid-template-columns: 1fr; }

/* ---------------------------------------------------------------- 编辑动作 */
.drow {
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 11px;
  margin-bottom: 9px;
  background: var(--card);
}

.drow-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }

.dnum {
  width: 20px;
  height: 20px;
  border-radius: 7px;
  background: var(--chip);
  color: var(--ink3);
  font-size: 11px;
  font-weight: 700;
  display: grid;
  place-items: center;
  flex: none;
}

.dname {
  flex: 1;
  font-weight: 600;
  font-size: 14px;
  padding: 8px 10px;
}

.dgrid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin-bottom: 8px;
}
.dgrid .lab { margin: 0 0 4px; font-size: 11px; }
.dgrid input, .dgrid select { padding: 8px 8px; font-size: 12.5px; text-align: center; }

.drow textarea { font-size: 12.5px; padding: 9px 10px; margin-bottom: 6px; }

.ex-edit-list { margin-top: 4px; }
.rest-edit { display: flex; gap: 6px; align-items: center; margin-bottom: 7px; }
.rest-edit input { flex: 1; font-size: 13px; }

.kind-rest { display: none; }
.kind-is-rest .kind-rest { display: block; }
.kind-is-rest .kind-train { display: none; }

/* ---------------------------------------------------------------- 打卡弹层 */
.ci-summary {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px;
  border-radius: 16px;
  background: rgba(var(--accent-rgb), .08);
  margin-bottom: 6px;
}
.cis-big { font-size: 30px; font-weight: 800; letter-spacing: -.03em; color: var(--accent); line-height: 1; }
.cis-big i { font-size: 13px; font-weight: 600; font-style: normal; }
.cis-txt { font-size: 13px; font-weight: 600; }
.cis-txt small { display: block; font-weight: 400; font-size: 11.5px; color: var(--ink3); margin-top: 3px; }

.moods { display: flex; gap: 8px; }
.mood {
  flex: 1;
  padding: 12px 6px;
  border-radius: 14px;
  border: 1.5px solid var(--line);
  background: var(--bg2);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  transition: border-color .2s, background .2s, transform .12s;
}
.mood span { font-size: 20px; }
.mood i { font-style: normal; font-size: 11.5px; color: var(--ink3); }
.mood.on { border-color: var(--accent); background: rgba(var(--accent-rgb), .09); }
.mood.on i { color: var(--accent); }
.mood:active { transform: scale(.96); }

/* 庆祝卡 */
.cheer-sheet { background: transparent; box-shadow: none; }
.cheer-card {
  margin: 0 12px calc(16px + env(safe-area-inset-bottom));
  border-radius: 26px;
  padding: 28px 22px 20px;
  text-align: center;
  color: #fff;
  background: linear-gradient(150deg, var(--accent), var(--accent-2));
  box-shadow: 0 24px 50px -20px rgba(var(--accent-rgb), .8);
}
.cheer-mark {
  width: 58px;
  height: 58px;
  margin: 0 auto 12px;
  border-radius: 50%;
  background: rgba(255, 255, 255, .22);
  display: grid;
  place-items: center;
  font-size: 28px;
}
.cheer-card h2 { margin: 0 0 4px; font-size: 20px; }
.cheer-card p { margin: 0; font-size: 13px; opacity: .88; }
.cheer-streak { margin: 18px 0 20px; }
.cheer-streak b { font-size: 40px; font-weight: 800; letter-spacing: -.03em; }
.cheer-streak span { font-size: 12px; opacity: .8; margin-left: 4px; }
.cheer-btns { display: flex; gap: 10px; }
.cheer-btns .btn-ghost { background: rgba(255, 255, 255, .2); border-color: transparent; color: #fff; flex: 1; }
.cheer-btns .btn-primary { background: #fff; color: var(--accent); flex: 1.3; box-shadow: none; }

/* 战报 */
.report-sheet .sheet-body { padding: 8px 16px 12px; background: #0b0d13; }
.report-body img { width: 100%; border-radius: 16px; display: block; }

/* 计时器 */
.timer-sheet .sheet-body { text-align: center; padding-top: 6px; }
.tm-ring { position: relative; width: 200px; height: 200px; margin: 6px auto 4px; }
.tm-ring .ring { width: 200px; height: 200px; }
.tm-ring .ring-bg { stroke: var(--chip); stroke-width: 8; }
.tm-ring .ring-fg { stroke: var(--accent); stroke-width: 8; transition: stroke-dashoffset .2s linear; }
.tm-num {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: 40px;
  font-weight: 800;
  letter-spacing: -.03em;
  font-variant-numeric: tabular-nums;
}
.tm-ring.done .tm-num { color: var(--accent); animation: pulse .8s infinite alternate; }
@keyframes pulse { from { transform: scale(1); } to { transform: scale(1.06); } }

.tm-presets { display: flex; gap: 7px; justify-content: center; margin: 14px 0; }
.tm-pre {
  padding: 8px 13px;
  border-radius: 11px;
  background: var(--chip);
  font-size: 12.5px;
  font-weight: 600;
  color: var(--ink2);
}
.tm-pre.on { background: var(--accent); color: #fff; }

.tm-actions { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 14px; }
.tm-actions .btn-ghost { flex: 1; }
.tm-actions .btn-primary { flex: 1.6; }

/* ---------------------------------------------------------------- 日历 */
.cal-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 0 12px; }
.cal-title { font-size: 15px; font-weight: 650; }

.cal-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 4px; }
.cal-week span { text-align: center; font-size: 11px; color: var(--ink3); padding: 4px 0; }

.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }

.cal-cell {
  position: relative;
  aspect-ratio: 1 / 1;
  border-radius: 13px;
  background: var(--card);
  border: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  transition: background .2s, border-color .2s;
}
.cal-cell.blank { background: transparent; border-color: transparent; }
.cal-cell .d { font-size: 13px; font-weight: 550; color: var(--ink2); }
.cal-cell .dot { width: 5px; height: 5px; border-radius: 50%; background: transparent; }
.cal-cell.is-future .d { color: var(--ink3); opacity: .55; }
.cal-cell.is-today { border-color: var(--accent); border-width: 1.5px; }
.cal-cell.is-today .d { color: var(--accent); font-weight: 700; }
.cal-cell.is-checked { background: var(--accent); border-color: var(--accent); }
.cal-cell.is-checked .d { color: #fff; font-weight: 700; }
.cal-cell.is-checked .dot { background: rgba(255, 255, 255, .9); }
.cal-cell.is-rest { background: var(--good); border-color: var(--good); }
.cal-cell.is-rest .d { color: #fff; }
.cal-cell.is-rest .dot { background: rgba(255, 255, 255, .9); }
.cal-cell.is-partial { border-color: rgba(var(--accent-rgb), .45); background: rgba(var(--accent-rgb), .1); }
.cal-cell.is-partial .dot { background: var(--accent); }
.cal-cell.is-restday { background: var(--good-bg); border-color: rgba(22, 163, 74, .2); }
.cal-cell.is-restday .dot { background: rgba(22, 163, 74, .5); }

.cal-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 12px;
  font-size: 11px;
  color: var(--ink3);
}
.cal-legend span { display: inline-flex; align-items: center; gap: 5px; }
.lg { width: 9px; height: 9px; border-radius: 3px; display: inline-block; flex: none; }
.lg.checked { background: var(--accent); }
.lg.rest { background: var(--good); }
.lg.partial { background: rgba(var(--accent-rgb), .35); }
.lg.none { background: var(--chip); border: 1px solid var(--line); }

.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 14px; }

.stat {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.stat b { font-size: 22px; font-weight: 750; letter-spacing: -.02em; }
.stat b i { font-size: 11.5px; font-weight: 500; font-style: normal; color: var(--ink3); margin-left: 3px; }
.stat-lb { font-size: 11.5px; color: var(--ink3); }
.stat-em { position: absolute; }
.stat .stat-em { font-size: 0; }

.week-strip .ws-head { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--ink2); margin-bottom: 10px; }
.ws-dots { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.ws-dot {
  aspect-ratio: 1 / 1;
  border-radius: 11px;
  background: var(--chip);
  display: grid;
  place-items: center;
}
.ws-dot i { font-style: normal; font-size: 11.5px; color: var(--ink3); }
.ws-dot.on { background: var(--accent); }
.ws-dot.on i { color: #fff; }
.ws-dot.on.rest { background: var(--good); }
.ws-dot.today { border: 1.5px solid var(--accent); }
.ws-dot.future { opacity: .5; }

.list-card { padding: 6px 8px; }
.list-card .lc-head { padding: 8px 6px 4px; }

.row {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 10px 6px;
  border-bottom: 1px solid var(--line);
  text-align: left;
}
.row:last-child { border-bottom: 0; }

.row-date { font-size: 12px; font-weight: 600; color: var(--ink2); min-width: 62px; display: flex; flex-direction: column; }
.row-date i { font-style: normal; font-size: 10.5px; color: var(--ink3); font-weight: 400; }
.row-main { flex: 1; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-side { font-size: 11.5px; color: var(--ink3); }

.plan-list { margin-top: 4px; }
.plan-row { border-bottom: 1px solid var(--line); }
.pr-day { font-size: 12px; font-weight: 650; color: var(--ink2); min-width: 34px; }

/* ---------------------------------------------------------------- 我们 */
.duo {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 8px;
  align-items: center;
  padding: 16px 12px;
  border-radius: 22px;
  background: var(--card);
  border: 1px solid var(--line);
  margin-top: 6px;
}

.duo-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 8px 4px;
  border-radius: 16px;
  transition: background .2s;
}
.duo-col.me { background: rgba(var(--accent-rgb), .07); }
.duo-av { font-size: 28px; line-height: 1.2; }
.duo-name { font-size: 13px; font-weight: 650; }
.duo-tag { font-size: 10px; color: var(--ink3); }
.duo-state {
  margin-top: 5px;
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--chip);
  color: var(--ink2);
}
.duo-state.ok { background: rgba(var(--accent-rgb), .14); color: var(--accent); font-weight: 600; }
.duo-streak { font-size: 10.5px; color: var(--ink3); margin-top: 3px; }

.duo-heart { display: flex; flex-direction: column; align-items: center; gap: 1px; }
.duo-heart span { font-size: 15px; }
.duo-heart b { font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
.duo-heart small { font-size: 9.5px; color: var(--ink3); white-space: nowrap; }

.task-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.task .chip { background: rgba(var(--accent-rgb), .12); color: var(--accent); font-size: 11px; padding: 4px 9px; border-radius: 999px; font-weight: 650; }
.task-ok { font-size: 11px; color: var(--good); font-weight: 650; }
.task-text { margin: 0 0 12px; font-size: 14.5px; font-weight: 600; line-height: 1.55; letter-spacing: -.01em; }
.task.done .task-text { color: var(--good); }
.task-btns { display: flex; gap: 8px; }
.task-btn {
  flex: 1;
  padding: 10px 8px;
  border-radius: 12px;
  border: 1.5px solid var(--line);
  background: var(--bg2);
  font-size: 12.5px;
  color: var(--ink2);
  transition: .2s;
}
.task-btn.on { border-color: var(--good); background: var(--good-bg); color: var(--good); font-weight: 600; }

.chat-body { display: flex; flex-direction: column; gap: 10px; max-height: 320px; overflow-y: auto; padding: 2px 0 6px; }

.bubble { display: flex; gap: 8px; align-items: flex-end; max-width: 88%; }
.bubble.her { align-self: flex-end; flex-direction: row-reverse; }
.bub-av { font-size: 18px; flex: none; }
.bub-body {
  padding: 9px 12px;
  border-radius: 16px 16px 16px 5px;
  background: var(--chip);
  font-size: 13.5px;
  line-height: 1.5;
}
.bubble.her .bub-body { border-radius: 16px 16px 5px 16px; background: rgba(var(--accent-rgb), .13); }
.bub-body p { margin: 0; word-break: break-word; }
.bub-body small { display: block; font-size: 10px; color: var(--ink3); margin-top: 3px; }

.chat-empty { font-size: 12px; color: var(--ink3); text-align: center; padding: 14px 0; }

.cheers { display: flex; gap: 6px; overflow-x: auto; padding: 6px 0 8px; scrollbar-width: none; }
.cheers::-webkit-scrollbar { display: none; }
.cheer {
  flex: none;
  font-size: 11.5px;
  padding: 6px 11px;
  border-radius: 999px;
  background: var(--chip);
  color: var(--ink2);
  white-space: nowrap;
}
.cheer:active { background: rgba(var(--accent-rgb), .16); color: var(--accent); }

.chat-form { display: flex; gap: 8px; align-items: center; }
.chat-form input { flex: 1; }
.btn-send {
  flex: none;
  padding: 11px 16px;
  border-radius: 12px;
  background: var(--accent);
  color: #fff;
  font-size: 13px;
  font-weight: 650;
}

.feature-card .btn-grid { grid-template-columns: 1fr; }

.mini-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.mini-item {
  font-size: 11.5px;
  padding: 5px 9px;
  border-radius: 9px;
  background: var(--chip);
  color: var(--ink2);
}
.mini-item i { font-style: normal; color: var(--ink3); }

.slot > div { margin-top: 0; }

.changelog p { margin: 0 0 6px; font-size: 11.5px; color: var(--ink3); line-height: 1.6; }
.changelog b { color: var(--ink2); }

/* ---------------------------------------------------------------- 提示条 */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(100px + env(safe-area-inset-bottom));
  transform: translate(-50%, 12px);
  z-index: 300;
  max-width: 80vw;
  padding: 11px 18px;
  border-radius: 999px;
  background: rgba(17, 19, 26, .92);
  color: #fff;
  font-size: 13px;
  font-weight: 500;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .22s, transform .22s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------------------------------------------------------------- 桌面 */
@media (min-width: 620px) {
  body { background: #e8eaf1; }
  html[data-theme="dark"] body { background: #08090d; }
  .app {
    background: var(--bg);
    box-shadow: 0 0 70px rgba(15, 20, 40, .12);
    min-height: 100dvh;
  }
  .sheet { border-radius: 24px; margin-bottom: 24px; max-height: 84dvh; }
  .modal-root { align-items: center; }
  .cheer-card { margin-bottom: 0; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* 小屏微调 */
@media (max-width: 360px) {
  .hero-big { font-size: 40px; }
  .set { width: 42px; }
  .dgrid { grid-template-columns: repeat(2, 1fr); }
}

/* ==========================================================================
   v2 新增：排序 / 动作库 / 同步 / 经期 / 对战 / 成就 / 照片
   ========================================================================== */
:root { --him: #3f7bf6; --her: #ff6b8a; }

#modal-root-2 { z-index: 220; }

.slot-top { margin-top: 10px; }

/* ---------- 排序 ---------- */
.ex-toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 16px 0 8px;
  font-size: 12px;
  color: var(--ink3);
}
.ex-toolbar .et-count { font-weight: 650; color: var(--ink2); font-size: 12.5px; }
.ex-toolbar .et-tip { flex: 1; }
.ex-toolbar .link { margin-left: auto; }

.ex.sortable { border-style: dashed; border-color: rgba(var(--accent-rgb), .35); }
.ex.dragging {
  opacity: .92;
  transition: none !important;
  will-change: transform;
  z-index: 6;
  position: relative;
  box-shadow: 0 18px 40px -18px rgba(0, 0, 0, .45);
  border-style: solid;
  border-color: var(--accent);
  background: var(--card);
  touch-action: none;
}
.drag-handle {
  color: var(--ink3);
  font-size: 15px;
  margin-right: 6px;
  cursor: grab;
}
.sort-hint { font-size: 11px; color: var(--ink3); }
.ex.sortable .sets, .ex.sortable .ex-foot, .ex.sortable .tip-body { pointer-events: none; opacity: .55; }

.row-btns { display: flex; gap: 8px; }
.row-btns .add-line { flex: 1; }

/* ---------- 动作库 ---------- */
.lib-tabs { margin: 10px 0; overflow-x: auto; scrollbar-width: none; }
.lib-tabs::-webkit-scrollbar { display: none; }
.lib-tabs button { flex: none; padding: 7px 10px; font-size: 12px; }
.lib-list { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
.lib-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 11px 12px;
  border-radius: 13px;
  background: var(--card);
  border: 1px solid var(--line);
  text-align: left;
}
.lib-row:active { background: var(--chip); }
.lib-name { flex: 1; font-size: 13.5px; font-weight: 550; }
.lib-meta { font-size: 11px; color: var(--ink3); }
.lib-add { font-size: 16px; color: var(--accent); font-weight: 600; width: 18px; text-align: center; }

/* ---------- 同步 ---------- */
.kv {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  padding: 7px 0;
  border-bottom: 1px dashed var(--line);
  font-size: 12.5px;
}
.kv:last-of-type { border-bottom: 0; }

.sync-card.on { border-color: rgba(22, 163, 74, .28); }
.sync-ok {

  font-weight: 650;
  font-size: 14px;
  margin-bottom: 10px;
}

.row-inline { display: flex; gap: 8px; align-items: center; }
.row-inline .inp { flex: 1; }
.row-inline .chip-btn { flex: none; background: var(--chip); color: var(--ink2); }

.divider { display: flex; align-items: center; gap: 10px; margin: 16px 0 4px; color: var(--ink3); font-size: 11px; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* 同步弹层里的 GitHub 区块 */
.sync-block {
  padding: 12px;
  border-radius: 15px;
  background: var(--bg2);
  border: 1px solid var(--line);
}
.sync-block-hd { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.sync-block-hd b { font-size: 14px; }
.sync-tag {
  font-size: 10px;
  font-weight: 650;
  color: #fff;
  background: var(--accent);
  padding: 2px 7px;
  border-radius: 999px;
}
.sync-steps {
  margin: 6px 0 10px;
  padding-left: 18px;
  font-size: 12px;
  line-height: 1.75;
  color: var(--ink2);
}
.sync-steps b { color: var(--ink); font-weight: 650; }
.sync-block .hint { margin: 0 0 8px; }


.switch {
  width: 44px;
  height: 26px;
  border-radius: 999px;
  background: var(--chip);
  position: relative;
  transition: background .2s;
  margin-left: auto;
  flex: none;
}
.switch::after {
  content: "";
  position: absolute;
  top: 3px; left: 3px;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 2px 6px rgba(0, 0, 0, .2);
  transition: transform .2s;
}
.switch.on { background: var(--accent); }
.switch.on::after { transform: translateX(18px); }

/* ---------- 经期 ---------- */
.cycle-strip {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 13px;
  border-radius: 16px;
  background: rgba(255, 107, 138, .10);
  border: 1px solid rgba(255, 107, 138, .22);
  width: 100%;
  text-align: left;
}
.cycle-strip.him { background: rgba(255, 107, 138, .07); border-color: rgba(255, 107, 138, .16); }
.cycle-strip.idle { background: var(--card); border: 1px dashed var(--line); color: var(--ink3); }
.cycle-strip .cs-icon { font-size: 17px; flex: none; }
.cycle-strip .cs-main { flex: 1; min-width: 0; }
.cycle-strip .cs-main b { display: block; font-size: 13.5px; }
.cycle-strip .cs-main small { display: block; font-size: 11.5px; color: var(--ink3); margin-top: 1px; }
.cycle-strip .cs-btns { display: flex; gap: 6px; flex: none; }
.cycle-strip .chip-btn { background: #fff; color: #d63a5c; font-size: 11.5px; }
.cycle-strip .chip-btn.ghost { background: transparent; color: var(--ink3); }
.cs-idle-txt { font-size: 12.5px; }

.other-day .od-title { margin: 0 0 8px; font-size: 15px; font-weight: 650; }
.other-day .od-rest { margin: 0 0 8px; font-size: 13px; color: var(--ink3); }
.od-exs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.od-ex {
  font-size: 11.5px;
  padding: 5px 9px;
  border-radius: 9px;
  background: var(--chip);
  color: var(--ink2);
}
.od-ex i { font-style: normal; color: var(--ink3); margin-left: 4px; }
.od-ex.on { background: rgba(var(--accent-rgb), .12); color: var(--accent); }
.od-ex.on i { color: var(--accent); }
.od-note { margin: 0 0 8px; font-size: 12px; color: var(--ink3); font-style: italic; }

.duel .bt-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.bt-av { font-size: 17px; flex: none; }
.bt-bar { flex: 1; height: 10px; border-radius: 999px; background: var(--chip); overflow: hidden; }
.bt-fill { height: 100%; border-radius: 999px; transition: width .5s cubic-bezier(.2,.8,.2,1); }
.bt-row b { font-size: 13px; font-weight: 700; min-width: 44px; text-align: right; }
.bt-row b i { font-style: normal; font-size: 10.5px; color: var(--ink3); margin-left: 2px; font-weight: 400; }
.bt-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink3); margin-top: 2px; }
.bt-lead { margin: 10px 0 0; font-size: 12.5px; font-weight: 600; color: var(--ink2); }
.bt-hist { margin: 4px 0 0; font-size: 11.5px; color: var(--ink3); }

/* ---------- 成就 ---------- */
.badge-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 4px; }
.badge {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 9px 4px 7px;
  border-radius: 13px;
  background: var(--chip);
  opacity: .55;
  filter: grayscale(1);
  transition: .25s;
}
.badge.on {
  background: linear-gradient(160deg, rgba(var(--accent-rgb), .16), rgba(var(--accent-rgb), .05));
  opacity: 1;
  filter: none;
  border: 1px solid rgba(var(--accent-rgb), .25);
}
.bg-icon { font-size: 19px; line-height: 1.2; }
.bg-name { font-size: 10px; font-weight: 650; text-align: center; }
.bg-prog { width: 80%; height: 3px; border-radius: 999px; background: rgba(0, 0, 0, .12); overflow: hidden; }
.bg-prog i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.badge.on .bg-prog { opacity: .45; }
.bg-num { font-size: 9px; color: var(--ink3); }

/* ---------- 照片 ---------- */
.photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 10px; }
.ph {
  position: relative;
  aspect-ratio: 3 / 4;
  border-radius: 12px;
  overflow: hidden;
  background: var(--chip);
}
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph-date {
  position: absolute;
  left: 4px; bottom: 4px;
  font-size: 9px;
  color: #fff;
  background: rgba(0, 0, 0, .45);

  border-radius: 6px;
}
.ph-who { position: absolute; right: 4px; top: 4px; font-size: 12px; }
.ph-big { width: 100%; border-radius: 16px; display: block; margin-bottom: 10px; }
.ph-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ph-compare figure { margin: 0; }
.ph-compare img { width: 100%; border-radius: 12px; display: block; }
.ph-compare figcaption { text-align: center; font-size: 11px; color: var(--ink3); padding-top: 4px; }
.photo-sheet .btn-ghost.wide { margin-top: 10px; }

@media (max-width: 360px) {
  .badge-grid { grid-template-columns: repeat(3, 1fr); }
  .photo-grid { grid-template-columns: repeat(2, 1fr); }
}

/* ==========================================================================
   v1.4：周计划拖动换天 + 动作库展开要领
   ========================================================================== */
.plan-row { cursor: default; }

  flex: 1;
  min-width: 0;
  text-align: left;

  justify-content: space-between;

  width: 30px;
  height: 30px;
  border-radius: 9px;
  background: rgba(var(--accent-rgb), .12);
  color: var(--accent);
  font-size: 16px;
  font-weight: 700;
  line-height: 1;
  display: grid;
  place-items: center;
}

    '把「今天好累」换成「今天练完再累」。',
    '最好的身材管理，是不焦虑地坚持。'
  ];

  /* ---- 双人小挑战（按日期轮换） ---------------------------------------- */
  var COUPLE_TASKS = [
    '互相说一个「今天对方做得好的细节」。',
    '训练结束后一起拍一张汗津津的合照。',
    '给对方递一次水 / 毛巾，不许自己拿。',
    '帮对方数一组次数，喊出声。',
    '一起做 1 分钟平板支撑，谁先塌谁请喝水。',
    '给对方按 3 分钟肩颈。',
    '今天谁先到健身房，谁决定练完吃什么。',
    '一起拉伸 5 分钟，边拉边聊今天的事。',
    '夸一句对方身体上真实的变化（不是客套话）。',
    '把手机放远一点，一起安静吃完一顿饭。',
    '今天练习时互相提醒一次动作要点。',
    '一起走 15 分钟，不聊工作。',
    '给对方拍一张「训练中」的照片，发给他/她。',
    '今天两个人都不许说「我好胖」。',
    '互相检查一次训练记录，找出一个可以改进的点。',
    '睡前互相说一句「今天辛苦了」。'
  ];

  /* ---- 打气短句 -------------------------------------------------------- */
  var CHEERS = ['加油，我在这', '最后一组！', '你今天超棒', '别偷懒哦', '练完请你吃', '我等你', '一起变强'];

  /* ---- 导出 ------------------------------------------------------------ */
  var Data = {
    version: '1.4.0',
    weekNotes: WEEK_NOTES,
    quotes: QUOTES,
    coupleTasks: COUPLE_TASKS,
    cheers: CHEERS,
    days: DAYS,            // v1.4：两个人共用一套

    /** 取某天的原始模板（只读，别直接改） */
    raw: function (dow) {
      return DAYS[dow] || DAYS[0];
    },

    /** 构建某天的模板副本（周 4 自动减量）。主要用于「恢复默认」和迁移。 */
    buildDay: function (dow, weekIdx) {
      var t = this.raw(dow);
      var deload = weekIdx === 3;
      var exercises = (t.exercises || []).map(function (e) {
        return {
          name: e.name,
          sets: deload ? Math.max(2, e.sets - 1) : e.sets,
          reps: e.reps,
          unit: e.unit || '次',
          rest: e.rest == null ? 90 : e.rest,
          tip: e.tip || '',
          note: ''
        };
      });
      return {
        kind: t.kind,
        icon: t.icon || (t.kind === 'rest' ? '🌙' : '💪'),
        intensity: t.intensity || (t.kind === 'rest' ? 'rest' : 'heavy'),
        title: t.title,
        focus: t.focus || '',
        warmup: t.warmup || '',
        cooldown: t.cooldown || '',
        exercises: exercises,
        restItems: (t.restItems || []).map(function (r) { return { text: typeof r === 'string' ? r : r.text }; })
      };
    },

    /** 内置的 7 天（恢复默认用） */
    defaultPlan: function () {
      var out = [];
      for (var d = 0; d < 7; d++) out.push(this.buildDay(d, 0));
      return out;
    },

    quoteFor: function (dayNumber) {
      return QUOTES[Math.abs(dayNumber) % QUOTES.length];
    },
    taskFor: function (dayNumber) {
      return COUPLE_TASKS[Math.abs(dayNumber) % COUPLE_TASKS.length];
    }
  };

  global.FitData = Data;
})(window);

</script>

  var ITEMS = [
    /* 胸 8 */

    I('哑铃卧推', 'chest', 4, '8-12', '次', 90, '哑铃下放到胸部两侧，肘部略低于躯干，推起时两只哑铃往中间靠；\n别塌腰把屁股抬离凳子，肩膀也别往前送。'),
    I('上斜哑铃卧推', 'chest', 4, '8-12', '次', 90, '凳背调到 30-45°，哑铃落在上胸两侧，小臂始终垂直地面；\n别把凳子调太高，否则肩膀会抢走很多胸的发力。'),
    I('史密斯机卧推', 'chest', 4, '8-10', '次', 120, '把凳子摆到杠铃正下方，肩胛后收，杠铃落到下胸；\n别让杠铃砸胸借力，推起时保持手腕中立别翻腕。'),
    I('龙门架夹胸', 'chest', 3, '12-15', '次', 60, '滑轮调到略高于肩，身体前倾一步，双臂画弧在胸前合拢；\n别耸肩，也别用手臂甩，回放时控制到胸肌有拉伸。'),
    I('蝴蝶机夹胸', 'chest', 3, '12-15', '次', 60, '座椅调到把手与肩同高，背贴靠垫，用胸把把手往中间夹；\n别借惯性快速开合，回到起点时别让配重片撞响。'),
    I('坐姿推胸器', 'chest', 3, '10-12', '次', 90, '座椅高度让把手对准胸线，肩胛后收贴紧靠垫再推；\n别耸肩、别锁死手肘，回放时不要让配重片完全落下。'),
    I('双杠臂屈伸', 'chest', 3, '8-12', '次', 90, '身体前倾、屈膝交叉小腿，肘部向外打开，下到肩略低于肘；\n别直上直下，那会让三头抢戏，胸几乎没感觉。'),

    /* 背 9 */
    I('高位下拉', 'back', 4, '10-12', '次', 90, '握距略宽于肩，胸口先挺起来，把横杆拉到锁骨上方；\n别往后仰太多，也别用手臂硬拽，想象肘往腰侧收。'),
    I('坐姿划船', 'back', 4, '10-12', '次', 90, '脚踩稳、胸口挺起，先把肩胛骨往后收，再把把手拉到肚脐；\n别弓背耸肩，回放时让肩膀被拉出去一点。'),
    I('杠铃划船', 'back', 4, '8-10', '次', 120, '髋部后移、背保持平直，肘贴身体把杠铃拉向肚脐；\n别用腰甩重量，也别把上身抬太高，腰会吃力很多。'),
    I('单臂哑铃划船', 'back', 3, '10-12', '次/侧', 60, '一手撑凳、背平行地面，肘贴身体把哑铃拉向髋部；\n别转体耸肩，也别把哑铃拉到胸口外侧，背先发力。'),
    I('T杠划船', 'back', 3, '10-12', '次', 90, '胸贴靠垫、脚踩实，肘部贴着身体把杠拉向腹部；\n别用腿蹬地借力，也别让腰离开靠垫，全程靠背发力。'),
    I('引体向上', 'back', 3, '6-10', '次', 120, '先沉肩再屈肘，把胸口拉向单杠，下放时控制到手臂伸直；\n别靠摆腿晃上去，也别只做半程，下巴别乱抬。'),
    I('直臂下压', 'back', 3, '12-15', '次', 60, '身体微前倾，手臂近乎伸直，用背把横杆压到大腿前；\n别屈肘变成下压，也别耸肩，全程感受背阔肌收紧。'),
    I('反手高位下拉', 'back', 3, '10-12', '次', 60, '反手握杠与肩同宽，挺胸，肘往下压着把横杆拉到上胸；\n别后仰借力，也别让手腕过度折弯，前臂别内旋。'),
    I('硬拉', 'back', 4, '6-8', '次', 180, '杠铃贴着小腿，髋部后移、背绷直，起身时用腿把地推开；\n别弓腰起杠，也别把杠铃甩离身体，杠铃全程贴腿走。'),

    /* 肩 7 */
    I('坐姿哑铃推举', 'shoulder', 4, '8-12', '次', 90, '凳背调直、核心收紧，哑铃从耳侧推到头顶，肘部略向前；\n别塌腰顶髋，也别在顶端把哑铃砸在一起，轻放。'),
    I('杠铃站姿推举', 'shoulder', 4, '8-10', '次', 120, '站距与肩同宽，杠铃从锁骨推到头顶，身体保持一条直线；\n别后仰用胸借力，推起后让头穿过手臂，杠铃走直线。'),
    I('哑铃侧平举', 'shoulder', 4, '12-15', '次', 60, '手肘微屈，像倒水一样把哑铃抬到与肩同高；\n别耸肩，也别甩身体，重量轻一点更能练到中束，宁轻勿重。'),
    I('单臂绳索侧平举', 'shoulder', 3, '12-15', '次/侧', 45, '身体侧对滑轮，手肘微屈，把把手向侧上方抬到肩高；\n别让身体跟着转，也别耸肩，下放时慢慢控制住。'),
    I('绳索面拉', 'shoulder', 3, '12-15', '次', 60, '滑轮调到面部高度，双手拉向额头两侧，肘部高于手腕；\n别用腰后仰，也别把绳子拉到胸口，那会变成划船。'),
    I('反向蝴蝶机', 'shoulder', 3, '12-15', '次', 60, '胸口贴垫，手臂微屈，把把手往后打开到与肩平行；\n别耸肩，也别用背阔肌往下压，想着小拇指往后走，肘部领先。'),
    I('哑铃前平举', 'shoulder', 3, '12-15', '次', 60, '哑铃放在大腿前，手肘微屈，抬到与肩同高就停；\n别甩腰借力，也别抬过头顶，肩前束容易代偿，控制下落。'),

    /* 腿 9 */
    I('杠铃深蹲', 'leg', 4, '6-10', '次', 180, '脚与肩同宽、脚尖略外八，屈髋屈膝下蹲到大腿平行；\n别让膝盖内扣，也别弓腰，重心压在全脚掌，脚趾抓地。'),
    I('腿举', 'leg', 4, '10-12', '次', 120, '背和臀贴紧靠垫，双脚踩在踏板中部，下放到膝盖约 90°；\n别把膝盖锁死，也别让腰离开靠垫，保持骨盆稳定。'),
    I('哈克深蹲', 'leg', 4, '8-12', '次', 120, '背贴靠垫、脚踩实，屈膝下蹲到舒服的深度再蹬起；\n别让膝盖内扣，也别在顶端把膝盖锁死，保持张力。'),
    I('保加利亚分腿蹲', 'leg', 3, '10-12', '次/侧', 90, '后脚搭凳，前脚站到能垂直下蹲的位置，身体微微前倾；\n别让前膝内扣，也别把重心全压在后脚，前脚发力。'),
    I('坐姿腿屈伸', 'leg', 3, '12-15', '次', 60, '背贴靠垫，脚踝勾住滚垫，把小腿伸到接近伸直；\n别甩重量，也别在顶端猛踢，膝盖不舒服就减小幅度，别硬顶。'),
    I('坐姿腿弯举', 'leg', 3, '12-15', '次', 60, '调好靠垫让膝盖对准转轴，脚跟往臀部方向勾；\n别用腰借力，回放时控制住，别让配重片砸下去，慢放。'),
    I('俯卧腿弯举', 'leg', 3, '12-15', '次', 60, '髋部贴紧垫子，脚踝勾住滚垫，把脚跟往臀部收；\n别抬屁股，也别用惯性甩，顶端停半秒再下放，全程控制。'),
    I('站姿提踵', 'leg', 4, '15-20', '次', 45, '前脚掌踩在踏板上，脚跟尽量下沉，再踮到最高点停一下；\n别弹震借力，也别只做小幅度，全程慢慢控制。'),
    I('坐姿夹腿', 'leg', 3, '15-20', '次', 60, '坐直、背贴靠垫，双腿从打开位置往中间夹紧，停 1 秒；\n别用手撑座椅借力，也别快速开合，内收肌要一直绷住。'),

    /* 臀 7 */
    I('杠铃臀冲', 'glute', 4, '8-12', '次', 120, '上背靠凳、杠铃压在髋部，脚跟发力把髋顶到身体成直线；\n别用腰过度反弓，顶端夹紧屁股停 1 秒，别顶太高。'),
    I('罗马尼亚硬拉', 'glute', 4, '8-12', '次', 120, '膝盖微屈，杠铃贴腿下放，髋部往后推，背始终平直；\n别弓背，也别把杠铃放得太远，感受腘绳肌拉伸，控制住。'),
    I('相扑硬拉', 'glute', 4, '8-10', '次', 150, '站距宽、脚尖外展，双手在腿间握杠，杠铃贴腿起身、膝盖向外顶；\n别弓腰，也别让膝盖内扣，核心先绷紧。'),
    I('绳索后踢腿', 'glute', 3, '12-15', '次/侧', 45, '脚踝套绳，身体微前倾，腿向后上方蹬，顶端夹紧屁股；\n别用腰甩腿，也别把腿踢得太高导致骨盆翻转。'),
    I('坐姿髋外展', 'glute', 3, '15-20', '次', 60, '坐直、背贴靠垫，双腿向外打开到最大，停一下再慢慢回；\n别用身体后仰借力，也别快速弹震，夹住两秒。'),
    I('器械腿后踢', 'glute', 3, '12-15', '次/侧', 45, '胸口贴垫，脚掌踩住踏板，用屁股把腿往后上方推；\n别弓腰抬身体，回放时控制住，别让配重片砸出响声。'),
    I('壶铃摇摆', 'glute', 3, '15-20', '次', 60, '壶铃在腿间摆荡，靠髋部爆发把壶铃甩到胸口高度；\n别用手臂抬，也别蹲得太深，动作是髋铰链不是深蹲。'),

    I('杠铃弯举', 'arm', 3, '10-12', '次', 60, '大臂夹紧身体，弯举到前臂接近垂直，再慢慢下放；\n别甩腰借力，也别让肘部往前跑，手腕保持中立，别翻腕。'),
    I('哑铃交替弯举', 'arm', 3, '10-12', '次/侧', 45, '坐姿或站姿都行，大臂固定，单侧弯举时手心朝上；\n别把哑铃甩上去，也别让肩膀跟着耸，手肘别往前移。'),
    I('锤式弯举', 'arm', 3, '10-12', '次', 60, '手心相对握哑铃，大臂贴住身体，弯举到肘部约 90°；\n别晃身体，也别让手腕弯来弯去，保持中立，慢起慢放。'),
    I('坐姿绳索下压', 'arm', 3, '12-15', '次', 60, '大臂夹紧身体，只靠肘部伸直把绳往下压，底端分开绳头；\n别耸肩，也别让大臂前后晃，肩胛骨先下沉。'),
    I('仰卧臂屈伸', 'arm', 3, '10-12', '次', 60, '仰卧凳上，大臂垂直地面，只屈肘把杠铃下放到额头附近；\n别让肘部往外张，也别用肩膀推，控制离心。'),
    I('窄距卧推', 'arm', 3, '8-10', '次', 90, '握距与肩同宽，肘部贴身体下放，推起时三头主导；\n别握太窄压手腕，也别让肘部外展成普通卧推，夹肘。'),

    /* 核心 6 */
    I('平板支撑', 'core', 3, '30-60', '秒', 45, '肘部在肩正下方，收紧肚子和屁股，身体保持一条直线；\n别塌腰，也别把屁股撅太高，宁短勿塌，核心一直绷住。'),
    I('侧平板支撑', 'core', 3, '30-45', '秒/侧', 45, '肘部在肩下，髋部抬起，身体从肩到脚成一条直线；\n别让髋往下掉，也别把身体往前转，每侧坚持同样时间。'),
    I('卷腹', 'core', 3, '15-20', '次', 45, '下背贴地，下巴微收，用肚子把肩胛骨卷离地面；\n别用手拽脖子，也别靠惯性坐起来，呼气时收紧，腹部发力。'),
    I('悬垂举腿', 'core', 3, '10-12', '次', 60, '双手握杠、肩胛下沉，屈膝把腿抬到髋部高度以上；\n别摆腿借力，也别弓背，下放时慢慢控制住，别晃。'),
    I('绳索卷腹', 'core', 3, '12-15', '次', 60, '跪在龙门架前，绳子放头两侧，用肚子把上身卷向膝盖；\n别用手臂拉绳，也别用髋部前后晃，下巴微收。'),
    I('仰卧举腿', 'core', 3, '12-15', '次', 45, '仰卧凳上，双手抓凳沿，下背贴凳，把双腿抬到垂直；\n别用惯性甩腿，也别让腰拱起，下放时控制住。'),

    /* 有氧 4 */
    I('跑步机坡度走', 'cardio', 1, '20-30', '分钟', 0, '坡度调到 8-12%，速度保持能说话但微喘，脚掌踩实；\n别抓着扶手，也别一直小碎步，步幅自然，身体微微前倾。'),
    I('划船机', 'cardio', 1, '15-20', '分钟', 0, '先用腿蹬，再把把手拉到下胸，回程按相反顺序；\n别只用手臂拉，也别弓背，节奏保持稳定，让腿当主力。'),
    I('椭圆机', 'cardio', 1, '20-30', '分钟', 0, '脚掌踩实踏板，身体直立，手臂和腿配合着推拉；\n别把阻力调太低靠惯性晃，也别一直压着扶手，核心收紧。'),
    I('动感单车', 'cardio', 1, '20-30', '分钟', 0, '座椅调到髋部高度，踩踏时膝盖别完全伸直，核心稳住；\n别把阻力调太低猛蹬，也别弓背趴把，脚掌踩平。')
  ];

  global.FitExLib = {
    groups: GROUPS,
    items: ITEMS,
    byGroup: function (gid) {
      return ITEMS.filter(function (x) { return x.group === gid; });
    },

<script>
/* js/core.js */
/* ==========================================================================
   训练搭子 · 纯逻辑 core.js
   --------------------------------------------------------------------------
   这里只做「算」，不碰 DOM，方便单独跑测试（node 也能 require）。
   ========================================================================== */
(function (global) {
  'use strict';

  var DAY_MS = 86400000;
  var WEEK_CN = ['一', '二', '三', '四', '五', '六', '日'];

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  /** Date -> 'YYYY-MM-DD'（本地时区） */
  function isoOf(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  /** 'YYYY-MM-DD' -> 当地中午的 Date，避免时区/夏令时把日期算歪 */
  function parseISO(iso) {
    var p = String(iso).split('-');
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]), 12, 0, 0, 0);
  }

  function todayISO() { return isoOf(new Date()); }

  function addDays(iso, n) {
    var d = parseISO(iso);
    d.setDate(d.getDate() + n);
    return isoOf(d);
  }

  /** 相差天数：b - a */
  function diffDays(a, b) {
    return Math.round((parseISO(b).getTime() - parseISO(a).getTime()) / DAY_MS);
  }

  /** 周几：周一 = 0 … 周日 = 6 */
  function dowMon(iso) {
    return (parseISO(iso).getDay() + 6) % 7;
  }

  function dowName(iso) { return '周' + WEEK_CN[dowMon(iso)]; }

  function monthKey(iso) { return String(iso).slice(0, 7); }

  /** 11月21日 */
  function fmtMD(iso) {
    var d = parseISO(iso);
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  /** 11月21日 周六 */
  function fmtFull(iso) { return fmtMD(iso) + ' ' + dowName(iso); }

  function relLabel(iso, today) {
    today = today || todayISO();
    var n = diffDays(today, iso);
    if (n === 0) return '今天';
    if (n === -1) return '昨天';
    if (n === 1) return '明天';
    if (n === -2) return '前天';
    if (n === 2) return '后天';
    return dowName(iso);
  }

  /** 从某个开始日期算：第几周（0–3）、第几轮（1 起）、周几 */
  function planPosition(startISO, dateISO) {
    var diff = diffDays(startISO, dateISO);
    var weeksFromStart = Math.floor(diff / 7);
    var weekIdx = ((weeksFromStart % 4) + 4) % 4;
    var cycle = Math.floor(weeksFromStart / 4) + 1;
    if (weeksFromStart < 0) cycle = 0; // 开始日期之前
    return { diff: diff, weeksFromStart: weeksFromStart, weekIdx: weekIdx, cycle: cycle, dow: dowMon(dateISO) };
  }

  /** 本周一 */
  function mondayOf(iso) { return addDays(iso, -dowMon(iso)); }

  /** 完成度：已完成的组 / 总组数 */
  function progress(log) {
    if (!log) return { done: 0, total: 0, pct: 0, exDone: 0, exTotal: 0 };
    if (log.kind === 'rest') {
      var items = log.restItems || [];
      var d = items.filter(function (i) { return i.done; }).length;
      return { done: d, total: items.length, pct: items.length ? d / items.length : 0, exDone: d, exTotal: items.length, rest: true };
    }
    var total = 0, done = 0, exDone = 0;
    (log.exercises || []).forEach(function (ex) {
      var sets = ex.done || [];
      total += sets.length;
      var c = sets.filter(Boolean).length;
      done += c;
      if (sets.length && c === sets.length) exDone++;

    return {
      done: done, total: total,
      pct: total ? done / total : 0,

  }

  /** 连续打卡天数；今天没打卡则从昨天开始往前数 */
  function streak(logs, profile, today) {
    today = today || todayISO();
    var cur = today;
    var k = logKey(profile, cur);
    if (!logs[k] || !logs[k].checkedIn) cur = addDays(cur, -1);
    var n = 0, guard = 0;
    while (guard++ < 2000) {
      var l = logs[logKey(profile, cur)];
      if (!l || !l.checkedIn) break;
      n++;
      cur = addDays(cur, -1);
    }
    return n;
  }

  /** 两个人同一天都打卡的连续天数 */
  function duoStreak(logs, today) {
    today = today || todayISO();
    var cur = today;
    function bothDone(iso) {
      var a = logs[logKey('him', iso)], b = logs[logKey('her', iso)];
      return !!(a && a.checkedIn && b && b.checkedIn);
    }
    if (!bothDone(cur)) cur = addDays(cur, -1);
    var n = 0, guard = 0;
    while (guard++ < 2000) {

      n++;
      cur = addDays(cur, -1);
    }
    return n;

  function stats(logs, profile) {
    var keys = Object.keys(logs).filter(function (k) { return k.indexOf(profile + '@') === 0; });
    var total = 0, rest = 0, train = 0, monthCount = 0;
    var mk = monthKey(todayISO());
    var best = 0, run = 0, prev = null;
    var dates = keys.filter(function (k) { return logs[k].checkedIn; })
      .map(function (k) { return k.split('@')[1]; })
      .sort();
    dates.forEach(function (d) {
      if (logs[logKey(profile, d)].kind === 'rest') rest++; else train++;
      total++;
      if (monthKey(d) === mk) monthCount++;
      if (prev && diffDays(prev, d) === 1) run++; else run = 1;
      if (run > best) best = run;
      prev = d;

    return { total: total, rest: rest, train: train, monthCount: monthCount, bestStreak: best, current: streak(logs, profile) };
  }

  /** 本周（周一起）已打卡天数 */
  function weekCount(logs, profile, anyIso) {
    var mon = mondayOf(anyIso || todayISO());
    var n = 0;
    for (var i = 0; i < 7; i++) {
      var l = logs[logKey(profile, addDays(mon, i))];
      if (l && l.checkedIn) n++;
    }
    return n;
  }

  /** 生成月历格子（前面补空格），返回 [{iso, day, inMonth}] */
  function monthGrid(year, month) {
    var first = new Date(year, month, 1, 12);
    var lead = (first.getDay() + 6) % 7;
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    var cells = [];
    for (var i = 0; i < lead; i++) cells.push({ iso: null, day: 0, inMonth: false });
    for (var d = 1; d <= daysInMonth; d++) {
      cells.push({ iso: isoOf(new Date(year, month, d, 12)), day: d, inMonth: true });
    }
    while (cells.length % 7 !== 0) cells.push({ iso: null, day: 0, inMonth: false });
    return cells;
  }

  function uid() {
    return Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
  }

  function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }

  var Core = {
    WEEK_CN: WEEK_CN,
    pad: pad, isoOf: isoOf, parseISO: parseISO, todayISO: todayISO,
    addDays: addDays, diffDays: diffDays, dowMon: dowMon, dowName: dowName,
    monthKey: monthKey, fmtMD: fmtMD, fmtFull: fmtFull, relLabel: relLabel,
    planPosition: planPosition, mondayOf: mondayOf, logKey: logKey,
    progress: progress, streak: streak, duoStreak: duoStreak, stats: stats,
    weekCount: weekCount, monthGrid: monthGrid, uid: uid, clamp: clamp
  };

  global.FitCore = Core;
  if (typeof module !== 'undefined' && module.exports) module.exports = Core;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/store.js */
/* ==========================================================================
   训练搭子 · 存储与数据操作 store.js
   --------------------------------------------------------------------------
   · 所有数据只存在这台手机的浏览器里（localStorage），不上传任何服务器
   · state.schema 是版本号，升级时在 MIGRATIONS 里加一步即可，老数据不会丢
   ========================================================================== */
(function (global) {
  'use strict';

  var Core = global.FitCore, Data = global.FitData;
  var SCHEMA = 3;
  var KEY = 'trainmate.state.v1';
  var LEGACY = ['trainmate.state'];

  var state = null;
  var storageOK = true;
  var saveTimer = null;
  var listeners = { change: [] };

  /** 规范化一天的模板（保证字段齐全） */
  function normDay(d) {
    d = d || {};
    return {
      kind: d.kind === 'rest' ? 'rest' : 'train',
      icon: d.icon || (d.kind === 'rest' ? '🌙' : '💪'),
      intensity: d.intensity || (d.kind === 'rest' ? 'rest' : 'heavy'),
      title: d.title || '训练',
      focus: d.focus || '',
      warmup: d.warmup || '',
      cooldown: d.cooldown || '',
      exercises: (d.exercises || []).map(function (e) {
        return {
          name: e.name || '动作',
          sets: Number(e.sets) || 3,
          reps: String(e.reps == null ? '12' : e.reps),
          unit: e.unit || '次',
          rest: e.rest == null ? 90 : Number(e.rest),
          tip: e.tip || '',
          note: e.note || ''
        };
      }),
      restItems: (d.restItems || []).map(function (r) { return { text: typeof r === 'string' ? r : (r.text || '') }; })
    };
  }

  /* ---------------- 默认数据 ---------------- */
  function defaults() {
    var today = Core.todayISO();
    var now = new Date().toISOString();
    return {
      schema: SCHEMA,
      createdAt: now,
      profile: 'him',
      profiles: {
        him: { name: '他', avatar: '🐻', tag: '一起练' },
        her: { name: '她', avatar: '🐰', tag: '一起练' }
      },
      settings: {
        startDate: Core.mondayOf(today),
        restSeconds: 90,
        theme: 'auto',
        onboarded: false
      },
      /* v3：两个人的周计划（7 天，可拖动换天） */
      plan: { shared: true, days: Data.defaultPlan().map(normDay) },
      overrides: { him: {}, her: {} },   // 老字段，保留兼容，不再使用
      logs: {},
      messages: [],
      tasks: {},
      cycle: {
        him: { days: [], avg: 28, visible: true },
        her: { days: [], avg: 28, visible: true }
      },
      sync: { enabled: false, base: '', room: '', lastSyncAt: null, lastError: null },
      meta: {
        settingsAt: now,
        profilesAt: now,
        planAt: now,
        overridesAt: { him: now, her: now },
        cycleAt: { him: now, her: now }
      }
    };
  }

  /* ---------------- 迁移 ---------------- */
  var MIGRATIONS = {
    /* 从 0 / 无版本 升到 1 */
    0: function (s) {
      s.schema = 1;
      if (!s.overrides) s.overrides = { him: {}, her: {} };
      if (!s.logs) s.logs = {};
      if (!s.messages) s.messages = [];
      if (!s.tasks) s.tasks = {};
      return s;
    },
    /* 1 → 2：加同步、经期、时间戳 */
    1: function (s) {
      var d = defaults();
      s.schema = 2;
      s.cycle = s.cycle || d.cycle;
      s.sync = s.sync || d.sync;
      s.meta = s.meta || d.meta;
      return s;
    },
    /* 2 → 3：改成「两个人共用一套周计划」，并把他以前的改动搬进来 */
    2: function (s) {
      var base = Data.defaultPlan();
      var plan = [];
      var ovHim = (s.overrides || {}).him || {};
      var ovHer = (s.overrides || {}).her || {};
      for (var i = 0; i < 7; i++) {
        var ov = ovHim[String(i)] || ovHer[String(i)];
        plan.push(normDay(ov || base[i]));
      }
      s.plan = { shared: true, days: plan };
      s.schema = 3;
      s.meta = s.meta || {};
      s.meta.planAt = s.meta.planAt || new Date().toISOString();
      return s;
    }
  };

  function migrate(raw) {
    var s = raw || {};
    var v = typeof s.schema === 'number' ? s.schema : 0;
    while (v < SCHEMA) {
      var step = MIGRATIONS[v];
      if (!step) break;
      s = step(s) || s;
      v = s.schema;
    }
    // 关键字段兜底，防止手动改坏的数据导致白屏
    var d = defaults();
    s.schema = SCHEMA;
    s.profiles = Object.assign(d.profiles, s.profiles || {});
    s.profiles.him = Object.assign({ name: '他', avatar: '🐻', tag: '' }, s.profiles.him);
    s.profiles.her = Object.assign({ name: '她', avatar: '🐰', tag: '' }, s.profiles.her);
    s.settings = Object.assign(d.settings, s.settings || {});
    s.overrides = Object.assign({ him: {}, her: {} }, s.overrides || {});
    s.logs = s.logs || {};
    s.messages = s.messages || [];
    s.tasks = s.tasks || {};
    s.cycle = Object.assign({}, d.cycle, s.cycle || {});
    s.cycle.him = Object.assign({ days: [], avg: 28, visible: true }, s.cycle.him);
    s.cycle.her = Object.assign({ days: [], avg: 28, visible: true }, s.cycle.her);
    if (!Array.isArray(s.cycle.her.days)) s.cycle.her.days = [];
    s.sync = Object.assign({}, d.sync, s.sync || {});
    s.meta = Object.assign({}, d.meta, s.meta || {});
    s.meta.overridesAt = Object.assign({ him: s.createdAt || d.meta.settingsAt, her: s.createdAt || d.meta.settingsAt }, s.meta.overridesAt || {});
    s.meta.cycleAt = Object.assign({ him: s.createdAt || d.meta.settingsAt, her: s.createdAt || d.meta.settingsAt }, s.meta.cycleAt || {});
    /* v3 周计划兜底 */
    if (!s.plan || !Array.isArray(s.plan.days) || s.plan.days.length !== 7) {
      s.plan = { shared: true, days: Data.defaultPlan().map(normDay) };
      s.meta.planAt = s.meta.planAt || new Date().toISOString();
    }
    s.plan.shared = s.plan.shared !== false;
    s.plan.days = s.plan.days.map(normDay);
    if (s.profile !== 'her') s.profile = 'him';
    return s;
  }

  /* ---------------- 读写 ---------------- */
  function read() {
    try {
      var raw = null;
      try { raw = global.localStorage.getItem(KEY); } catch (e) { storageOK = false; }
      if (!raw) {
        for (var i = 0; i < LEGACY.length; i++) {
          try { raw = global.localStorage.getItem(LEGACY[i]); } catch (e2) {}
          if (raw) break;
        }
      }
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) {
      console.warn('[trainmate] 读取数据失败', e);
      return null;
    }
  }

  function persist() {
    if (!storageOK) return;
    try {
      global.localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {
      storageOK = false;
      console.warn('[trainmate] 保存失败（可能是隐私模式或空间已满）', e);
    }
  }

  function save() {
    if (saveTimer) return;
    saveTimer = setTimeout(function () {
      saveTimer = null;
      persist();
      fire('change');
    }, 100);
  }

  function saveNow() {
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
    persist();
    fire('change');
  }

  function fire(ev, payload) {
    (listeners[ev] || []).forEach(function (fn) {
      try { fn(payload); } catch (e) { console.error(e); }
    });
  }

  function on(ev, fn) { (listeners[ev] = listeners[ev] || []).push(fn); }

  function init() {
    state = migrate(read());
    saveNow();
    return state;
  }

  /* ---------------- 计划（一周 7 天，可拖动换天） ---------------- */
  /** 某天该练什么：从共用周计划里取第 dow 天（第 4 周自动减量） */
  function templateFor(profile, iso) {
    var pos = Core.planPosition(state.settings.startDate, iso);
    var day = normDay(state.plan.days[pos.dow] || Data.defaultPlan()[pos.dow]);
    var deload = pos.weekIdx === 3 && day.kind === 'train';
    return {
      kind: day.kind,
      icon: day.icon,
      intensity: day.intensity,
      title: day.title,
      focus: day.focus,
      warmup: day.warmup,
      cooldown: day.cooldown,
      weekNote: Data.weekNotes[pos.weekIdx] || '',
      exercises: day.exercises.map(function (e) {
        return Object.assign({}, e, { sets: deload ? Math.max(2, e.sets - 1) : e.sets });

      restItems: day.restItems.map(function (r) { return Object.assign({}, r); })

  }

  /** 直接拿某一天的周计划（不含减量，给设置页展示用） */
  function planDay(dow) {
    return normDay(state.plan.days[Number(dow)] || Data.defaultPlan()[Number(dow)]);
  }

  function planDays() {
    return state.plan.days.map(function (d, i) { return { dow: i, day: normDay(d) }; });
  }

  /** 把第 from 天整体挪到第 to 天（其余顺移）——拖动换天用 */
  function movePlanDay(from, to) {
    from = Number(from); to = Number(to);
    if (isNaN(from) || isNaN(to) || from === to) return state.plan.days;
    if (from < 0 || from > 6 || to < 0 || to > 6) return state.plan.days;
    var days = state.plan.days.slice();
    var moved = days.splice(from, 1)[0];
    days.splice(to, 0, moved);
    state.plan.days = days;
    state.meta.planAt = new Date().toISOString();
    saveNow();
    return days;
  }

  /** 交换两天的位置——拖动时更符合直觉（拖到哪天就跟哪天换） */
  function swapPlanDay(a, b) {
    a = Number(a); b = Number(b);
    if (isNaN(a) || isNaN(b) || a === b || a < 0 || a > 6 || b < 0 || b > 6) return state.plan.days;
    var days = state.plan.days.slice();
    var tmp = days[a]; days[a] = days[b]; days[b] = tmp;
    state.plan.days = days;
    state.meta.planAt = new Date().toISOString();
    saveNow();
    return days;
  }

  function newExercise(e) {
    return {
      id: Core.uid(),
      name: e.name || '新动作',
      sets: Number(e.sets) || 3,
      reps: String(e.reps || '12'),
      unit: e.unit || '次',
      rest: e.rest == null ? 90 : Number(e.rest),
      tip: e.tip || '',
      note: e.note || '',
      weight: e.weight == null ? '' : String(e.weight),
      done: []
    };
  }

  /** 找上一次做同名动作时用的重量，作占位提示 */
  function previousWeight(profile, iso, name) {
    var best = '', bestDate = '';
    var logs = state.logs || {};
    Object.keys(logs).forEach(function (k) {
      if (k.indexOf(profile + '@') !== 0) return;
      var l = logs[k];
      if (!l || l.date >= iso) return;
      (l.exercises || []).forEach(function (e) {
        if (e.name === name && e.weight && String(e.weight).trim() && l.date > bestDate) {
          best = String(e.weight);
          bestDate = l.date;
        }
      });
    });
    return best;
  }

  function buildLog(profile, iso) {
    var pos = Core.planPosition(state.settings.startDate, iso);
    var t = templateFor(profile, iso);
    var log = {
      date: iso,
      profile: profile,
      kind: t.kind,
      icon: t.icon,
      intensity: t.intensity,
      title: t.title,
      focus: t.focus,
      warmup: t.warmup,
      cooldown: t.cooldown,
      weekIdx: pos.weekIdx,
      cycle: pos.cycle,
      note: '',
      checkedIn: false,
      checkedInAt: null,
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
      exercises: [],
      restItems: []
    };
    (t.exercises || []).forEach(function (e) {
      var ex = newExercise(e);
      ex.done = new Array(Math.max(1, ex.sets)).fill(false);
      ex.lastWeight = previousWeight(profile, iso, e.name);
      log.exercises.push(ex);
    });
    (t.restItems || []).forEach(function (r) {
      log.restItems.push({ id: Core.uid(), text: r.text || String(r), done: false });
    });
    return log;
  }

  function getDay(profile, iso, create) {
    var k = Core.logKey(profile, iso);
    if (!state.logs[k] && create !== false) {

    }
    return state.logs[k] || null;

  function touch(log) {

  }

  /* ---------------- 训练动作操作 ---------------- */
  function findEx(log, id) {
    for (var i = 0; i < (log.exercises || []).length; i++) if (log.exercises[i].id === id) return log.exercises[i];
    return null;
  }

  function toggleSet(profile, iso, exId, idx) {
