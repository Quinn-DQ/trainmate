    var ex = findEx(log, exId);
    if (!ex) return null;
    ex.done = ex.done || [];
    while (ex.done.length < ex.sets) ex.done.push(false);
    ex.done[idx] = !ex.done[idx];
    touch(log);
    return log;
  }

  function setExerciseField(profile, iso, exId, field, value) {
    var log = getDay(profile, iso);
    var ex = findEx(log, exId);
    if (!ex) return null;
    if (field === 'sets') {
      var n = Core.clamp(Number(value) || 1, 1, 20);
      ex.sets = n;
      ex.done = ex.done || [];
      while (ex.done.length < n) ex.done.push(false);
      ex.done.length = n;
    } else if (field === 'rest') {
      ex.rest = Core.clamp(Number(value) || 0, 0, 900);
    } else {
      ex[field] = value;
    }
    touch(log);
    return log;
  }

  function addExercise(profile, iso, partial) {
    var log = getDay(profile, iso);
    if (log.kind === 'rest') {
      log.kind = 'train';
      log.intensity = 'heavy';
      log.icon = log.icon === '🌙' ? '💪' : log.icon;
    }
    var ex = newExercise(partial || {});
    ex.done = new Array(Math.max(1, ex.sets)).fill(false);
    log.exercises.push(ex);
    touch(log);
    return ex;
  }

  function removeExercise(profile, iso, exId) {
    var log = getDay(profile, iso);
    log.exercises = (log.exercises || []).filter(function (e) { return e.id !== exId; });
    touch(log);
    return log;
  }

  /** 用一个「整天」的对象覆盖这一天的记录，已勾的组按 id 保留 */
  function applyDayEdit(profile, iso, data) {
    var log = getDay(profile, iso);
    var oldById = {};
    (log.exercises || []).forEach(function (e) { oldById[e.id] = e; });

    log.kind = data.kind === 'rest' ? 'rest' : 'train';
    log.icon = data.icon || (log.kind === 'rest' ? '🌙' : '💪');
    log.intensity = data.intensity || (log.kind === 'rest' ? 'rest' : 'heavy');
    log.title = data.title || log.title || '训练';
    log.warmup = data.warmup || '';
    log.cooldown = data.cooldown || '';

    log.exercises = (data.exercises || []).map(function (e) {
      var prev = oldById[e.id];
      var sets = Core.clamp(Number(e.sets) || 1, 1, 20);
      var ex = {
        id: e.id || Core.uid(),
        name: e.name,
        sets: sets,
        reps: e.reps,
        unit: e.unit || '次',
        rest: e.rest == null ? 90 : e.rest,
        tip: e.tip || '',
        note: e.note || '',
        weight: prev && prev.weight != null ? prev.weight : (e.weight || ''),
        lastWeight: prev && prev.lastWeight ? prev.lastWeight : '',
        done: []
      };
      for (var i = 0; i < sets; i++) ex.done.push(prev && prev.done ? !!prev.done[i] : false);
      return ex;
    });

    var oldRest = {};
    (log.restItems || []).forEach(function (r) { oldRest[r.id] = r; });
    log.restItems = (data.restItems || []).map(function (r) {
      var prev2 = oldRest[r.id];
      return { id: r.id || Core.uid(), text: r.text, done: prev2 ? !!prev2.done : false };
    });

    touch(log);
    return log;
  }

  /** 直接写入某天的周计划（以后每个这种星期几都生效） */
  function setTemplateOverride(profile, dow, data) {
    state.plan.days[Number(dow)] = normDay({
      kind: data.kind,
      icon: data.icon,
      intensity: data.intensity,
      title: data.title,
      focus: data.focus,
      warmup: data.warmup,
      cooldown: data.cooldown,
      exercises: data.exercises,
      restItems: data.restItems
    });
    state.meta.planAt = new Date().toISOString();
    saveNow();
    return state.plan.days[Number(dow)];
  }

  /* ---------------- 动作排序 ---------------- */
  function reorderExercises(profile, iso, orderedIds) {
    var log = getDay(profile, iso);
    var map = {};
    (log.exercises || []).forEach(function (e) { map[e.id] = e; });
    var next = [];
    orderedIds.forEach(function (id) { if (map[id]) { next.push(map[id]); delete map[id]; } });
    // 没在列表里的（理论上不会有）补到最后，避免动作丢失
    (log.exercises || []).forEach(function (e) { if (map[e.id]) next.push(e); });
    log.exercises = next;
    touch(log);
    return log;
  }

  /* ---------------- 经期 ---------------- */
  function cycleOf(profile) {
    var c = state.cycle[profile] || (state.cycle[profile] = { days: [], avg: 28, visible: true });
    if (!Array.isArray(c.days)) c.days = [];
    return c;
  }

  function toggleCycleDay(profile, iso) {
    var c = cycleOf(profile);
    var i = c.days.indexOf(iso);
    if (i > -1) c.days.splice(i, 1); else c.days.push(iso);
    c.days.sort();
    state.meta.cycleAt[profile] = new Date().toISOString();
    saveNow();
    return c.days.indexOf(iso) > -1;
  }

  function isCycleDay(profile, iso) {
    return cycleOf(profile).days.indexOf(iso) > -1;
  }

  /** 今天处在经期第几天（不在经期返回 0） */
  function cycleDayIndex(profile, iso) {
    if (!isCycleDay(profile, iso)) return 0;
    var n = 1, cur = iso;
    while (n < 60) {
      cur = Core.addDays(cur, -1);
      if (!isCycleDay(profile, cur)) break;
      n++;
    }
    return n;
  }

  /** 上一次/正在进行的经期开始日 + 预测下次 */
  function cycleInfo(profile, iso) {
    var c = cycleOf(profile);
    var days = c.days.slice().sort();
    if (!days.length) return { has: false, days: 0, active: false, lastStart: null, next: null, avg: c.avg || 28 };
    var active = isCycleDay(profile, iso);
    var start = null;
    if (active) {
      start = iso;
      while (isCycleDay(profile, Core.addDays(start, -1))) start = Core.addDays(start, -1);
    } else {
      start = days[days.length - 1];
    }
    var avg = Number(c.avg) || 28;
    return {
      has: true,
      total: days.length,
      active: active,
      dayIndex: active ? cycleDayIndex(profile, iso) : 0,
      lastStart: start,
      next: Core.addDays(start, avg),
      avg: avg
    };
  }

  function setCycleSetting(profile, key, val) {
    var c = cycleOf(profile);
    c[key] = val;
    state.meta.cycleAt[profile] = new Date().toISOString();
    saveNow();
  }

  /* ---------------- 同步 ---------------- */
  function setSync(patch) {
    state.sync = Object.assign({}, state.sync, patch || {});
    // 直接落盘、不触发 change：否则每次同步成功都会再触发一次同步
    persist();
  }

  /** 用合并后的整份数据替换本地（同步用），不触发 push */
  function replaceState(next) {
    if (!next) return state;
    var syncCfg = Object.assign({}, state.sync);
    state = migrate(next);
    state.sync = syncCfg;
    saveNow();
    return state;
  }

  /* ---------------- 休息日清单 ---------------- */
  function toggleRestItem(profile, iso, id) {
    var log = getDay(profile, iso);
    (log.restItems || []).forEach(function (r) { if (r.id === id) r.done = !r.done; });
    touch(log);
    return log;
  }

  function addRestItem(profile, iso, text) {
    var log = getDay(profile, iso);
    log.restItems = log.restItems || [];
    log.restItems.push({ id: Core.uid(), text: text || '新的恢复项', done: false });
    touch(log);
    return log;
  }

  function removeRestItem(profile, iso, id) {
    var log = getDay(profile, iso);
    log.restItems = (log.restItems || []).filter(function (r) { return r.id !== id; });
    touch(log);
    return log;
  }

  /* ---------------- 打卡 ---------------- */
  function setCheckIn(profile, iso, on) {
    var log = getDay(profile, iso);
    log.checkedIn = !!on;
    log.checkedInAt = on ? new Date().toISOString() : null;
    touch(log);
    return log;
  }

  function setDayNote(profile, iso, text) {
    var log = getDay(profile, iso);
    log.note = text || '';
    touch(log);
    return log;
  }

  function setMood(profile, iso, mood) {
    var log = getDay(profile, iso);
    log.mood = mood || null;
    touch(log);
    return log;
  }

  /* ---------------- 把某天的实际安排存成周计划 ---------------- */
  function saveAsTemplate(profile, iso) {
    var log = getDay(profile, iso);
    var dow = Core.dowMon(iso);
    state.plan.days[dow] = normDay({
      kind: log.kind,
      icon: log.icon,
      intensity: log.intensity,
      title: log.title,
      focus: log.focus,
      warmup: log.warmup,
      cooldown: log.cooldown,
      exercises: (log.exercises || []).map(function (e) {
        return { name: e.name, sets: e.sets, reps: e.reps, unit: e.unit, rest: e.rest, tip: e.tip, note: e.note };
      }),
      restItems: (log.restItems || []).map(function (r) { return { text: r.text }; })
    });
    state.meta.planAt = new Date().toISOString();
    saveNow();
    return state.plan.days[dow];
  }

  /** 恢复成内置的那一天 */
  function clearTemplate(profile, dow) {
    state.plan.days[Number(dow)] = normDay(Data.defaultPlan()[Number(dow)]);
    state.meta.planAt = new Date().toISOString();
    saveNow();
    return state.plan.days[Number(dow)];
  }

  /** 这一天跟内置的比，有没有改过 */
  function templateOf(profile, dow) {
    var cur = state.plan.days[Number(dow)];
    var base = Data.defaultPlan()[Number(dow)];
    if (!cur) return null;
    var a = JSON.stringify(normDay(cur));
    var b = JSON.stringify(normDay(base));
    return a === b ? null : cur;
  }

  /* ---------------- 双人互动 ---------------- */
  function messages() { return state.messages || []; }

  function addMessage(from, text) {
    var t = String(text || '').trim();
    if (!t) return null;
    var m = { id: Core.uid(), from: from, text: t.slice(0, 300), at: new Date().toISOString() };
    state.messages.push(m);
    if (state.messages.length > 120) state.messages = state.messages.slice(-120);
    saveNow();
    return m;
  }

  function removeMessage(id) {
    state.messages = (state.messages || []).filter(function (m) { return m.id !== id; });
    saveNow();
  }

  function taskOf(iso) {
    if (!state.tasks[iso]) state.tasks[iso] = { by: { him: false, her: false } };
    state.tasks[iso].by = state.tasks[iso].by || { him: false, her: false };
    return state.tasks[iso];
  }

  function toggleTask(iso, who) {
    var t = taskOf(iso);
    t.by[who] = !t.by[who];
    saveNow();
    return t;
  }

  /* ---------------- 设置 ---------------- */
  function setSetting(k, v) {
    state.settings[k] = v;
    state.meta.settingsAt = new Date().toISOString();
    saveNow();
  }
  function setProfileField(who, k, v) {
    if (!state.profiles[who]) return;
    state.profiles[who][k] = v;
    state.meta.profilesAt = new Date().toISOString();
    saveNow();
  }
  function setActive(who) { state.profile = who === 'her' ? 'her' : 'him'; saveNow(); }

  /* ---------------- 备份 ---------------- */
  function exportObject() {
    return { app: 'trainmate', exportedAt: new Date().toISOString(), schema: SCHEMA, state: state };
  }
  function exportJSON() { return JSON.stringify(exportObject(), null, 2); }

  function importJSON(text) {
    var parsed = JSON.parse(text);
    var incoming = parsed && parsed.state ? parsed.state : parsed;
    if (!incoming || !incoming.profiles || !incoming.logs) throw new Error('格式不对：不是「训练搭子」的备份文件');
    state = migrate(incoming);
    saveNow();
    return state;
  }

  function reset(keepProfiles) {
    var names = { him: state.profiles.him, her: state.profiles.her };
    var set = Object.assign({}, state.settings);
    state = defaults();
    if (keepProfiles) { state.profiles = names; state.settings = set; }
    saveNow();
    return state;
  }

  function wipeLogs() {
    state.logs = {};
    state.tasks = {};
    saveNow();
  }

  var Store = {
    SCHEMA: SCHEMA,
    KEY: KEY,
    init: init,
    get state() { return state; },
    get storageOK() { return storageOK; },
    save: save,
    saveNow: saveNow,
    on: on,
    getDay: getDay,
    ensureDay: ensureDay,
    templateFor: templateFor,
    templateOf: templateOf,
    planDay: planDay,
    planDays: planDays,
    movePlanDay: movePlanDay,
    swapPlanDay: swapPlanDay,
    toggleSet: toggleSet,
    setExerciseField: setExerciseField,
    addExercise: addExercise,
    removeExercise: removeExercise,
    applyDayEdit: applyDayEdit,
    reorderExercises: reorderExercises,
    setTemplateOverride: setTemplateOverride,
    previousWeight: previousWeight,
    cycleOf: cycleOf,
    toggleCycleDay: toggleCycleDay,
    isCycleDay: isCycleDay,
    cycleDayIndex: cycleDayIndex,
    cycleInfo: cycleInfo,
    setCycleSetting: setCycleSetting,
    setSync: setSync,
    replaceState: replaceState,
    findEx: findEx,
    toggleRestItem: toggleRestItem,
    addRestItem: addRestItem,
    removeRestItem: removeRestItem,
    setCheckIn: setCheckIn,
    setDayNote: setDayNote,
    setMood: setMood,
    saveAsTemplate: saveAsTemplate,
    clearTemplate: clearTemplate,
    messages: messages,
    addMessage: addMessage,
    removeMessage: removeMessage,
    taskOf: taskOf,
    toggleTask: toggleTask,
    setSetting: setSetting,
    setProfileField: setProfileField,
    setActive: setActive,
    exportJSON: exportJSON,
    importJSON: importJSON,
    reset: reset,
    wipeLogs: wipeLogs
  };

  global.FitStore = Store;
  if (typeof module !== 'undefined' && module.exports) module.exports = Store;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/registry.js */
/* ==========================================================================
   训练搭子 · 扩展端口 registry.js
   --------------------------------------------------------------------------
   以后要加新功能（体重曲线、组间自动计时、云端同步、照片打卡…），
   不用改老代码，只要新建一个 js/features/xxx.js，在里面调用：

     FitApp.registerFeature({
       id: 'weight-chart',
       label: '体重曲线',
       where: 'us',                 // today | us | me  —— 挂在哪个页面
       render: function (ctx) { return '<div class="card">…</div>'; }
     });

   还可以：
     FitApp.registerTab({ id, label, icon, render })
     FitApp.on('checkin' | 'change' | 'tab' | 'boot', fn)
     FitApp.store / FitApp.core / FitApp.data / FitApp.ui  —— 都是活的引用
   ========================================================================== */
(function (global) {
  'use strict';

  var FEATURES = [];
  var TABS = [];
  var HOOKS = {};
  var LOG = [];

  var App = {
    version: '1.4.1',
    schema: 3,
    buildDate: '2026-11-27',

    /* 功能模块 */
    registerFeature: function (f) {
      if (!f || !f.id) throw new Error('registerFeature 需要 id');
      if (FEATURES.some(function (x) { return x.id === f.id; })) return f;
      FEATURES.push(f);
      return f;
    },
    features: function (where) {
      return where ? FEATURES.filter(function (f) { return f.where === where; }) : FEATURES.slice();
    },
    /** 渲染某个槽位里的所有功能，返回 HTML 片段数组 */
    renderSlot: function (where, ctx) {
      return FEATURES.filter(function (f) { return f.where === where && typeof f.render === 'function'; })
        .map(function (f) {
          try { return { id: f.id, label: f.label, html: f.render(ctx) }; }
          catch (e) {
            console.error('[feature:' + f.id + ']', e);
            return { id: f.id, label: f.label, html: '' };
          }
        })
        .filter(function (x) { return x.html; });
    },

    /* 新页面 */
    registerTab: function (t) {
      if (!t || !t.id) throw new Error('registerTab 需要 id');
      if (TABS.some(function (x) { return x.id === t.id; })) return t;
      TABS.push(t);
      return t;
    },
    tabs: function () { return TABS.slice(); },

    /* 事件 */
    on: function (ev, fn) { (HOOKS[ev] = HOOKS[ev] || []).push(fn); return fn; },
    emit: function (ev, payload) {
      (HOOKS[ev] || []).forEach(function (fn) {
        try { fn(payload); } catch (e) { console.error('[hook:' + ev + ']', e); }
      });
    },

    /* 升级日志（显示在设置页，让用户知道改了什么） */
    log: function (version, text) { LOG.push({ version: version, text: text, at: new Date().toISOString() }); },
    changelog: function () { return LOG.slice().reverse(); },

    /* 运行时注入（boot.js 里赋值） */
    store: null,
    core: null,
    data: null,
    ui: null
  };

  App.log('1.0.0', '第一版：双人档案切换、每日训练/休息日、组数打卡、日历回看、双人挑战与留言、组间计时器、战报图。');
  App.log('1.1.0', '双人同步（两台手机共用记录）、健身房动作库 56 个、拖拽排序、本周对决、成就徽章、进度照片、经期记录。');
  App.log('1.2.0', '同步改成「私密 GitHub Gist」，不用部署任何服务；新增 GitHub Pages 部署包（deploy/）。');
  App.log('1.2.1', '「我的 → 关于」里加了使用手册入口；手册 guide.html 上线（带截图和更新日志）。');
  App.log('1.3.0', '同步加了「更新令牌」和「同步自检」：令牌被删或过期时可以原地换掉，记录不会丢。');
  App.log('1.4.0', '换成你们的一周计划（推 / 有氧 / 背 / 有氧 / 臀腿 / 拉伸 / 休息，两人共用）；周计划按住 ☰ 拖动就能换天；动作库点名字看要领；修掉同步会把令牌写进 Gist、导致令牌被自动吊销的问题。');
  App.log('1.4.1', '加了「网站挂了也能打开」的保护：服务器返回 404 时自动用手机里的缓存，不会再白屏。');

  global.FitApp = App;
})(window);
