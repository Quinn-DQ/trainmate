<script>
/* js/sync.js */
/* ==========================================================================
   训练搭子 · 双人同步 sync.js
   --------------------------------------------------------------------------
   两台手机各自离线可用，谁在线谁把「合并后的整份数据」推上去，另一边拉下来合并。
   合并规则（都是"谁新用谁"，不会丢记录）：
     · 每天的训练记录：按 log.updatedAt 取新
     · 留言：按 id 合并去重（两边都会看到对方说的话）
     · 每日挑战：任意一边打勾就算完成
     · 计划模板 / 名字 / 经期 / 开始日期：各自带时间戳，取新
     · 主题、当前身份：每台手机自己的偏好，不同步

   两种存数据的方式（mode）：
     1) 'gist' —— 用一个**私密 GitHub Gist** 当云盘（推荐，什么都不用部署）
        需要一次 GitHub 访问令牌（勾 gist 权限），App 里点一下就会自动建 Gist。
     2) 'http' —— 你自己的小服务，接口：
        GET  {base}/state?room=xxx              → {rev, state}
        POST {base}/state?room=xxx {rev, state} → {rev} | 409 {rev}
        实现见 server/（局域网 server.js / Cloudflare Worker / Deno）
   ========================================================================== */
(function (global) {
  'use strict';

  var Core = global.FitCore, Store = global.FitStore;
  /* FitApp 在 registry.js 里创建，这里必须懒取，不能在校验时缓存 */
  function app() { return global.FitApp; }
  function emit(ev, payload) {
    try { var a = app(); if (a && a.emit) a.emit(ev, payload); } catch (e) { console.warn('[sync]', e); }
  }

  var busy = false;
  var pollTimer = null;
  var pushTimer = null;
  var lastErrorToast = 0;

  var GH_API = 'https://api.github.com';
  var GH_FILE = 'trainmate.json';

  /* ---------------- 配置 ---------------- */
  function cfg() { return Store.state.sync || {}; }
  function isGist() { return cfg().mode === 'gist'; }

  function enabled() {
    var c = cfg();
    if (!c.enabled) return false;
    if (c.mode === 'gist') return !!(c.token && c.gistId);
    return !!(c.base && c.room);
  }

  function normalizeBase(base) {
    var b = String(base || '').trim().replace(/\/+$/, '');
    if (!b) return '';
    if (!/^https?:\/\//i.test(b)) b = 'https://' + b;
    return b;
  }

  function url(path) {
    var c = cfg();
    return normalizeBase(c.base) + path + '?room=' + encodeURIComponent(c.room);
  }

  function ts(x) { var n = Date.parse(x || ''); return isNaN(n) ? 0 : n; }

  function newRoom() {
    try {
      var a = new Uint8Array(12);
      global.crypto.getRandomValues(a);
      return Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
    } catch (e) {
      return String(Date.now()).slice(-8) + Math.random().toString(16).slice(2, 10);
    }
  }

  function safeParse(text) {
    try { return JSON.parse(text); } catch (e) { return null; }
  }

  /* ---------------- 只比较"该同步的部分" ---------------- */
  function snapshot(s) {
    s = s || {};
    return JSON.stringify({
      logs: s.logs || {},
      messages: s.messages || [],
      tasks: s.tasks || {},
      plan: s.plan || {},
      profiles: s.profiles || {},
      cycle: s.cycle || {},
      meta: s.meta || {},
      settings: {
        startDate: s.settings ? s.settings.startDate : '',
        restSeconds: s.settings ? s.settings.restSeconds : 0
      }
    });
  }

  /**
   * 推上云端之前，把「本机配置」剔掉。
   * sync 里存着令牌和房间号；profile 是当前身份。
   * 少了这一步，令牌会被写进 Gist，GitHub 的密钥扫描会把它当泄露并自动吊销
   * —— 这就是 v1.3 之前「刚连上几秒就失效」的原因。
   */
  function publicState(s) {
    var out = JSON.parse(JSON.stringify(s || {}));
    delete out.sync;
    delete out.profile;
    return out;
  }

  /* ---------------- 合并 ---------------- */
  function mergeStates(local, remote) {
    if (!remote) return local;
    var out = JSON.parse(JSON.stringify(local));
    out.meta = out.meta || {};
    out.meta.overridesAt = out.meta.overridesAt || {};
    out.meta.cycleAt = out.meta.cycleAt || {};
    var rm = remote.meta || {};
    var rOver = rm.overridesAt || {};
    var rCycle = rm.cycleAt || {};

    /* 训练记录 */
    var rl = remote.logs || {};
    Object.keys(rl).forEach(function (k) {
      var a = out.logs[k], b = rl[k];
      if (!a) { out.logs[k] = b; return; }
      if (ts(b.updatedAt) > ts(a.updatedAt)) out.logs[k] = b;
    });

    /* 留言 */
    var byId = {};
    (out.messages || []).concat(remote.messages || []).forEach(function (m) {
      if (m && m.id) byId[m.id] = m;
    });
    out.messages = Object.keys(byId).map(function (k) { return byId[k]; })
      .sort(function (a, b) { return ts(a.at) - ts(b.at); })
      .slice(-200);

    /* 每日挑战 */
    out.tasks = out.tasks || {};
    Object.keys(remote.tasks || {}).forEach(function (d) {
      var a = out.tasks[d], b = remote.tasks[d] || {};
      if (!a) { out.tasks[d] = b; return; }
      a.by = a.by || {}; b.by = b.by || {};
      a.by.him = !!(a.by.him || b.by.him);
      a.by.her = !!(a.by.her || b.by.her);
    });

    /* 名字 */
    if (ts(rm.profilesAt) > ts(out.meta.profilesAt)) {
      out.profiles = remote.profiles || out.profiles;
      out.meta.profilesAt = rm.profilesAt;
    }

    /* 开始日期 / 默认组间休息（主题是每台手机自己的，不同步） */
    if (ts(rm.settingsAt) > ts(out.meta.settingsAt)) {
      out.settings.startDate = remote.settings.startDate || out.settings.startDate;
      out.settings.restSeconds = remote.settings.restSeconds == null ? out.settings.restSeconds : remote.settings.restSeconds;
      out.meta.settingsAt = rm.settingsAt;
    }

    /* 每周计划 / 经期（v3 起计划是共用的一份） */
    if (ts(rm.planAt) > ts(out.meta.planAt)) {
      if (remote.plan && Array.isArray(remote.plan.days)) {
        out.plan = remote.plan;
      }
      out.meta.planAt = rm.planAt;
    }
    ['him', 'her'].forEach(function (w) {
      if (ts(rCycle[w]) > ts(out.meta.cycleAt[w])) {
        out.cycle[w] = (remote.cycle || {})[w] || out.cycle[w];
        out.meta.cycleAt[w] = rCycle[w];
      }
    });

    return out;
  }

  /* ---------------- GitHub Gist ---------------- */
  function ghHeaders(token) {
    return {
      'Accept': 'application/vnd.github+json',
      'Authorization': 'Bearer ' + (token || cfg().token),
      'X-GitHub-Api-Version': '2022-11-28'
    };
  }

  function ghError(status, body) {
    var msg = body && body.message ? '：' + body.message : '';
    if (status === 401) return new Error('令牌无效或已过期，重新生成一个');
    if (status === 403) return new Error('令牌没有 gist 权限，或者请求太频繁' + msg);
    if (status === 404) return new Error('找不到那个 Gist（被删了？或者令牌没权限）');
    return new Error('GitHub 返回 ' + status + msg);
  }

  function ghJson(res) {
    return res.json().then(function (j) {
      if (!res.ok) throw ghError(res.status, j);
      return j;
    }, function () {
      if (!res.ok) throw ghError(res.status, null);
      return {};
    });
  }

  function gistPull() {
    return fetch(GH_API + '/gists/' + encodeURIComponent(cfg().gistId), {
      headers: ghHeaders(), cache: 'no-store'
    }).then(ghJson).then(function (g) {
      var f = g.files && g.files[GH_FILE];
      var rev = ts(g.updated_at);
      if (!f) return { rev: rev, state: null };
      if (f.truncated && f.raw_url) {
        return fetch(f.raw_url, { cache: 'no-store' })
          .then(function (r) { return r.text(); })
          .then(function (txt) { return { rev: rev, state: safeParse(txt) }; });
      }
      return { rev: rev, state: safeParse(f.content || '') };
    });
  }

  function gistPush(state) {
    var body = { files: {} };
    /* 关键：先剔除本机配置（令牌），否则会被 GitHub 的密钥扫描判为泄露并自动吊销 */
    body.files[GH_FILE] = { content: JSON.stringify(publicState(state)) };
    return fetch(GH_API + '/gists/' + encodeURIComponent(cfg().gistId), {
      method: 'PATCH',
      headers: Object.assign({ 'Content-Type': 'application/json' }, ghHeaders()),
      body: JSON.stringify(body)
    }).then(ghJson).then(function (g) {
      return { rev: ts(g.updated_at), pushed: true };
    });
  }

  function createGist(token) {
    var body = {
      description: '训练搭子 · 两个人的训练记录（别删，删了同步就没了）',
      public: false,
      files: {}
    };
    body.files[GH_FILE] = { content: JSON.stringify({ v: 1, createdAt: new Date().toISOString() }) };
    return fetch(GH_API + '/gists', {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, ghHeaders(token)),
      body: JSON.stringify(body)
    }).then(ghJson).then(function (g) { return g.id; });
  }

  /* ---------------- 自建服务 ---------------- */
  function getJSON(u) {
    return fetch(u, { cache: 'no-store', headers: { 'Accept': 'application/json' } })
      .then(function (r) {
        if (r.status === 404) return { rev: 0, state: null };
        if (!r.ok) throw new Error('服务器返回 ' + r.status);
        return r.json();
      });
  }

  function postJSON(u, body) {
    return fetch(u, {
      method: 'POST',
      cache: 'no-store',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) {
      if (r.status === 409) return r.json().then(function (j) { return { conflict: true, rev: j.rev }; });
      if (!r.ok) throw new Error('服务器返回 ' + r.status);
      return r.json();
    });
  }

  /* ---------------- 失败处理 ---------------- */
  function fail(err) {
    var msg = (err && err.message) || '同步失败';
    if (/Failed to fetch|NetworkError|Load failed/i.test(msg)) msg = '连不上同步服务（检查网络 / 令牌 / 地址）';
    Store.setSync({ lastError: msg });
    var now = Date.now();
    if (now - lastErrorToast > 60000) {
      lastErrorToast = now;
      var ui = app() && app().ui;
      if (ui && ui.toast) ui.toast('同步失败：' + msg, 3200);
    }
    emit('sync', { ok: false, error: msg });
  }

  /* ---------------- 主流程 ---------------- */
  function syncNow(opts) {
    opts = opts || {};
    if (!enabled()) return Promise.resolve({ skipped: '未开启同步' });
    if (busy) return Promise.resolve({ skipped: '正在同步' });
    busy = true;

    var attempt = function (tries) {
      var pull = isGist() ? gistPull() : getJSON(url('/state'));
      return pull.then(function (remote) {
        var merged = mergeStates(Store.state, remote.state);
        var localChanged = snapshot(merged) !== snapshot(Store.state);
        if (localChanged) {
          Store.replaceState(merged);
          emit('sync:applied', {});
        }
        var needPush = snapshot(merged) !== snapshot(remote.state || {});
        if (!needPush) return { rev: remote.rev || 0, pushed: false, pulled: localChanged };

        if (isGist()) {
          return gistPush(merged).then(function (r) {
            return { rev: r.rev, pushed: true, pulled: localChanged };
          });
        }

        return postJSON(url('/state'), { rev: remote.rev || 0, state: publicState(merged) }).then(function (res) {
          if (res.conflict) {
            if (tries > 1) throw new Error('同步冲突，请再试一次');
            return attempt(tries + 1);
          }
          return { rev: res.rev, pushed: true, pulled: localChanged };
        });
      });
    };

    var finish = function (res) { busy = false; return res; };
    return attempt(2).then(function (res) {
      Store.setSync({ lastSyncAt: new Date().toISOString(), lastError: null });
      emit('sync', { ok: true, result: res });
      return res;
    }).catch(function (err) {
      fail(err);
      return { error: String(err && err.message || err) };
    }).then(finish, finish);
  }

  /* ---------------- 自动同步 ---------------- */
  function schedule(delay) {
    if (!enabled() || busy) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(function () { syncNow({ silent: true }); }, delay == null ? 2500 : delay);
  }

  function start() {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(function () {
      if (document.visibilityState === 'visible') syncNow({ silent: true });
    }, 25000);
    if (enabled()) schedule(1200);

    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && enabled()) syncNow({ silent: true });
    });
    global.addEventListener('online', function () { if (enabled()) syncNow({ silent: true }); });
    global.addEventListener('focus', function () { if (enabled()) syncNow({ silent: true }); });
    Store.on('change', function () { schedule(); });
  }

  /* ---------------- 配对码 ---------------- */
  function encode(str) {
    try { return global.btoa(unescape(encodeURIComponent(str))); }
    catch (e) { return ''; }
  }
  function decode(str) {
    try { return decodeURIComponent(escape(global.atob(str))); }
    catch (e) { return ''; }
  }

  function pairCode() {
    var c = cfg();
    if (c.mode === 'gist') {
      if (!c.gistId || !c.token) return '';
      return 'TM2.' + encode(JSON.stringify({ m: 'gist', g: c.gistId, t: c.token })).replace(/=+$/, '');
    }
    if (!c.base || !c.room) return '';
    return 'TM1.' + encode(JSON.stringify({ b: normalizeBase(c.base), r: c.room })).replace(/=+$/, '');
  }

  function applyPairCode(code) {
    var raw = String(code || '').trim().replace(/\s+/g, '');
    var ver = '';
    if (raw.indexOf('TM2.') === 0) { ver = 'TM2'; raw = raw.slice(4); }
    else if (raw.indexOf('TM1.') === 0) { ver = 'TM1'; raw = raw.slice(4); }
    else { ver = 'TM1'; }

    while (raw.length % 4) raw += '=';
    var json = decode(raw);
    if (!json) throw new Error('配对码看不懂，确认复制完整');
    var obj;
    try { obj = JSON.parse(json); } catch (e) { throw new Error('配对码看不懂，确认复制完整'); }

    if (ver === 'TM2' || obj.m === 'gist') {
      if (!obj.g || !obj.t) throw new Error('配对码里缺少 Gist 或令牌');
      connectGist(obj.t, obj.g);
      return obj;
    }
    if (!obj.b || !obj.r) throw new Error('配对码里缺少地址或房间号');
    connect(obj.b, obj.r);
    return obj;
  }

  /* ---------------- 连接 / 断开 ---------------- */
  function connect(base, room) {
    Store.setSync({
      enabled: true,
      mode: 'http',
      base: normalizeBase(base),
      room: room || newRoom(),
      lastError: null
    });
    Store.saveNow();
    return cfg();
  }

  function connectGist(token, gistId) {
    Store.setSync({
      enabled: true,
      mode: 'gist',
      token: String(token || '').trim(),
      gistId: String(gistId || '').trim(),
      lastError: null
    });
    Store.saveNow();
    return cfg();
  }

  function disconnect() {
    Store.setSync({ enabled: false, lastError: null });
    Store.saveNow();
  }

  /** 只换令牌，不动 Gist —— 记录还在原处，换令牌不会丢数据 */
  function updateToken(token) {
    Store.setSync({ token: String(token || '').trim(), lastError: null });
    Store.saveNow();
    return cfg();
  }

  /** 自检：这串令牌还认不认、Gist 还读不读得到 */
  function verify() {
    var out = { ok: false, login: '', gistOk: false, error: '' };
    if (!isGist()) {
      out.error = '当前不是 GitHub 同步模式';
      return Promise.resolve(out);
    }
    return fetch(GH_API + '/user', { headers: ghHeaders(), cache: 'no-store' })
      .then(ghJson)
      .then(function (u) {
        out.login = u.login;
        return fetch(GH_API + '/gists/' + encodeURIComponent(cfg().gistId), {
          headers: ghHeaders(), cache: 'no-store'
        }).then(ghJson);
      })
      .then(function (g) {
        out.gistOk = true;
        out.ok = true;
        out.updatedAt = g.updated_at;
        return out;
      })
      .catch(function (e) {
        out.error = e.message;
        return out;
      });
  }

  function status() {
    var c = cfg();
    return {
      enabled: enabled(),
      mode: c.mode || 'http',
      gistId: c.gistId || '',
      hasToken: !!c.token,
      tokenTail: String(c.token || '').slice(-4),
      base: c.base || '',
      room: c.room || '',
      lastSyncAt: c.lastSyncAt || null,
      lastError: c.lastError || null,
      busy: busy
    };
  }

  global.FitSync = {
    enabled: enabled,
    isGist: isGist,
    config: cfg,
    status: status,
    connect: connect,
    connectGist: connectGist,
    createGist: createGist,
    disconnect: disconnect,
    updateToken: updateToken,
    verify: verify,
    newRoom: newRoom,
    pairCode: pairCode,
    applyPairCode: applyPairCode,
    mergeStates: mergeStates,
    snapshot: snapshot,
    publicState: publicState,
    now: syncNow,
    schedule: schedule,
    start: start,
    normalizeBase: normalizeBase
  };
})(window);

</script>
<script>
/* js/ui.js */
/* ==========================================================================
   训练搭子 · 界面 ui.js
   ========================================================================== */
(function (global) {
  'use strict';

  var Core = global.FitCore, Data = global.FitData, Store = global.FitStore, App = global.FitApp;

  /* ---------- 小工具 ---------- */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function clock(isoTime) {
    var d = new Date(isoTime);
    if (isNaN(d)) return '';
    return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }
  var TONE_ICON = { heavy: '训练日', light: '轻量日', rest: '休息日' };

  var UI = {
    view: {
      tab: 'today',
      date: Core.todayISO(),
      calYear: 0,
      calMonth: 0,
      sorting: false,
      openTip: {}
    },
    esc: esc
  };
  var view = UI.view;
  var _y = Core.parseISO(Core.todayISO());
  view.calYear = _y.getFullYear();
  view.calMonth = _y.getMonth();

  function st() { return Store.state; }
  function who() { return st().profile; }
  function prof(key) { return st().profiles[key || who()]; }
  function other(key) { return key === 'him' ? 'her' : 'him'; }

  /* ---------- 进度环 ---------- */
  function ring(pct, cls) {
    var R = 52, C = 2 * Math.PI * R;
    var off = (C * (1 - Core.clamp(pct, 0, 1))).toFixed(1);
    return '<svg class="ring ' + (cls || '') + '" viewBox="0 0 120 120" aria-hidden="true">' +
      '<circle class="ring-bg" cx="60" cy="60" r="' + R + '"/>' +
      '<circle class="ring-fg" cx="60" cy="60" r="' + R + '" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + off + '"/>' +
      '</svg>';
  }

  function targetText(ex) {
    var rep = ex.reps + ' ' + (ex.unit || '次');
    return Number(ex.sets) > 1 ? ex.sets + ' 组 × ' + rep : rep;
  }

  function tipHTML(tip) {
    if (!tip) return '';
    return tip.split('\n').filter(Boolean).map(function (line) {
      return '<p>' + esc(line) + '</p>';
    }).join('');
  }

  /* ---------- Toast ---------- */
  var toastTimer = null;
  function toast(msg, ms) {
    var el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, ms || 1900);
  }
  UI.toast = toast;

  /* ---------- 复制 ---------- */
  function copy(text) {
    return new Promise(function (resolve) {
      function fallback() {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        ta.remove();
        resolve(ok);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { resolve(true); }, fallback);
      } else {
        fallback();
      }
    });
  }
  UI.copy = copy;

  /* ---------- 弹层 ---------- */
  function openIn(id, html, opts) {
    opts = opts || {};
    var root = document.getElementById(id);
    if (!root) return;
    root.hidden = false;
    root.className = 'modal-root show' + (opts.sheet === false ? ' center' : '');
    root.innerHTML = '<div class="modal-mask" data-act="close-modal"></div>' +
      '<div class="sheet ' + (opts.cls || '') + '" role="dialog" aria-modal="true">' +
      (opts.bare ? html : '<div class="sheet-grip"></div>' + html) +
      '</div>';
    document.body.classList.add('locked');
    requestAnimationFrame(function () { root.classList.add('in'); });
  }
  function openModal(html, opts) { openIn('modal-root', html, opts); }
  function openTop(html, opts) { openIn('modal-root-2', html, opts); }

  function topRoot() {
    var r2 = document.getElementById('modal-root-2');
    if (r2 && !r2.hidden) return r2;
    var r1 = document.getElementById('modal-root');
    if (r1 && !r1.hidden) return r1;
    return null;
  }

  function closeModal() {
    var root = topRoot();
    if (!root) return;
    root.classList.remove('in');
    setTimeout(function () {
      if (!root.classList.contains('in')) { root.hidden = true; root.innerHTML = ''; }
      if (!topRoot()) document.body.classList.remove('locked');
    }, 180);
  }

  function closeAll() {
    ['modal-root-2', 'modal-root'].forEach(function (id) {
      var r = document.getElementById(id);
      if (r) { r.classList.remove('in'); r.hidden = true; r.innerHTML = ''; }
    });
    document.body.classList.remove('locked');
  }

  function isModalOpen() { return !!topRoot(); }

  function refreshModal(html) {
    var root = topRoot();
    if (!root) return;
    var sheet = root.querySelector('.sheet');
    if (!sheet) return;
    var scroll = sheet.querySelector('.sheet-body');
    var keep = scroll ? scroll.scrollTop : 0;
    sheet.innerHTML = (sheet.classList.contains('no-grip') ? '' : '<div class="sheet-grip"></div>') + html;
    var body2 = sheet.querySelector('.sheet-body');
    if (body2) body2.scrollTop = keep;
  }
  UI.openModal = openModal;
  UI.openTop = openTop;
  UI.closeModal = closeModal;
  UI.closeAll = closeAll;
  UI.isModalOpen = isModalOpen;
  UI.refreshModal = refreshModal;

  /* ---------- 顶部身份切换 ---------- */
  function renderWho() {
    var host = document.getElementById('who');
    var cur = who();
    var s = st();
    var html = ['him', 'her'].map(function (k) {
      var p = s.profiles[k];
      var on = k === cur;
      return '<button class="who-btn ' + (on ? 'on' : '') + '" data-act="gender" data-who="' + k + '" role="tab" aria-selected="' + on + '">' +
        '<span class="who-av">' + esc(p.avatar) + '</span>' +
        '<span class="who-name">' + esc(p.name) + '</span>' +
        '</button>';
    }).join('');
    host.innerHTML = html;
    host.setAttribute('data-active', cur);
    document.documentElement.setAttribute('data-who', cur);
    var sub = document.getElementById('brand-sub');
    if (sub) sub.textContent = s.profiles.him.name + ' × ' + s.profiles.her.name;
  }

  /* ---------- 底部导航 ---------- */
  var BASE_TABS = [
    { id: 'today', label: '今天', icon: 'M4 6h16M4 12h10M4 18h7' },
    { id: 'calendar', label: '记录', icon: 'M4 7h16v13H4zM8 3v4M16 3v4M4 11h16' },
    { id: 'us', label: '我们', icon: 'M8 11a3 3 0 100-6 3 3 0 000 6zM16 11a3 3 0 100-6 3 3 0 000 6zM3 20c0-2.8 2.2-5 5-5s5 2.2 5 5M13 20c0-2.8 2.2-5 5-5s5 2.2 5 5' },
    { id: 'me', label: '我的', icon: 'M12 12a4 4 0 100-8 4 4 0 000 8zM4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5' }
  ];
  function allTabs() { return BASE_TABS.concat(App.tabs()); }

  function renderTabs() {
    var host = document.getElementById('tabbar');
    host.innerHTML = allTabs().map(function (t) {
      var on = t.id === view.tab;
      return '<button class="tab ' + (on ? 'on' : '') + '" data-act="tab" data-tab="' + esc(t.id) + '">' +
        '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + t.icon + '" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
        '<span>' + esc(t.label) + '</span></button>';
    }).join('');
  }

  /* ======================================================================
     今天
     ====================================================================== */
  function renderToday() {
    var s = st(), k = who(), p = s.profiles[k];
    var iso = view.date;
    var log = Store.ensureDay(k, iso);
    var pos = Core.planPosition(s.settings.startDate, iso);
    var pr = Core.progress(log);
    var today = Core.todayISO();
    var isToday = iso === today;
    var isRest = log.kind === 'rest';
    var out = [];

    /* 日期条 */
    out.push(
      '<div class="datebar">' +
        '<button class="db-arrow" data-act="prevday" aria-label="前一天">' +
          '<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
        '</button>' +
        '<button class="db-center" data-act="gotoday">' +
          '<span class="db-main">' + Core.fmtMD(iso) + '</span>' +
          '<span class="db-sub">' + (isToday ? '今天' : Core.relLabel(iso, today)) + ' · ' + Core.dowName(iso) +
            (pos.cycle > 0 ? ' · 第 ' + pos.cycle + ' 轮' : '') + '</span>' +
        '</button>' +
        '<button class="db-arrow" data-act="nextday" aria-label="后一天">' +
          '<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
        '</button>' +
      '</div>'
    );
    if (!isToday) {
      out.push('<div class="backbar"><span>正在看 ' + Core.fmtMD(iso) + ' · ' + Core.relLabel(iso, today) + '</span><button class="chip-btn" data-act="gotoday">回到今天</button></div>');
    }

    /* 主卡 */
    out.push(
      '<section class="hero tone-' + (log.intensity || 'heavy') + '">' +
        '<div class="hero-chips">' +
          '<span class="chip">' + esc(log.icon) + ' ' + esc(log.title) + '</span>' +
          '<span class="chip ghost">' + (TONE_ICON[log.intensity] || '训练日') + '</span>' +
          (pos.cycle > 0 ? '<span class="chip ghost">第 ' + pos.cycle + ' 轮 · W' + (pos.weekIdx + 1) + '</span>' : '') +
        '</div>' +
        '<div class="hero-body">' +
          '<div class="hero-left">' +
            '<div class="hero-big">' + Math.round(pr.pct * 100) + '<i>%</i></div>' +
            '<div class="hero-sub">' + (isRest
              ? pr.done + '/' + pr.total + ' 项恢复完成'
              : pr.exDone + '/' + pr.exTotal + ' 个动作 · ' + pr.done + '/' + pr.total + ' 组') + '</div>' +
          '</div>' +
          '<div class="hero-ring">' + ring(pr.pct) + '</div>' +
        '</div>' +
        (log.weekNote ? '<p class="hero-note">' + esc(log.weekNote) + '</p>' : '') +
        '<p class="hero-quote">「' + esc(Data.quoteFor(pos.diff)) + '」</p>' +
        '<div class="hero-actions">' +
          '<button class="hero-btn" data-act="edit-day">调整今天</button>' +
          '<button class="hero-btn" data-act="edit-template">改成本周固定</button>' +
        '</div>' +
      '</section>'
    );

    /* 周期提示等（可插拔） */
    var topSlot = App.renderSlot('today-top', { profile: k, iso: iso, log: log });
    if (topSlot.length) {
      out.push('<div class="slot slot-top">' + topSlot.map(function (x) { return '<div data-feature="' + x.id + '">' + x.html + '</div>'; }).join('') + '</div>');
    }

    /* 热身 */
    if (log.warmup) {
      if (log.kind === 'rest') {
        out.push('<div class="note-card calm"><span class="nc-icon">🌙</span><div><b>今天的目标</b><p>' + esc(log.warmup) + '</p></div></div>');
      } else {
        out.push('<div class="note-card warm"><span class="nc-icon">🔥</span><div><b>热身</b><p>' + esc(log.warmup) + '</p></div></div>');
      }
    }

    /* 训练动作 */
    if (!isRest) {
      if (!log.exercises.length) {
        out.push('<div class="empty"><div class="empty-emoji">🫥</div><p>今天还没有安排动作</p>' +
          '<button class="btn-ghost" data-act="add-ex">加一个动作</button> ' +
          '<button class="btn-ghost" data-act="pick-lib">从动作库挑</button></div>');
      } else {
        out.push('<div class="ex-toolbar">' +
          '<span class="et-count">' + log.exercises.length + ' 个动作</span>' +
          (view.sorting
            ? '<span class="et-tip">按住卡片拖动排序</span><button class="link" data-act="sort-done">完成</button>'
            : '<button class="link" data-act="sort-start">排序</button>') +
        '</div>');
        out.push('<div class="ex-list' + (view.sorting ? ' sorting' : '') + '" id="ex-list">' +
          log.exercises.map(function (ex, i) { return exCard(ex, i, log); }).join('') + '</div>');
        if (!view.sorting) out.push('<button class="add-line" data-act="pick-lib">＋ 从动作库添加</button>');
      }
    } else {
      out.push('<div class="rest-list">' + (log.restItems || []).map(function (item) {
        return '<button class="rest-item ' + (item.done ? 'on' : '') + '" data-act="rest-item" data-id="' + item.id + '">' +
          '<span class="ri-box">' + (item.done ? '✓' : '') + '</span>' +
          '<span class="ri-txt">' + esc(item.text) + '</span></button>';
      }).join('') + '</div>');
      out.push('<button class="add-line" data-act="edit-day">调整恢复清单</button>');
    }

    /* 放松 */
    if (log.cooldown) {
      out.push('<div class="note-card calm"><span class="nc-icon">🌿</span><div><b>练完放松</b><p>' + esc(log.cooldown) + '</p></div></div>');
    }

    /* 打卡区 */
    out.push(checkinBlock(log, pr, k, iso));

    /* 备注 */
    out.push(
      '<section class="card day-note">' +
        '<label class="lab">今天想记点什么</label>' +
        '<textarea data-bind="day-note" rows="2" placeholder="状态、重量突破、哪里不舒服…">' + esc(log.note || '') + '</textarea>' +
      '</section>'
    );

    /* 挂载位 */
    var slot = App.renderSlot('today', { profile: k, iso: iso, log: log });
    if (slot.length) {
      out.push('<div class="slot">' + slot.map(function (x) { return '<div data-feature="' + x.id + '">' + x.html + '</div>'; }).join('') + '</div>');
    }

    return out.join('');
  }

  function exCard(ex, index, log) {
    var done = ex.done || [];
    var allDone = done.length && done.every(Boolean);
    var sorting = !!view.sorting;
    var sets = '';
    for (var i = 0; i < (ex.sets || 0); i++) {
      sets += '<button class="set ' + (done[i] ? 'on' : '') + '" data-act="set" data-ex="' + ex.id + '" data-idx="' + i + '" aria-label="第 ' + (i + 1) + ' 组">' +
        '<span>' + (done[i] ? '✓' : (i + 1)) + '</span></button>';
    }
    return '<article class="ex ' + (allDone ? 'is-done' : '') + (sorting ? ' sortable' : '') + '" data-ex="' + ex.id + '">' +
      '<div class="ex-top">' +
        (sorting ? '<span class="drag-handle" aria-hidden="true">☰</span>' : '') +
        '<div class="ex-title"><span class="ex-no">' + (index + 1) + '</span><h3>' + esc(ex.name) + '</h3></div>' +
        (sorting ? '<span class="sort-hint">按住拖</span>'
          : '<button class="icon-btn" data-act="edit-ex" data-ex="' + ex.id + '" aria-label="编辑动作">⋯</button>') +
      '</div>' +
      '<div class="ex-meta">' +
        '<span class="tag-strong">' + targetText(ex) + '</span>' +
        (ex.rest ? '<span class="tag">组间 ' + ex.rest + 's</span>' : '') +
        (ex.tip ? '<button class="link" data-act="tip" data-ex="' + ex.id + '">要领</button>' : '') +
      '</div>' +
      '<div class="sets">' + sets + '</div>' +
      (ex.tip ? '<div class="tip-body">' + tipHTML(ex.tip) + '</div>' : '') +
      '<div class="ex-foot">' +
        '<label class="wgt">重量 <input type="text" inputmode="decimal" enterkeyhint="done" data-bind="weight" data-ex="' + ex.id + '" value="' + esc(ex.weight || '') + '" placeholder="' + esc(ex.lastWeight || '—') + '"><i>kg</i></label>' +
        (ex.note ? '<span class="ex-note">' + esc(ex.note) + '</span>' : '') +
        '<button class="link mini" data-act="timer" data-sec="' + (ex.rest || st().settings.restSeconds) + '">计时</button>' +
      '</div>' +
    '</article>';
  }

  function checkinBlock(log, pr, k, iso) {
    var streak = Core.streak(st().logs, k, iso);
    if (log.checkedIn) {
      return '<section class="checkin done">' +
        '<div class="ci-left"><span class="ci-badge">✓</span>' +
          '<div><b>今天已打卡</b><small>' + clock(log.checkedInAt) + ' 完成 · 连续 ' + streak + ' 天' +
          (log.mood ? ' · ' + moodEmoji(log.mood) : '') + '</small></div></div>' +
        '<button class="link danger" data-act="uncheck">撤销</button>' +
      '</section>';
    }
    var tip = log.kind === 'rest'
      ? (pr.done >= 2 ? '恢复得不错，可以打卡了' : '勾几项再打卡也可以')
      : (pr.total && pr.done >= pr.total ? '全部组都完成了，收工！' : '还有 ' + Math.max(0, pr.total - pr.done) + ' 组没勾，先打卡也行');
    return '<section class="checkin">' +
      '<div class="ci-left"><span class="ci-badge ghost">' + (log.kind === 'rest' ? '🌿' : '💪') + '</span>' +
        '<div><b>' + (log.kind === 'rest' ? '恢复 ' + pr.done + '/' + pr.total : pr.done + '/' + pr.total + ' 组已完成') + '</b>' +
        '<small>' + tip + '</small></div></div>' +
      '<button class="btn-primary" data-act="checkin">打卡</button>' +
    '</section>';
  }

  function moodEmoji(m) { return m === 'great' ? '💪' : m === 'tired' ? '😮‍💨' : '🙂'; }

  /* ======================================================================
     记录 / 日历
     ====================================================================== */
  function renderCalendar() {
    var k = who();
    var y = view.calYear, m = view.calMonth;
    var cells = Core.monthGrid(y, m);
    var today = Core.todayISO();
    var s = st();
    var out = [];
    var monthLogs = {};
    Object.keys(s.logs).forEach(function (key) {
      if (key.indexOf(k + '@') !== 0) return;
      var iso = key.split('@')[1];
      if (Core.monthKey(iso) === (y + '-' + pad2(m + 1))) monthLogs[iso] = s.logs[key];
    });

    out.push('<div class="cal-head">' +
      '<button class="db-arrow" data-act="cal-prev">‹</button>' +
      '<span class="cal-title">' + y + ' 年 ' + (m + 1) + ' 月</span>' +
      '<button class="db-arrow" data-act="cal-next">›</button>' +
    '</div>');

    out.push('<div class="cal-week">' + ['一', '二', '三', '四', '五', '六', '日'].map(function (d) { return '<span>' + d + '</span>'; }).join('') + '</div>');

    out.push('<div class="cal-grid">' + cells.map(function (c) {
      if (!c.iso) return '<span class="cal-cell blank"></span>';
      var log = monthLogs[c.iso];
      var cls = [];
      if (c.iso === today) cls.push('is-today');
      if (c.iso > today) cls.push('is-future');
      if (log) {
        var pr = Core.progress(log);
        if (log.checkedIn) cls.push(log.kind === 'rest' ? 'is-rest' : 'is-checked');
        else if (pr.done > 0) cls.push('is-partial');
        else if (log.kind === 'rest') cls.push('is-restday');
      } else {
        // 还没记录的日子，用计划里的「休息日」淡淡标一下
        var tpl = Store.templateFor(k, c.iso);
        if (tpl && tpl.kind === 'rest') cls.push('is-restday');
      }
      return '<button class="cal-cell ' + cls.join(' ') + '" data-act="cal-day" data-iso="' + c.iso + '">' +
        '<span class="d">' + c.day + '</span>' +
        '<i class="dot"></i></button>';
    }).join('') + '</div>');

    out.push('<div class="cal-legend">' +
      '<span><i class="lg checked"></i>已打卡</span>' +
      '<span><i class="lg rest"></i>休息日</span>' +
      '<span><i class="lg partial"></i>练了一半</span>' +
      '<span><i class="lg none"></i>没记录</span>' +
    '</div>');

    /* 统计 */
    var stt = Core.stats(s.logs, k);
    var wk = Core.weekCount(s.logs, k, today);
    out.push('<div class="stat-grid">' +
      statCard('本月打卡', stt.monthCount, '天') +
      statCard('当前连续', stt.current, '天', '🔥') +
      statCard('累计训练', stt.train, '次') +
      statCard('最长连续', stt.bestStreak, '天') +
    '</div>');

    out.push('<div class="card week-strip"><div class="ws-head"><b>本周</b><span>' + wk + ' / 7 天</span></div>' +
      '<div class="ws-dots">' + (function () {
        var mon = Core.mondayOf(today);
        var html = '';
        for (var i = 0; i < 7; i++) {
          var d = Core.addDays(mon, i);
          var l = s.logs[Core.logKey(k, d)];
          var cls = l && l.checkedIn ? (l.kind === 'rest' ? 'on rest' : 'on') : (d === today ? 'today' : (d > today ? 'future' : ''));
          html += '<span class="ws-dot ' + cls + '"><i>' + ['一', '二', '三', '四', '五', '六', '日'][i] + '</i></span>';
        }
        return html;
      })() + '</div></div>');

    /* 最近记录 */
    var recent = Object.keys(s.logs).filter(function (key) {
      return key.indexOf(k + '@') === 0 && s.logs[key].checkedIn;
    }).map(function (key) { return s.logs[key]; })
      .sort(function (a, b) { return a.date < b.date ? 1 : -1; }).slice(0, 6);

    if (recent.length) {
      out.push('<div class="card list-card"><div class="lc-head"><b>最近练过</b></div>' + recent.map(function (l) {
        var pr = Core.progress(l);
        return '<button class="row" data-act="cal-day" data-iso="' + l.date + '">' +
          '<span class="row-date">' + Core.fmtMD(l.date) + '<i>' + Core.dowName(l.date) + '</i></span>' +
          '<span class="row-main">' + esc(l.icon) + ' ' + esc(l.title) + '</span>' +
          '<span class="row-side">' + (l.kind === 'rest' ? '恢复' : pr.done + ' 组') + '</span>' +
        '</button>';
      }).join('') + '</div>');
    }

    return out.join('');
  }

  function statCard(label, num, unit, emoji) {
    return '<div class="stat"><span class="stat-em">' + (emoji || '') + '</span><b>' + num + '<i>' + unit + '</i></b><span class="stat-lb">' + label + '</span></div>';
  }

  /* ======================================================================
     我们
     ====================================================================== */
  function renderUs() {
    var s = st(), today = Core.todayISO();
    var out = [];
    var duo = Core.duoStreak(s.logs, today);

    function col(k) {
      var p = s.profiles[k];
      var log = Store.ensureDay(k, today);
      var pr = Core.progress(log);
      var stt = Core.stats(s.logs, k);
      var done = log.checkedIn;
      return '<button class="duo-col ' + (k === who() ? 'me' : '') + '" data-act="gender" data-who="' + k + '">' +
        '<span class="duo-av">' + esc(p.avatar) + '</span>' +
        '<span class="duo-name">' + esc(p.name) + '</span>' +
        '<span class="duo-tag">' + esc(p.tag || '') + '</span>' +
        '<span class="duo-state ' + (done ? 'ok' : '') + '">' + (done ? '✓ 已打卡' : (log.kind === 'rest' ? '休息日' : (pr.done > 0 ? pr.done + '/' + pr.total + ' 组' : '还没开始'))) + '</span>' +
        '<span class="duo-streak">连续 ' + stt.current + ' 天</span>' +
      '</button>';
    }

    out.push('<section class="duo">' + col('him') +
      '<div class="duo-heart"><span>❤️</span><b>' + duo + '</b><small>一起坚持</small></div>' +
      col('her') + '</section>');

    /* 对方今天练什么 */
    var other = who() === 'him' ? 'her' : 'him';
    var oLog = Store.ensureDay(other, today);
    var oPr = Core.progress(oLog);
    var oEx = (oLog.exercises || []).slice(0, 4);
    out.push('<section class="card other-day">' +
      '<div class="lc-head"><b>' + esc(s.profiles[other].avatar) + ' ' + esc(s.profiles[other].name) + '今天</b>' +
        '<span>' + (oLog.checkedIn ? '已打卡 ✓' : (oPr.done > 0 ? oPr.done + '/' + oPr.total + ' 组' : '还没开始')) + '</span></div>' +
      '<p class="od-title">' + esc(oLog.icon) + ' ' + esc(oLog.title) + '</p>' +
      (oLog.kind === 'rest'
        ? '<p class="od-rest">今天是休息日，别硬练</p>'
        : '<div class="od-exs">' + oEx.map(function (ex) {
            var d = (ex.done || []).filter(Boolean).length;
            var full = d >= ex.sets;
            return '<span class="od-ex ' + (full ? 'on' : '') + '">' + esc(ex.name) + '<i>' + d + '/' + ex.sets + '</i></span>';
          }).join('') + (oLog.exercises.length > 4 ? '<span class="od-ex more">+' + (oLog.exercises.length - 4) + '</span>' : '') + '</div>') +
      (oLog.note ? '<p class="od-note">「' + esc(oLog.note) + '」</p>' : '') +
      '<p class="hint">' + ((typeof FitSync !== 'undefined' && FitSync.enabled()) ? '已开启同步，这是 TA 手机上最新的一次同步。' : '没开同步，这里显示的是本机记录。') + '</p>' +
    '</section>');

    var duelSlot = App.renderSlot('us-duel', { profile: who(), iso: today });
    if (duelSlot.length) out.push(slotsHTML(duelSlot));

    /* 今日挑战 */
    var task = Data.taskFor(Core.diffDays('2000-01-01', today));
    var ts = Store.taskOf(today);
    var bothDone = ts.by.him && ts.by.her;
    out.push('<section class="card task ' + (bothDone ? 'done' : '') + '">' +
      '<div class="task-head"><span class="chip">今日挑战</span>' + (bothDone ? '<span class="task-ok">双方达成 ✓</span>' : '') + '</div>' +
      '<p class="task-text">' + esc(task) + '</p>' +
      '<div class="task-btns">' +
        ['him', 'her'].map(function (k) {
          return '<button class="task-btn ' + (ts.by[k] ? 'on' : '') + '" data-act="task" data-who="' + k + '">' +
            s.profiles[k].avatar + ' ' + esc(s.profiles[k].name) + (ts.by[k] ? ' 完成' : ' 未完成') + '</button>';
        }).join('') +
      '</div>' +
    '</section>');

    /* 留言 */
    var msgs = Store.messages().slice(-30);
    out.push('<section class="card chat">' +
      '<div class="lc-head"><b>留言板</b><span>说点什么给对方</span></div>' +
      '<div class="chat-body">' +
        (msgs.length ? msgs.map(function (m) {
          var isHim = m.from === 'him';
          return '<div class="bubble ' + (isHim ? 'him' : 'her') + '">' +
            '<span class="bub-av">' + s.profiles[m.from].avatar + '</span>' +
            '<div class="bub-body"><p>' + esc(m.text) + '</p><small>' + s.profiles[m.from].name + ' · ' + clock(m.at) + '</small></div>' +
          '</div>';
        }).join('') : '<div class="chat-empty">还没有留言，今天先说一句「辛苦了」？</div>') +
      '</div>' +
      '<div class="cheers">' + Data.cheers.map(function (c) {
        return '<button class="cheer" data-act="cheer" data-text="' + esc(c) + '">' + esc(c) + '</button>';
      }).join('') + '</div>' +
      '<form class="chat-form" data-form="msg">' +
        '<input type="text" data-input="msg" maxlength="120" placeholder="以 ' + esc(prof().name) + ' 的身份留言…" autocomplete="off">' +
        '<button class="btn-send" type="submit" aria-label="发送">发送</button>' +
      '</form>' +
    '</section>');

    var slot = App.renderSlot('us', { profile: who(), iso: today });
    if (slot.length) out.push(slotsHTML(slot));

    var badgeSlot = App.renderSlot('us-badges', { profile: who(), iso: today });
    if (badgeSlot.length) out.push(slotsHTML(badgeSlot));

    var photoSlot = App.renderSlot('us-photos', { profile: who(), iso: today });
    if (photoSlot.length) out.push(slotsHTML(photoSlot));

    return out.join('');
  }

  function slotsHTML(list) {
    return '<div class="slot">' + list.map(function (x) {
      return '<div data-feature="' + x.id + '">' + x.html + '</div>';
    }).join('') + '</div>';
  }

  /* ======================================================================
     我的 / 设置
     ====================================================================== */
  function agoLabel(iso) {
    if (!iso) return '还没同步过';
    var diff = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
    if (isNaN(diff)) return '—';
    if (diff < 45) return '刚刚同步';
    if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
    if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
    return Math.floor(diff / 86400) + ' 天前';
  }

  function syncCardHTML() {
    var sync = st().sync || {};
    var on = (typeof FitSync !== 'undefined') && FitSync.enabled();
    if (!on) {
      return '<section class="card sync-card">' +
        '<div class="lc-head"><b>双人同步</b><span>未开启</span></div>' +
        '<p class="hint">打开之后，你俩的手机就共用同一份记录：谁勾了组、谁写了留言，另一边几秒内就能看到，' +
        '你这边加的动作她那边立刻能看见。用 <b>GitHub 同步</b>，不需要部署任何东西。</p>' +
        '<div class="btn-grid one"><button class="btn-primary wide" data-act="sync-setup">开启同步</button></div>' +
      '</section>';
    }
    var isGist = (sync.mode === 'gist');
    return '<section class="card sync-card on">' +
      '<div class="lc-head"><b>双人同步</b><span>' + (sync.lastError ? '⚠️ ' + esc(sync.lastError) : '✓ ' + agoLabel(sync.lastSyncAt)) + '</span></div>' +
      (isGist
        ? '<div class="kv"><span>方式</span><b>GitHub 私密 Gist</b></div>' +
          '<div class="kv"><span>编号</span><b class="mono">' + esc(String(sync.gistId).slice(0, 10)) + '…</b></div>'
        : '<div class="kv"><span>服务器</span><b class="mono">' + esc(FitSync.normalizeBase(sync.base)) + '</b></div>' +
          '<div class="kv"><span>房间号</span><b class="mono">' + esc(String(sync.room).slice(0, 6)) + '…' + esc(String(sync.room).slice(-4)) + '</b></div>') +
      '<div class="kv"><span>上次同步</span><b>' + agoLabel(sync.lastSyncAt) + '</b></div>' +
      '<div class="btn-grid" style="margin-top:10px">' +
        '<button class="btn-ghost" data-act="sync-now">立即同步</button>' +
        '<button class="btn-ghost" data-act="sync-copy">复制配对码</button>' +
        '<button class="btn-ghost" data-act="sync-setup">重新配对</button>' +
        '<button class="btn-ghost danger" data-act="sync-off">断开同步</button>' +
      '</div>' +
      '<p class="hint">两台手机各自都能离线用；联网后自动把新记录合并上去，谁后改的以谁为准，留言两边都会保留。</p>' +
    '</section>';
  }

  function renderMe() {
    var s = st(), k = who();
    var out = [];
    var monday = Core.mondayOf(Core.todayISO());
    var overview = [];
    for (var d = 0; d < 7; d++) {
      var t = Store.templateFor(k, Core.addDays(monday, d));
      overview.push({ dow: d, t: t });
    }

    out.push('<section class="card">' +
      '<div class="lc-head"><b>我们俩</b><span>改个名字，换手机也不丢</span></div>' +
      ['him', 'her'].map(function (w) {
        return '<label class="field-row">' +
          '<span class="fr-av">' + s.profiles[w].avatar + '</span>' +
          '<input type="text" data-bind="name" data-who="' + w + '" value="' + esc(s.profiles[w].name) + '" maxlength="8" placeholder="名字">' +
          '<span class="fr-hint">' + (w === 'him' ? '男生计划' : '女生计划') + '</span>' +
        '</label>';
      }).join('') +
    '</section>');

    out.push('<section class="card">' +
      '<div class="lc-head"><b>这一周怎么排</b><span>按住 ☰ 拖动，可以换天</span></div>' +
      '<label class="field-row"><span class="fr-label">开始日期</span>' +
        '<input type="date" data-bind="start-date" value="' + esc(s.settings.startDate) + '">' +
      '</label>' +
      '<div class="plan-list" id="plan-list">' + overview.map(function (o) {
        var t = o.t;
        return '<div class="row plan-row" data-dow="' + o.dow + '">' +
          '<span class="pr-day">周' + Core.WEEK_CN[o.dow] + '</span>' +
          '<button class="plan-name" data-act="plan-day" data-dow="' + o.dow + '">' +
            esc(t.icon) + ' ' + esc(t.title) + '</button>' +
          '<span class="row-side">' + (t.kind === 'rest' ? '休息' : (t.exercises.length + ' 个动作')) + '</span>' +
          '<span class="drag-h" data-drag="1" aria-hidden="true">☰</span>' +
        '</div>';
      }).join('') + '</div>' +
      '<button class="row plan-lib" data-act="open-library">' +
        '<span class="row-main">📚 动作库 · 56 个动作和要领</span>' +
        '<span class="row-side">查看 →</span>' +
      '</button>' +
      '<p class="hint">计划是你们俩共用的。点某一天可以改动作；<b>按住右边的 ☰ 拖到另一天，就能把休息日挪过去</b>（两天的安排互换）。只想改某一天，就在「今天」页点「调整今天」。</p>' +
    '</section>');

    out.push('<section class="card">' +
      '<div class="lc-head"><b>偏好</b></div>' +
      '<label class="field-row"><span class="fr-label">默认组间休息</span>' +
        '<input type="number" min="0" max="600" step="15" data-bind="rest-seconds" value="' + s.settings.restSeconds + '">' +
        '<span class="fr-hint">秒</span>' +
      '</label>' +
      '<div class="field-row"><span class="fr-label">主题</span>' +
        '<div class="seg" data-seg="theme">' +
          ['auto', 'light', 'dark'].map(function (v) {
            var label = v === 'auto' ? '跟随系统' : v === 'light' ? '浅色' : '深色';
            return '<button class="' + (s.settings.theme === v ? 'on' : '') + '" data-act="theme" data-theme="' + v + '">' + label + '</button>';
          }).join('') +
        '</div>' +
      '</div>' +
    '</section>');

    out.push(syncCardHTML());

    out.push('<section class="card">' +
      '<div class="lc-head"><b>数据</b><span>只存在这台手机上</span></div>' +
      '<div class="btn-grid">' +
        '<button class="btn-ghost" data-act="export">导出备份</button>' +
        '<button class="btn-ghost" data-act="copy">复制备份文本</button>' +
        '<button class="btn-ghost" data-act="import">导入备份</button>' +
        '<button class="btn-ghost danger" data-act="reset">清空数据</button>' +
      '</div>' +
      '<p class="hint">换手机 / 给对象装新机时：在一台手机上「导出备份」，把文件或文本发到另一台，再「导入备份」。开了同步就不用这么麻烦了。</p>' +
    '</section>');

    var meSlot = App.renderSlot('me', { profile: k });
    if (meSlot.length) out.push(slotsHTML(meSlot));

    out.push('<section class="card about">' +
      '<div class="lc-head"><b>关于</b><span>v' + App.version + '</span></div>' +
      '<a class="row" href="guide.html" target="_blank" rel="noopener">' +
        '<span class="row-main">📖 使用手册（怎么用、怎么改、更新日志）</span>' +
        '<span class="row-side">打开 →</span>' +
      '</a>' +
      '<p class="hint">' + (Store.storageOK ? '数据保存在本机浏览器，不会上传。' : '⚠️ 浏览器未允许本地保存，这次的数据关掉页面就会丢。') + '</p>' +
      '<div class="changelog">' + App.changelog().map(function (l) {
        return '<p><b>v' + esc(l.version) + '</b> ' + esc(l.text) + '</p>';
      }).join('') + '</div>' +
    '</section>');

    return out.join('');
  }

  /* ======================================================================
     渲染入口
     ====================================================================== */
  function render() {
    renderWho();
    renderTabs();
    var host = document.getElementById('view');
    var html = '';
    if (view.tab === 'today') html = renderToday();
    else if (view.tab === 'calendar') html = renderCalendar();
    else if (view.tab === 'us') html = renderUs();
    else if (view.tab === 'me') html = renderMe();
    else {
      var t = allTabs().filter(function (x) { return x.id === view.tab; })[0];
      if (t && typeof t.render === 'function') html = t.render({ profile: who() });
    }
    host.innerHTML = '<div class="page page-' + view.tab + '">' + html + '</div>';
    var todayLog = view.tab === 'today' ? Store.getDay(who(), view.date, false) : null;
    document.body.classList.toggle('is-rest-day', !!(todayLog && todayLog.kind === 'rest'));
    App.emit('tab', { tab: view.tab, date: view.date });
  }

  /** 局部刷新：只更新某个动作 / 进度，不整页重绘（避免输入框失焦） */
  function refreshTodayLight() {
    var host = document.getElementById('view');
    if (!host) return render();
    var log = Store.getDay(who(), view.date, false);
    if (!log) return render();
    var pr = Core.progress(log);
    var heroBig = host.querySelector('.hero-big');
    if (heroBig) heroBig.innerHTML = Math.round(pr.pct * 100) + '<i>%</i>';
    var heroSub = host.querySelector('.hero-sub');
    if (heroSub) {
      heroSub.textContent = log.kind === 'rest'
        ? pr.done + '/' + pr.total + ' 项恢复完成'
        : pr.exDone + '/' + pr.exTotal + ' 个动作 · ' + pr.done + '/' + pr.total + ' 组';
    }
    var heroRing = host.querySelector('.hero-ring');
    if (heroRing) heroRing.innerHTML = ring(pr.pct);
    var ci = host.querySelector('.checkin');
    if (ci && !log.checkedIn) {
      var b = ci.querySelector('b');
      if (b) b.textContent = log.kind === 'rest' ? ('恢复 ' + pr.done + '/' + pr.total) : (pr.done + '/' + pr.total + ' 组已完成');
    }
  }

  UI.render = render;
  UI.refreshTodayLight = refreshTodayLight;
  UI.moodEmoji = moodEmoji;
  UI.targetText = targetText;
  UI.prof = prof;
  UI.other = other;
  UI.who = who;
  UI.st = st;

  global.FitUI = UI;
})(window);

</script>
<script>
/* js/sheets.js */
/* ==========================================================================
   训练搭子 · 弹层与编辑 sheets.js
   --------------------------------------------------------------------------
   包含：打卡仪式、动作/整天编辑、固定模板、组间计时器、导入备份、新手引导、战报入口
   ========================================================================== */
(function (global) {
  'use strict';

  var Core = global.FitCore, Data = global.FitData, Store = global.FitStore, App = global.FitApp, UI = global.FitUI;
  var esc = UI.esc;

  function st() { return Store.state; }
  function q(sel, root) { return (root || document).querySelector(sel); }
  function qa(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  var UNITS = ['次', '次/侧', '秒', '秒/侧', '分钟', '步'];

  /* ======================================================================
     一、打卡仪式
     ====================================================================== */
  var pendingMood = null;
  function openCheckinSheet(profile, iso) {
    var log = Store.ensureDay(profile, iso);
    var pr = Core.progress(log);
    pendingMood = log.mood || null;
    var moods = [
      { k: 'great', e: '💪', t: '很爽' },
      { k: 'ok', e: '🙂', t: '一般' },
      { k: 'tired', e: '😮‍💨', t: '有点累' }
    ];
    UI.openModal(
      '<div class="sheet-head"><h2>' + (log.kind === 'rest' ? '恢复打卡' : '训练打卡') + '</h2></div>' +
      '<div class="sheet-body">' +
        '<div class="ci-summary">' +
          '<div class="cis-big">' + (log.kind === 'rest' ? pr.done + '/' + pr.total : pr.done + '/' + pr.total) + '<i>' + (log.kind === 'rest' ? ' 项' : ' 组') + '</i></div>' +
          '<div class="cis-txt">' + esc(log.icon) + ' ' + esc(log.title) + '<small>' + Core.fmtMD(iso) + ' · ' + Core.dowName(iso) + '</small></div>' +
        '</div>' +
        '<p class="lab">今天感觉怎么样</p>' +
        '<div class="moods">' + moods.map(function (m) {
          return '<button class="mood" data-act="mood" data-mood="' + m.k + '"><span>' + m.e + '</span><i>' + m.t + '</i></button>';
        }).join('') + '</div>' +
        '<p class="lab">留一句给以后的自己（可不填）</p>' +
        '<textarea data-input="checkin-note" rows="3" placeholder="今天哪里变强了？">' + esc(log.note || '') + '</textarea>' +
      '</div>' +
      '<div class="sheet-foot">' +
        '<button class="btn-ghost" data-act="close-modal">再等等</button>' +
        '<button class="btn-primary" data-act="do-checkin">完成打卡</button>' +
      '</div>'
    );
    syncMood();
  }

  function syncMood() {
    qa('.mood').forEach(function (b) { b.classList.toggle('on', b.dataset.mood === pendingMood); });
  }

  function doCheckin() {
    var k = UI.who(), iso = UI.view.date;
    var noteEl = q('[data-input="checkin-note"]');
    if (noteEl) Store.setDayNote(k, iso, noteEl.value.trim());
    if (pendingMood) Store.setMood(k, iso, pendingMood);
    Store.setCheckIn(k, iso, true);
    var log = Store.getDay(k, iso);
    var streak = Core.streak(st().logs, k, iso);
    UI.closeModal();
    App.emit('checkin', { profile: k, iso: iso, log: log, streak: streak });
    UI.render();
    celebrate(log, streak);
  }

  function celebrate(log, streak) {
    var pr = Core.progress(log);
    var title = log.kind === 'rest' ? '恢复也是训练' : '今天完成了';
    UI.openModal(
      '<div class="cheer-card tone-' + (log.intensity || 'heavy') + '">' +
        '<div class="cheer-mark">✓</div>' +
        '<h2>' + title + '</h2>' +
        '<p>' + esc(log.title) + ' · ' + (log.kind === 'rest' ? pr.done + ' 项恢复' : pr.done + ' 组') + '</p>' +
        '<div class="cheer-streak"><b>' + streak + '</b><span>天连续打卡</span></div>' +
        '<div class="cheer-btns">' +
          '<button class="btn-ghost" data-act="close-modal">好</button>' +
          '<button class="btn-primary" data-act="war-report" data-iso="' + log.date + '">生成战报</button>' +
        '</div>' +
      '</div>',
      { bare: true, cls: 'cheer-sheet' }
    );
  }

  /* ======================================================================
     二、编辑单个动作
     ====================================================================== */
  function openExerciseSheet(profile, iso, exId) {
    var log = Store.ensureDay(profile, iso);
    var ex = Store.findEx(log, exId);
    if (!ex) return;
    UI.openModal(
      '<div class="sheet-head"><h2>编辑动作</h2></div>' +
      '<div class="sheet-body">' +
        '<label class="lab">动作名称</label>' +
        '<input class="inp" data-ex-f="name" value="' + esc(ex.name) + '">' +
        '<div class="dgrid">' +
          '<label class="lab">组数<input class="inp" type="number" min="1" max="20" inputmode="numeric" data-ex-f="sets" value="' + ex.sets + '"></label>' +
          '<label class="lab">次数<input class="inp" data-ex-f="reps" value="' + esc(ex.reps) + '"></label>' +
          '<label class="lab">单位<select class="inp" data-ex-f="unit">' + UNITS.map(function (u) {
            return '<option ' + (u === ex.unit ? 'selected' : '') + '>' + u + '</option>';
          }).join('') + '</select></label>' +
          '<label class="lab">组间（秒）<input class="inp" type="number" min="0" max="600" step="15" data-ex-f="rest" value="' + ex.rest + '"></label>' +
        '</div>' +
        '<label class="lab">动作要领（一行一条）</label>' +
        '<textarea rows="4" data-ex-f="tip" placeholder="肩胛后收下沉…">' + esc(ex.tip) + '</textarea>' +
        '<label class="lab">给自己的备注</label>' +
        '<input class="inp" data-ex-f="note" value="' + esc(ex.note || '') + '" placeholder="例如：换成哑铃、左手弱一点">' +
      '</div>' +
      '<div class="sheet-foot">' +
        '<button class="btn-ghost danger" data-act="del-ex" data-ex="' + exId + '">删除动作</button>' +
        '<button class="btn-primary" data-act="save-ex" data-ex="' + exId + '">保存</button>' +
      '</div>'
    );
  }

  function saveExercise(exId) {
    var k = UI.who(), iso = UI.view.date;
    var get = function (f) { var el = q('[data-ex-f="' + f + '"]'); return el ? el.value : ''; };
    Store.setExerciseField(k, iso, exId, 'name', get('name').trim() || '未命名动作');
    Store.setExerciseField(k, iso, exId, 'sets', get('sets'));
    Store.setExerciseField(k, iso, exId, 'reps', get('reps').trim() || '10');
    Store.setExerciseField(k, iso, exId, 'unit', get('unit'));
    Store.setExerciseField(k, iso, exId, 'rest', get('rest'));
    Store.setExerciseField(k, iso, exId, 'tip', get('tip'));
    Store.setExerciseField(k, iso, exId, 'note', get('note').trim());
    UI.closeModal();
    UI.render();
    UI.toast('动作已更新');
  }

  function deleteExercise(exId) {
    var k = UI.who(), iso = UI.view.date;
    Store.removeExercise(k, iso, exId);
    UI.closeModal();
    UI.render();
    UI.toast('已删除这个动作');
  }

  /* ======================================================================
     三、整天编辑（今天 / 固定模板共用）
     ====================================================================== */
  var dayCtx = null;

  function draftFrom(src) {
    return {
      kind: src.kind || 'train',
      title: src.title || '训练',
      warmup: src.warmup || '',
      cooldown: src.cooldown || '',
      exercises: (src.exercises || []).map(function (e) {
        return {
          id: e.id || '', name: e.name, sets: e.sets, reps: e.reps, unit: e.unit || '次',
          rest: e.rest == null ? 90 : e.rest, tip: e.tip || '', note: e.note || ''
        };
      }),
      restItems: (src.restItems || []).map(function (r) { return { id: r.id || '', text: r.text || String(r) }; })
    };
  }

  /** mode: 'day' 只改这一天；'template' 改这类日子的固定模板 */
  function openDaySheet(profile, iso, mode) {
    var dow = Core.dowMon(iso);
    var src = mode === 'template' ? Store.templateFor(profile, iso) : Store.ensureDay(profile, iso);
    dayCtx = { profile: profile, iso: iso, mode: mode, dow: dow, draft: draftFrom(src) };
    var d = dayCtx.draft;
    var head = mode === 'template'
      ? '每周' + Core.WEEK_CN[dow] + '的固定安排'
      : Core.fmtMD(iso) + '的安排';
    var sub = mode === 'template'
      ? '改完以后，每个' + Core.dowName(iso) + '都按新的来（已经记录过的日子不变）'
      : '只影响这一天，已经勾的组会保留';

    UI.openModal(
      '<div class="sheet-head"><h2>' + head + '</h2><p>' + sub + '</p></div>' +
      '<div class="sheet-body" data-daysheet data-kind="' + d.kind + '">' +
        '<div class="seg kind-seg">' +
          '<button data-act="day-kind" data-kind="train" class="' + (d.kind === 'train' ? 'on' : '') + '">训练日</button>' +
          '<button data-act="day-kind" data-kind="rest" class="' + (d.kind === 'rest' ? 'on' : '') + '">休息 / 恢复日</button>' +
        '</div>' +
        '<label class="lab">这一天叫什么</label>' +
        '<input class="inp" data-day="title" value="' + esc(d.title) + '" placeholder="例如：推 · 胸肩三头">' +
        '<div class="kind-train">' +
          '<label class="lab">热身</label>' +
          '<textarea rows="2" data-day="warmup">' + esc(d.warmup) + '</textarea>' +
          '<div class="ex-edit-list">' +
            d.exercises.map(function (e, i) { return exRow(e, i); }).join('') +
          '</div>' +
          '<div class="row-btns">' +
            '<button class="add-line" data-act="sheet-add-ex">＋ 新动作</button>' +
            '<button class="add-line" data-act="sheet-lib">📚 动作库</button>' +
          '</div>' +
          '<label class="lab">练完放松</label>' +
          '<textarea rows="2" data-day="cooldown">' + esc(d.cooldown) + '</textarea>' +
        '</div>' +
        '<div class="kind-rest">' +
          '<label class="lab">恢复清单</label>' +
          '<div class="rest-edit-list">' + d.restItems.map(restRow).join('') + '</div>' +
          '<button class="add-line" data-act="sheet-add-rest">＋ 添加一项</button>' +
        '</div>' +
      '</div>' +
      '<div class="sheet-foot">' +
        (mode === 'template' && Store.templateOf(profile, dow)
          ? '<button class="btn-ghost danger" data-act="reset-template">恢复默认</button>'
          : '<button class="btn-ghost" data-act="close-modal">取消</button>') +
        (mode === 'template' && Store.templateOf(profile, dow)
          ? '<button class="btn-ghost" data-act="close-modal">取消</button>'
          : '') +
        '<button class="btn-primary" data-act="save-day">保存</button>' +
      '</div>'
    );
    applyKind();
  }

  function exRow(e, i) {
    return '<div class="drow" data-exrow data-id="' + esc(e.id || '') + '">' +
      '<div class="drow-top"><span class="dnum">' + (i + 1) + '</span>' +
        '<input class="dname" data-f="name" value="' + esc(e.name) + '" placeholder="动作名称">' +
        '<button class="icon-btn" data-act="sheet-del-ex">✕</button></div>' +
      '<div class="dgrid">' +
        '<label class="lab">组<input class="inp" type="number" min="1" max="20" inputmode="numeric" data-f="sets" value="' + e.sets + '"></label>' +
        '<label class="lab">次数<input class="inp" data-f="reps" value="' + esc(e.reps) + '"></label>' +
        '<label class="lab">单位<select class="inp" data-f="unit">' + UNITS.map(function (u) {
          return '<option ' + (u === e.unit ? 'selected' : '') + '>' + u + '</option>';
        }).join('') + '</select></label>' +
        '<label class="lab">组间<input class="inp" type="number" min="0" max="600" step="15" data-f="rest" value="' + e.rest + '"></label>' +
      '</div>' +
      '<textarea rows="2" data-f="tip" placeholder="动作要领，一行一条">' + esc(e.tip) + '</textarea>' +
      '<input class="inp slim" data-f="note" value="' + esc(e.note || '') + '" placeholder="备注（可选）">' +
    '</div>';
  }

  function restRow(r, i) {
    return '<div class="rest-edit" data-restrow data-id="' + esc(r.id || '') + '">' +
      '<input class="inp" data-f="text" value="' + esc(r.text) + '">' +
      '<button class="icon-btn" data-act="sheet-del-rest">✕</button></div>';
  }

  function applyKind() {
    var sheet = q('[data-daysheet]');
    if (!sheet) return;
    var kind = sheet.dataset.kind;
    sheet.classList.toggle('kind-is-rest', kind === 'rest');
  }

  function addExRow() {
    var list = q('.ex-edit-list');
    if (!list) return;
    var n = qa('[data-exrow]', list).length;
    var wrap = document.createElement('div');
    wrap.innerHTML = exRow({ name: '', sets: 3, reps: '12', unit: '次', rest: 90, tip: '', note: '' }, n);
    list.appendChild(wrap.firstChild);
    var rows = qa('[data-exrow]', list);
    var last = rows[rows.length - 1];
    if (last) { var inp = q('[data-f="name"]', last); if (inp) inp.focus(); }
  }

  function addRestRow() {
    var list = q('.rest-edit-list');
    if (!list) return;
    var wrap = document.createElement('div');
    wrap.innerHTML = restRow({ text: '', id: '' }, 0);
    list.appendChild(wrap.firstChild);
    var rows = qa('[data-restrow]', list);
    var inp = q('input', rows[rows.length - 1]);
    if (inp) inp.focus();
  }

  function readDaySheet() {
    var sheet = q('[data-daysheet]');
    if (!sheet) return null;
    var kind = sheet.dataset.kind;
    var val = function (sel) { var el = q(sel, sheet); return el ? el.value.trim() : ''; };
    var data = {
      kind: kind,
      icon: kind === 'rest' ? '🌙' : '💪',
      intensity: kind === 'rest' ? 'rest' : 'heavy',
      title: val('[data-day="title"]') || (kind === 'rest' ? '休息日' : '训练'),
      warmup: val('[data-day="warmup"]'),
      cooldown: val('[data-day="cooldown"]'),
      focus: '',
      exercises: [],
      restItems: []
    };
    qa('[data-exrow]', sheet).forEach(function (row) {
      var g = function (f) { var el = q('[data-f="' + f + '"]', row); return el ? el.value : ''; };
      var name = g('name').trim();
      if (!name) return;
      data.exercises.push({
        id: row.dataset.id || '',
        name: name,
        sets: Core.clamp(Number(g('sets')) || 1, 1, 20),
        reps: g('reps').trim() || '10',
        unit: g('unit') || '次',
        rest: Core.clamp(Number(g('rest')) || 0, 0, 900),
        tip: g('tip'),
        note: g('note').trim()
      });
    });
    qa('[data-restrow]', sheet).forEach(function (row) {
      var el = q('[data-f="text"]', row);
      var txt = el ? el.value.trim() : '';
      if (txt) data.restItems.push({ id: row.dataset.id || '', text: txt });
    });
    return data;
  }

  function saveDaySheet() {
    if (!dayCtx) return;
    var data = readDaySheet();
    if (!data) return;
    var k = dayCtx.profile, iso = dayCtx.iso;
    if (dayCtx.mode === 'template') {
      Store.setTemplateOverride(k, dayCtx.dow, data);
    } else {
      Store.applyDayEdit(k, iso, data);
    }
    UI.closeModal();
    UI.render();
    UI.toast(dayCtx.mode === 'template' ? '每周' + Core.WEEK_CN[dayCtx.dow] + ' 的固定安排已更新' : '这一天已更新');
    dayCtx = null;
  }

  /* ======================================================================
     四、把今天存成固定模板
     ====================================================================== */
  function openSyncTemplate(iso) {
    var k = UI.who();
    var log = Store.ensureDay(k, iso);
    var dow = Core.dowMon(iso);
    UI.openModal(

  /* ======================================================================
     五、组间计时器
     ====================================================================== */
  var timer = { total: 0, end: 0, left: 0, handle: null, running: false, done: false };

  function openTimer(seconds) {
    var s = Number(seconds) || st().settings.restSeconds || 90;
    timer.total = s;
    timer.left = timer.running ? timer.left : s;
    timer.done = false;
    UI.openModal(
      '<div class="sheet-head"><h2>组间计时</h2><p>上一组结束了，下一组准备好了吗</p></div>' +
      '<div class="sheet-body timer-body">' +
        '<div class="tm-ring">' + ringSmall(1) + '<div class="tm-num" data-tm>00:' + Core.pad(s) + '</div></div>' +
        '<div class="tm-presets">' +
          [30, 60, 90, 120, 180].map(function (v) {
            return '<button class="tm-pre ' + (v === s ? 'on' : '') + '" data-act="timer-set" data-sec="' + v + '">' + (v < 60 ? v + 's' : (v / 60) + '′') + '</button>';
          }).join('') +
        '</div>' +
        '<div class="tm-actions">' +
          '<button class="btn-ghost" data-act="timer-minus">−15s</button>' +
          '<button class="btn-primary big" data-act="timer-toggle" data-tm-toggle>开始</button>' +
          '<button class="btn-ghost" data-act="timer-plus">+15s</button>' +
        '</div>' +
        '<button class="link" data-act="timer-done" data-sec="' + (timer.total) + '">这组休息就到这里</button>' +
      '</div>',
      { cls: 'timer-sheet' }
    );
    renderTimer();
  }

  function ringSmall(pct) {
    var R = 46, C = 2 * Math.PI * R;
    return '<svg class="ring small" viewBox="0 0 110 110" aria-hidden="true">' +
      '<circle class="ring-bg" cx="55" cy="55" r="' + R + '"/>' +
      '<circle class="ring-fg" cx="55" cy="55" r="' + R + '" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="0" data-tm-ring/>' +
      '</svg>';
  }

  function renderTimer() {
    var numEl = q('[data-tm]');
    if (!numEl) return;
    var left = Math.max(0, Math.ceil(timer.left));
    var m = Math.floor(left / 60), s = left % 60;
    numEl.textContent = Core.pad(m) + ':' + Core.pad(s);
    var R = 46, C = 2 * Math.PI * R;
    var rg = q('[data-tm-ring]');
    if (rg) {
      var pct = timer.total ? timer.left / timer.total : 0;
      rg.setAttribute('stroke-dashoffset', (C * (1 - Core.clamp(pct, 0, 1))).toFixed(1));
    }
    var btn = q('[data-tm-toggle]');
    if (btn) btn.textContent = timer.running ? '暂停' : '开始';
    var panel = q('.tm-ring');
    if (panel) panel.classList.toggle('done', timer.left <= 0);
  }

  function timerTick() {
    var now = Date.now();
    timer.left = Math.max(0, (timer.end - now) / 1000);
    if (timer.left <= 0 && !timer.done) {
      timer.done = true;
      timer.running = false;
      stopTimerLoop();
      beep();
      renderTimer();
      UI.toast('休息结束，开始下一组 💪', 2600);
      return;
    }
    renderTimer();
  }

  function startTimerLoop() {
    stopTimerLoop();
    timer.handle = setInterval(timerTick, 200);
  }
  function stopTimerLoop() {
    if (timer.handle) { clearInterval(timer.handle); timer.handle = null; }
  }

  function toggleTimer() {
    if (timer.running) {
      timer.running = false;
      stopTimerLoop();
      timer.left = Math.max(0, (timer.end - Date.now()) / 1000);
    } else {
      if (timer.left <= 0) timer.left = timer.total;
      timer.end = Date.now() + timer.left * 1000;
      timer.running = true;
      timer.done = false;
      startTimerLoop();
    }
    renderTimer();
  }

  function timerAdjust(delta) {
    timer.total = Math.max(15, timer.total + delta);
    timer.left = Math.max(0, timer.left + delta);
    if (timer.running) timer.end = Date.now() + timer.left * 1000;
    renderTimer();
  }

  function timerSet(sec) {
    timer.total = Number(sec) || 90;
    timer.left = timer.total;
    timer.done = false;
    if (timer.running) timer.end = Date.now() + timer.left * 1000;
    qa('.tm-pre').forEach(function (b) { b.classList.toggle('on', Number(b.dataset.sec) === timer.total); });
    renderTimer();
  }

  function beep() {
    try {
      var AC = global.AudioContext || global.webkitAudioContext;
      if (!AC) return;
      var ac = new AC();
      var now = ac.currentTime;
      [0, 0.28, 0.56].forEach(function (offset, i) {
        var o = ac.createOscillator(), g = ac.createGain();
        o.type = 'sine';
        o.frequency.value = i === 2 ? 1046 : 880;
        g.gain.setValueAtTime(0.0001, now + offset);
        g.gain.exponentialRampToValueAtTime(0.25, now + offset + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.22);
        o.connect(g); g.connect(ac.destination);
        o.start(now + offset); o.stop(now + offset + 0.24);
      });
      setTimeout(function () { try { ac.close(); } catch (e) {} }, 1200);
    } catch (e) { /* 静音也没关系 */ }
    try { if (navigator.vibrate) navigator.vibrate([180, 90, 180, 90, 240]); } catch (e) {}
  }

  function closeTimer() {
    stopTimerLoop();
    timer.running = false;
  }

    var el = q('[data-input="sync-new-token"]');
    var t = el ? el.value.replace(/\s+/g, '') : '';
    if (!t) { UI.toast('先粘贴令牌'); return; }
    if (!/^(ghp_|github_pat_)/.test(t)) { UI.toast('令牌应该以 ghp_ 或 github_pat_ 开头', 3000); return; }
    if (t.indexOf('ghp_') === 0 && t.length !== 40) {
      UI.toast('这串只有 ' + t.length + ' 位，经典令牌正好 40 位，可能没复制全', 4000);
      return;
    }
    global.FitSync.updateToken(t);
    UI.closeModal();
    UI.render();
    UI.toast('正在用新令牌连接…', 1500);
    global.FitSync.now({ silent: true }).then(function (r) {
      UI.render();
      if (r && r.error) UI.toast('还是不行：' + r.error, 4200);
      else {
        UI.toast('连上了！把新的配对码发给对方', 3200);
        setTimeout(openSyncSheet, 400);
      }
    });
  }

  /* ---- 同步自检 ---- */
  function selfCheck() {
    UI.toast('正在自检…', 1200);
    global.FitSync.verify().then(function (r) {
      if (r.ok) {
        UI.openModal(
          '<div class="sheet-head"><h2>同步自检</h2><p>一切正常</p></div>' +
          '<div class="sheet-body">' +
            '<div class="kv"><span>令牌所属账号</span><b>' + esc(r.login) + '</b></div>' +
            '<div class="kv"><span>Gist</span><b>✓ 读得到</b></div>' +
            (r.updatedAt ? '<div class="kv"><span>云端最后修改</span><b>' + esc(String(r.updatedAt).slice(0, 16).replace('T', ' ')) + '</b></div>' : '') +
            '<p class="hint">如果还是同步不上，多半是网络；点「立即同步」再试一次。</p>' +
          '</div>' +
          '<div class="sheet-foot"><button class="btn-ghost wide" data-act="close-modal">好</button></div>'
        );
      } else {
        UI.openModal(
          '<div class="sheet-head"><h2>同步自检</h2><p>找到问题了</p></div>' +
          '<div class="sheet-body">' +
            '<div class="kv"><span>令牌</span><b>' + (r.login ? '✓ ' + esc(r.login) : '✗ 不认') + '</b></div>' +
            '<div class="kv"><span>原因</span><b>' + esc(r.error || '未知') + '</b></div>' +
            '<p class="hint">令牌不认 → 点下面「更新令牌」粘一串新的（记录不会丢）。<br>' +
            '如果提示找不到 Gist → 那个 Gist 被删了，得断开重来。</p>' +
          '</div>' +
          '<div class="sheet-foot">' +
            '<button class="btn-ghost" data-act="close-modal">关闭</button>' +
            '<button class="btn-primary" data-act="sync-new-token">更新令牌</button>' +
          '</div>'
        );
      }
    });
  }

  function syncCopyPair() {
    var code = global.FitSync.pairCode();
    UI.copy(code).then(function (ok) {
      UI.toast(ok ? '配对码已复制，发微信给她/他就行' : '复制失败，请长按选中文本复制', 2600);
    });
  }

  /* ======================================================================
     导出
     ====================================================================== */
  UI.sheets = {
    openCheckinSheet: openCheckinSheet,
    doCheckin: doCheckin,
    celebrate: celebrate,
    openExerciseSheet: openExerciseSheet,
    saveExercise: saveExercise,
    deleteExercise: deleteExercise,
    openDaySheet: openDaySheet,
    saveDaySheet: saveDaySheet,
    addExRow: addExRow,
    addRestRow: addRestRow,
    applyKind: applyKind,
    openSyncTemplate: openSyncTemplate,
    openTimer: openTimer,
    toggleTimer: toggleTimer,
    timerAdjust: timerAdjust,
    timerSet: timerSet,
    closeTimer: closeTimer,
    openImport: openImport,
    doImport: doImport,
    openOnboarding: openOnboarding,
    saveOnboarding: saveOnboarding,
    syncMood: syncMood,
    setMoodPending: function (m) { pendingMood = m; syncMood(); },
    get dayCtx() { return dayCtx; },
    setDayKind: function (kind) {
      var sheet = q('[data-daysheet]');
      if (!sheet) return;
      sheet.dataset.kind = kind;
      qa('.kind-seg button').forEach(function (b) { b.classList.toggle('on', b.dataset.kind === kind); });
      applyKind();
    },
    openLibrary: openLibrary,
    libSearch: libSearch,
    libGroup: libGroup,
    libTip: libTip,
    libAdd: libAdd,
    addExRowFromLib: addExRowFromLib,
    openSyncSheet: openSyncSheet,
    syncCreate: syncCreate,
    syncGistCreate: syncGistCreate,
    syncJoin: syncJoin,
    syncUseOrigin: syncUseOrigin,
    syncCopyPair: syncCopyPair,
    openTokenUpdate: openTokenUpdate,
    saveNewToken: saveNewToken,
    selfCheck: selfCheck
  };
})(window);
