<script>
/* js/features/war-report.js */
/* ==========================================================================
   训练搭子 · 功能模块：打卡战报（示例：怎么往 App 里加东西）
   --------------------------------------------------------------------------
   这个文件独立完成「把今天的打卡画成一张图」。它没有改任何老代码，
   只是调用 FitApp.registerFeature 把自己挂到「我们」页面。
   以后加新功能可以照抄这个结构。
   ========================================================================== */
(function (global) {
  'use strict';

  var Core = global.FitCore, Data = global.FitData, Store = global.FitStore, App = global.FitApp, UI = global.FitUI;
  var esc = UI.esc;

  var ACCENT = {
    him: ['#4C8DFF', '#8FB8FF', '#1B3A6B'],
    her: ['#FF6B8A', '#FFB3C2', '#6B1B33']
  };

  function rounded(ctx, x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); return; }
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function buildCanvas(profile, iso) {
    var s = Store.state;
    var log = Store.getDay(profile, iso, false);
    var p = s.profiles[profile];
    var accent = ACCENT[profile] || ACCENT.him;
    var W = 1080, H = 1500;
    var c = document.createElement('canvas');
    c.width = W; c.height = H;
    var ctx = c.getContext('2d');

    /* 背景 */
    var bg = ctx.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, '#171B26');
    bg.addColorStop(1, '#0B0D13');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    var glow = ctx.createRadialGradient(W * 0.82, 150, 40, W * 0.82, 150, 720);
    glow.addColorStop(0, accent[0] + 'AA');
    glow.addColorStop(0.45, accent[0] + '33');
    glow.addColorStop(1, 'transparent');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, 900);

    /* 网格装饰 */
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 2;
    for (var i = 1; i < 10; i++) {
      ctx.beginPath(); ctx.moveTo(0, 900 + i * 40); ctx.lineTo(W, 900 + i * 40); ctx.stroke();
    }

    var pr = Core.progress(log || { exercises: [] });
    var pad = 78;
    var y = 96;

    /* 顶栏 */
    ctx.fillStyle = 'rgba(255,255,255,0.66)';
    ctx.font = '600 30px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('训 练 搭 子', pad, y);
    ctx.textAlign = 'right';
    ctx.fillText(Core.fmtMD(iso) + ' · ' + Core.dowName(iso), W - pad, y);
    ctx.textAlign = 'left';

    /* 徽章 */
    y = 200;
    ctx.fillStyle = accent[0] + '33';
    rounded(ctx, pad, y - 46, 250, 72, 36); ctx.fill();
    ctx.fillStyle = accent[1];
    ctx.font = '600 32px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText((log && log.icon ? log.icon + '  ' : '') + (log ? log.title : '训练'), pad + 34, y + 2);

    /* 大标题 */
    y = 360;
    ctx.fillStyle = '#FFFFFF';
    ctx.font = '800 92px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText(log && log.kind === 'rest' ? '恢复也是训练' : '今天完成了', pad, y);

    /* 数字区 */
    y = 500;
    ctx.fillStyle = accent[1];
    ctx.font = '800 150px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText(String(pr.done), pad, y + 60);
    var numW = ctx.measureText(String(pr.done)).width;
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.font = '600 40px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText(log && log.kind === 'rest' ? '项恢复完成' : '组完成', pad + numW + 18, y + 50);

    ctx.textAlign = 'right';
    ctx.fillStyle = '#FFFFFF';
    ctx.font = '800 68px "PingFang SC","Microsoft YaHei",sans-serif';
    var streak = Core.streak(s.logs, profile, iso);
    ctx.fillText(String(streak), W - pad, y + 20);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.font = '600 32px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText('天连续打卡', W - pad, y + 72);
    ctx.textAlign = 'left';

    /* 分割线 */
    y = 650;
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W - pad, y); ctx.stroke();

    /* 动作清单 */
    y += 96;
    var list = (log && log.exercises) || [];
    if (log && log.kind === 'rest') {
      list = (log.restItems || []).map(function (r) { return { name: r.text, done: [r.done] }; });
    }
    list.slice(0, 7).forEach(function (ex) {
      var allDone = (ex.done || []).every(Boolean) && (ex.done || []).length;
      ctx.fillStyle = allDone ? accent[0] : 'rgba(255,255,255,0.20)';
      ctx.beginPath();
      ctx.arc(pad + 24, y - 10, 24, 0, Math.PI * 2);
      ctx.fill();
      if (allDone) {
        ctx.strokeStyle = '#0B0D13';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(pad + 12, y - 10);
        ctx.lineTo(pad + 21, y + 1);
        ctx.lineTo(pad + 37, y - 22);
        ctx.stroke();
      }
      ctx.fillStyle = allDone ? '#FFFFFF' : 'rgba(255,255,255,0.55)';
      ctx.font = '500 38px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText(ex.name, pad + 76, y);
      if (ex.reps) {
        ctx.fillStyle = 'rgba(255,255,255,0.38)';
        ctx.font = '400 30px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText((ex.sets || 1) + ' × ' + ex.reps + ' ' + (ex.unit || '次'), W - pad, y);
        ctx.textAlign = 'left';
      }
      y += 74;
    });

    /* 每日一句，把空白处填得有味道（动作太多就不写了，免得挤） */
    if (log && y < H - 360) {
      ctx.fillStyle = 'rgba(255,255,255,0.30)';
      ctx.font = '400 30px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText('「' + Data.quoteFor(Core.diffDays('2000-01-01', iso)) + '」', pad, H - 300);
    }

    /* 备注 */
    if (log && log.note) {
      y += 24;
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.font = '400 30px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText('「' + log.note.slice(0, 28) + '」', pad, y);
    }

    /* 底部 */
    var by = H - 150;
    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.beginPath(); ctx.moveTo(pad, by - 60); ctx.lineTo(W - pad, by - 60); ctx.stroke();

    ctx.font = '500 40px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = '#FFFFFF';
    ctx.fillText(p.avatar + '  ' + p.name, pad, by);
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(255,255,255,0.42)';
    ctx.font = '400 28px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText('训练搭子 · 我们俩的健身记录', W - pad, by);
    ctx.textAlign = 'left';

    /* 右下角小圆环 */
    ctx.strokeStyle = accent[0];
    ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.arc(W - pad - 4, by - 6, 0.1, 0, Math.PI * 2);
    ctx.stroke();

    return c;
  }

  function showReport(profile, iso) {
    var c = buildCanvas(profile, iso);
    var url = c.toDataURL('image/png');
    var name = '训练搭子-' + iso + '.png';
    UI.openModal(
      '<div class="sheet-head"><h2>今日战报</h2><p>长按图片可以保存到相册</p></div>' +
      '<div class="sheet-body report-body"><img src="' + url + '" alt="打卡战报"></div>' +
      '<div class="sheet-foot">' +
        '<button class="btn-ghost" data-act="close-modal">关闭</button>' +
        '<button class="btn-primary" data-act="save-report" data-name="' + esc(name) + '" data-url="' + url + '">保存图片</button>' +
      '</div>',
      { cls: 'report-sheet' }
    );
  }

  App.registerFeature({
    id: 'war-report',
    label: '战报',
    where: 'us',
    render: function () {
      var iso = UI.view && UI.view.tab === 'today' ? UI.view.date : Core.todayISO();
      return '<section class="card feature-card">' +
        '<div class="lc-head"><b>打卡战报</b><span>做张图发给对象</span></div>' +
        '<p class="hint">把今天的训练画成一张卡片，可以存到相册、发朋友圈或甩到微信里炫耀一下。</p>' +
        '<div class="btn-grid"><button class="btn-primary" data-act="war-report" data-iso="' + iso + '">生成今天的战报</button></div>' +
        '</section>';
    }
  });

  /* 自己的事件处理，不污染主逻辑 */
  document.addEventListener('click', function (e) {
    var el = e.target.closest && e.target.closest('[data-act]');
    if (!el) return;
    var act = el.dataset.act;
    if (act === 'war-report') {
      e.preventDefault();
      var iso = el.dataset.iso || Core.todayISO();
      var profile = UI.who();
      if (el.dataset.who) profile = el.dataset.who;
      showReport(profile, iso);
    } else if (act === 'save-report') {
      e.preventDefault();
      var a = document.createElement('a');
      a.href = el.dataset.url;
      a.download = el.dataset.name || 'trainmate.png';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { a.remove(); }, 400);
      UI.toast('如果没有反应，就长按图片保存');
    }
  });

  global.FitWarReport = { build: buildCanvas, show: showReport };
})(window);

</script>
<script>
/* js/features/battle.js */
/* 训练搭子 · 本周对决（双人小竞技）
   算一类日子里的完成组数：谁多谁赢，输的请喝水。 */
(function (global) {
  'use strict';

  var Core = global.FitCore, Store = global.FitStore, App = global.FitApp, UI = global.FitUI;
  var esc = UI.esc;

  function weekSets(profile, mondayIso) {
    var sets = 0, sessions = 0, rest = 0;
    for (var i = 0; i < 7; i++) {
      var iso = Core.addDays(mondayIso, i);
      var log = Store.state.logs[Core.logKey(profile, iso)];
      if (!log || !log.checkedIn) continue;
      sessions++;
      var pr = Core.progress(log);
      if (log.kind === 'rest') rest++; else sets += pr.done;
    }
    return { sets: sets, sessions: sessions, rest: rest };
  }

  /** 从开始日期到今天，逐周统计胜负 */
  function history(mondayIso) {
    var start = Core.mondayOf(Store.state.settings.startDate);
    var weeks = Math.floor(Core.diffDays(start, mondayIso) / 7);
    var score = { him: 0, her: 0, draw: 0, played: 0 };
    for (var w = 0; w < Math.min(weeks, 52); w++) {
      var mon = Core.addDays(start, w * 7);
      var a = weekSets('him', mon).sets;
      var b = weekSets('her', mon).sets;
      if (a === 0 && b === 0) continue;
      score.played++;
      if (a > b) score.him++; else if (b > a) score.her++; else score.draw++;
    }
    return score;
  }

  function bar(name, avatar, sets, max, color) {
    var pct = max > 0 ? Math.round(sets / max * 100) : 0;
    return '<div class="bt-row">' +
      '<span class="bt-av">' + avatar + '</span>' +
      '<div class="bt-bar"><div class="bt-fill" style="width:' + Math.max(4, pct) + '%;background:' + color + '"></div></div>' +
      '<b>' + sets + '<i>组</i></b>' +
    '</div>';
  }

  App.registerFeature({
    id: 'duel',
    label: '本周对决',
    where: 'us-duel',
    render: function () {
      var s = Store.state;
      var mon = Core.mondayOf(Core.todayISO());
      var him = weekSets('him', mon);
      var her = weekSets('her', mon);
      var max = Math.max(him.sets, her.sets, 1);
      var lead = him.sets === her.sets ? 0 : (him.sets > her.sets ? 1 : -1);
      var hist = history(mon);
      var leadText = lead === 0
        ? '暂时打平，这周还长'
        : (lead > 0 ? s.profiles.him.name + ' 领先 ' + (him.sets - her.sets) + ' 组' : s.profiles.her.name + ' 领先 ' + (her.sets - him.sets) + ' 组');

      return '<section class="card duel">' +
        '<div class="lc-head"><b>本周对决</b><span>' + Core.fmtMD(mon) + ' – ' + Core.fmtMD(Core.addDays(mon, 6)) + '</span></div>' +
        bar('him', s.profiles.him.avatar, him.sets, max, 'var(--him)') +
        bar('her', s.profiles.her.avatar, her.sets, max, 'var(--her)') +
        '<div class="bt-meta">' +
          '<span>' + s.profiles.him.name + ' ' + him.sessions + ' 次训练</span>' +
          '<span>' + s.profiles.her.name + ' ' + her.sessions + ' 次训练</span>' +
        '</div>' +
        '<p class="bt-lead">' + esc(leadText) + (lead === 0 ? '' : ' · 输的请喝水 🥤') + '</p>' +
        (hist.played ? '<p class="bt-hist">历史战绩 ' + hist.him + ' : ' + hist.her + (hist.draw ? '（平 ' + hist.draw + '）' : '') + '</p>' : '') +
      '</section>';
    }
  });
})(window);

</script>
<script>
/* js/features/achievements.js */
/* 训练搭子 · 成就徽章
   全部由历史记录实时算出来，不需要额外存储；同步之后两个人的进度都会更新。 */
(function (global) {
  'use strict';

  var Core = global.FitCore, Store = global.FitStore, App = global.FitApp, UI = global.FitUI;
  var esc = UI.esc;

  /** 汇总一个人的训练数据 */
  function digest(profile) {
    var logs = Store.state.logs;
    var d = {
      sessions: 0, train: 0, rest: 0, sets: 0, fullDays: 0,
      early: 0, night: 0, best: 0, current: 0, duo: 0
    };
    var checkedDates = [];
    var byDate = {};
    Object.keys(logs).forEach(function (k) {
      if (k.indexOf(profile + '@') !== 0) return;
      var log = logs[k];
      if (!log.checkedIn) return;
      d.sessions++;
      if (log.kind === 'rest') d.rest++; else d.train++;
      var pr = Core.progress(log);
      d.sets += pr.done;
      if (log.kind === 'train' && pr.total > 0 && pr.done === pr.total) d.fullDays++;
      var h = log.checkedInAt ? new Date(log.checkedInAt).getHours() : -1;
      if (h >= 0 && h < 8) d.early++;
      if (h >= 22) d.night++;
      checkedDates.push(log.date);
      byDate[log.date] = true;
    });
    checkedDates.sort();
    var run = 0, prev = null;
    checkedDates.forEach(function (dt) {
      run = (prev && Core.diffDays(prev, dt) === 1) ? run + 1 : 1;
      if (run > d.best) d.best = run;
      prev = dt;
    });
    d.current = Core.streak(logs, profile);

    /* 双人连续天数 */
    var both = {};
    Object.keys(logs).forEach(function (k) {
      var parts = k.split('@');
      if (!logs[k].checkedIn) return;
      both[parts[1]] = both[parts[1]] || {};
      both[parts[1]][parts[0]] = true;
    });
    var dts = Object.keys(both).filter(function (x) { return both[x].him && both[x].her; }).sort();
    var drun = 0, dprev = null;
    dts.forEach(function (dt) {
      drun = (dprev && Core.diffDays(dprev, dt) === 1) ? drun + 1 : 1;
      if (drun > d.duo) d.duo = drun;
      dprev = dt;
    });

    /* 单周最多练几次 */
    var week = {};
    checkedDates.forEach(function (dt) {
      var w = Core.mondayOf(dt);
      week[w] = (week[w] || 0) + 1;
    });
    d.maxWeek = Math.max.apply(null, Object.keys(week).map(function (k) { return week[k]; }).concat([0]));

    return d;
  }

  var BADGES = [
    { id: 'first', icon: '🌱', name: '开始了', desc: '第一次打卡', get: function (d) { return d.sessions; }, need: 1 },
    { id: 'ten', icon: '🔟', name: '上手了', desc: '完成 10 次训练', get: function (d) { return d.train; }, need: 10 },
    { id: 'fifty', icon: '🏅', name: '常客', desc: '完成 50 次训练', get: function (d) { return d.train; }, need: 50 },
    { id: 'hundred', icon: '🏆', name: '百炼', desc: '完成 100 次训练', get: function (d) { return d.train; }, need: 100 },
    { id: 's3', icon: '🔥', name: '三天不断', desc: '连续打卡 3 天', get: function (d) { return d.best; }, need: 3 },
    { id: 's7', icon: '🔥', name: '一周不断', desc: '连续打卡 7 天', get: function (d) { return d.best; }, need: 7 },
    { id: 's30', icon: '🗓', name: '一个月', desc: '连续打卡 30 天', get: function (d) { return d.best; }, need: 30 },
    { id: 'duo7', icon: '💞', name: '并肩七天', desc: '两个人都打卡，连 7 天', get: function (d) { return d.duo; }, need: 7 },
    { id: 'set500', icon: '🧱', name: '五百组', desc: '累计完成 500 组', get: function (d) { return d.sets; }, need: 500 },
    { id: 'set2000', icon: '🏗', name: '两千组', desc: '累计完成 2000 组', get: function (d) { return d.sets; }, need: 2000 },
    { id: 'perfect', icon: '✅', name: '完美一天', desc: '一天的所有组全勾满（5 次）', get: function (d) { return d.fullDays; }, need: 5 },
    { id: 'week5', icon: '📅', name: '一周五练', desc: '同一周训练 5 次', get: function (d) { return d.maxWeek; }, need: 5 },
    { id: 'early', icon: '🌅', name: '早起鸟', desc: '早上 8 点前打卡 5 次', get: function (d) { return d.early; }, need: 5 },
    { id: 'night', icon: '🌙', name: '夜练党', desc: '晚上 10 点后打卡 5 次', get: function (d) { return d.night; }, need: 5 }
  ];

  function evaluate(profile) {
    var d = digest(profile);
    var list = BADGES.map(function (b) {
      var got = b.get(d);
      return {
        id: b.id, icon: b.icon, name: b.name, desc: b.desc,
        value: got, need: b.need,
        unlocked: got >= b.need,
        progress: Math.max(0, Math.min(1, got / b.need))
      };
    });
    return { digest: d, badges: list, unlocked: list.filter(function (x) { return x.unlocked; }).length };
  }

  App.registerFeature({
    id: 'achievements',
    label: '成就',
    where: 'us-badges',
    render: function () {
      var me = UI.who();
      var mine = evaluate(me);
      var otherWho = me === 'him' ? 'her' : 'him';
      var theirs = evaluate(otherWho);
      var name = Store.state.profiles[me].name;

      var grid = mine.badges.map(function (b) {
        return '<div class="badge ' + (b.unlocked ? 'on' : '') + '" title="' + esc(b.desc) + '">' +
          '<span class="bg-icon">' + b.icon + '</span>' +
          '<span class="bg-name">' + esc(b.name) + '</span>' +
          '<span class="bg-prog"><i style="width:' + Math.round(b.progress * 100) + '%"></i></span>' +
          '<span class="bg-num">' + Math.min(b.value, b.need) + '/' + b.need + '</span>' +
        '</div>';
      }).join('');

      return '<section class="card badges">' +
        '<div class="lc-head"><b>' + esc(name) + ' 的成就</b><span>' + mine.unlocked + ' / ' + BADGES.length + ' 枚' +
          ' · ' + esc(Store.state.profiles[otherWho].name) + ' ' + theirs.unlocked + ' 枚</span></div>' +
        '<div class="badge-grid">' + grid + '</div>' +
        '<p class="hint">徽章是照着记录算的，同步之后两边的进度都会更新。' +
          (mine.unlocked === BADGES.length ? ' 全收集了，厉害。' : '') + '</p>' +
      '</section>';
    }
  });

  global.FitAchievements = { digest: digest, evaluate: evaluate };
})(window);

</script>
<script>
/* js/features/photos.js */
/* 训练搭子 · 进度照片
   存在浏览器的 IndexedDB 里（比 localStorage 能放得多），压缩到最长边 1000px。
   ⚠️ 照片体积大，目前只存本机、不参与同步。 */
(function (global) {
  'use strict';

  var Core = global.FitCore, Store = global.FitStore, App = global.FitApp, UI = global.FitUI;
  var esc = UI.esc;

  var DB_NAME = 'trainmate-photos';
  var STORE = 'photos';
  var dbPromise = null;

  function db() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(function (resolve, reject) {
      if (!global.indexedDB) { reject(new Error('这个浏览器不支持本地存照片')); return; }
      var req = global.indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function () {
        var d = req.result;
        if (!d.objectStoreNames.contains(STORE)) {
          var os = d.createObjectStore(STORE, { keyPath: 'id' });
          os.createIndex('at', 'at');
        }
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error || new Error('打不开照片库')); };
    });
    return dbPromise;
  }

  function tx(mode) {
    return db().then(function (d) { return d.transaction(STORE, mode).objectStore(STORE); });
  }

  function put(rec) {
    return tx('readwrite').then(function (os) {
      return new Promise(function (resolve, reject) {
        var r = os.put(rec);
        r.onsuccess = function () { resolve(rec); };
        r.onerror = function () { reject(r.error); };
      });
    });
  }

  function all() {
    return tx('readonly').then(function (os) {
      return new Promise(function (resolve, reject) {
        var r = os.getAll();
        r.onsuccess = function () { resolve((r.result || []).sort(function (a, b) { return a.at < b.at ? 1 : -1; })); };
        r.onerror = function () { reject(r.error); };
      });
    });
  }

  function remove(id) {
    return tx('readwrite').then(function (os) {
      return new Promise(function (resolve) {
        var r = os.delete(id);
        r.onsuccess = function () { resolve(true); };
        r.onerror = function () { resolve(false); };
      });
    });
  }

  /* ---------------- 图片压缩 ---------------- */
  function readFile(file) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () { resolve(String(fr.result)); };
      fr.onerror = function () { reject(new Error('读不了这个文件')); };
      fr.readAsDataURL(file);
    });
  }

  function compress(dataUrl, maxSide, quality) {
    return new Promise(function (resolve) {
      var img = new Image();
      img.onload = function () {
        var w = img.naturalWidth, h = img.naturalHeight;
        var scale = Math.min(1, maxSide / Math.max(w, h));
        var cw = Math.round(w * scale), ch = Math.round(h * scale);
        var c = document.createElement('canvas');
        c.width = cw; c.height = ch;
        var ctx = c.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, cw, ch);
        ctx.drawImage(img, 0, 0, cw, ch);
        resolve({ dataUrl: c.toDataURL('image/jpeg', quality || 0.72), w: cw, h: ch });
      };
      img.onerror = function () { resolve({ dataUrl: dataUrl, w: 0, h: 0 }); };
      img.src = dataUrl;
    });
  }

  function add(file, profile) {
    return readFile(file)
      .then(function (raw) { return compress(raw, 1000, 0.72); })
      .then(function (out) {
        var rec = {
          id: Core.uid(),
          profile: profile || UI.who(),
          date: Core.todayISO(),
          at: new Date().toISOString(),
          note: '',
          w: out.w, h: out.h,
          dataUrl: out.dataUrl
        };
        return put(rec).then(function () { return rec; });
      });
  }

  /* ---------------- 界面 ---------------- */
  var cache = [];

  function pickFile() {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.style.display = 'none';
    document.body.appendChild(input);
    input.addEventListener('change', function () {
      var f = input.files && input.files[0];
      input.remove();
      if (!f) return;
      UI.toast('正在压缩照片…', 1200);
      add(f, UI.who()).then(function () {
        return reload();
      }).then(function () {
        renderAlbum();
        UI.toast('照片已保存到本机');
      }).catch(function (e) {
        UI.toast('存照片失败：' + e.message, 3200);
      });
    });
    input.click();
  }

  function reload() {
    return all().then(function (list) {
      cache = list;
      return list;
    }).catch(function (e) {
      cache = [];
      UI.toast(e.message || '照片库打不开', 2600);
      return [];
    });
  }

  function fmtAt(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + Core.pad(d.getHours()) + ':' + Core.pad(d.getMinutes());
  }

  function renderAlbum() {
    var s = Store.state;
    var grid = cache.length
      ? cache.map(function (p) {
        return '<button class="ph" data-act="photo-view" data-id="' + p.id + '">' +
          '<img src="' + p.dataUrl + '" alt="' + esc(p.date) + '" loading="lazy">' +
          '<span class="ph-date">' + Core.fmtMD(p.date) + '</span>' +
          '<span class="ph-who">' + esc(s.profiles[p.profile] ? s.profiles[p.profile].avatar : '') + '</span>' +
        '</button>';
      }).join('')
      : '<div class="chat-empty">还没有照片。练完拍一张，三个月后回头看会很爽。</div>';

    UI.openModal(
      '<div class="sheet-head"><h2>进度照片</h2><p>共 ' + cache.length + ' 张 · 只存在这台手机上，不参与同步</p></div>' +
      '<div class="sheet-body">' +
        '<button class="btn-primary wide" data-act="photo-add">＋ 加一张今天的照片</button>' +
        '<div class="photo-grid">' + grid + '</div>' +
        (cache.length >= 2 ? '<button class="btn-ghost wide" data-act="photo-compare">最早 ↔ 最新 对比</button>' : '') +
        '<p class="hint">照片会压缩到最长边 1000px 再存，不占太多空间，但也别当相册用（建议不超过 100 张）。</p>' +
      '</div>',
      { cls: 'photo-sheet' }
    );
  }

  function viewPhoto(id) {
    var p = cache.filter(function (x) { return x.id === id; })[0];
    if (!p) return;
    var s = Store.state;
    UI.openModal(
      '<div class="sheet-head"><h2>' + Core.fmtMD(p.date) + ' · ' + esc(s.profiles[p.profile] ? s.profiles[p.profile].name : '') + '</h2>' +
        '<p>' + fmtAt(p.at) + '</p></div>' +
      '<div class="sheet-body">' +
        '<img class="ph-big" src="' + p.dataUrl + '" alt="">' +
        '<label class="lab">记一句</label>' +
        '<textarea rows="2" data-input="photo-note" data-id="' + p.id + '" placeholder="今天的身材、体重、状态…">' + esc(p.note || '') + '</textarea>' +
      '</div>' +
      '<div class="sheet-foot">' +
        '<button class="btn-ghost danger" data-act="photo-del" data-id="' + p.id + '">删除</button>' +
        '<button class="btn-ghost" data-act="photo-back">返回</button>' +
        '<button class="btn-primary" data-act="photo-save" data-id="' + p.id + '">保存</button>' +
      '</div>'
    );
  }

  function compare() {
    if (cache.length < 2) return;
    var newest = cache[0];
    var oldest = cache[cache.length - 1];
    var s = Store.state;
    function day(p) { return Core.diffDays(p.date, newest.date); }
    UI.openModal(
      '<div class="sheet-head"><h2>对比</h2><p>' + Core.fmtMD(oldest.date) + ' → ' + Core.fmtMD(newest.date) + '（' + Math.abs(day(oldest)) + ' 天）</p></div>' +
      '<div class="sheet-body"><div class="ph-compare">' +
        '<figure><img src="' + oldest.dataUrl + '" alt=""><figcaption>' + Core.fmtMD(oldest.date) + '</figcaption></figure>' +
        '<figure><img src="' + newest.dataUrl + '" alt=""><figcaption>' + Core.fmtMD(newest.date) + '</figcaption></figure>' +
      '</div></div>' +
      '<div class="sheet-foot"><button class="btn-ghost wide" data-act="photo-back">返回相册</button></div>'
    );
  }

  /* ---------------- 卡片 ---------------- */
  App.registerFeature({
    id: 'photos',
    label: '进度照片',
    where: 'us-photos',
    render: function () {
      return '<section class="card photos-card">' +
        '<div class="lc-head"><b>进度照片</b><span>本机 · 不同步</span></div>' +
        '<p class="hint">每隔一两周拍一张同样角度的照片，比体重秤诚实得多。</p>' +
        '<div class="btn-grid"><button class="btn-primary" data-act="photo-open">打开相册</button></div>' +
      '</section>';
    }
  });

  /* ---------------- 事件 ---------------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) return;
    var act = el.dataset.act;
    if (act.indexOf('photo') !== 0) return;

    if (act === 'photo-open') {
      e.preventDefault();
      reload().then(renderAlbum);
    } else if (act === 'photo-add') {
      e.preventDefault();
      pickFile();
    } else if (act === 'photo-view') {
      e.preventDefault();
      viewPhoto(el.dataset.id);
    } else if (act === 'photo-back') {
      e.preventDefault();
      reload().then(renderAlbum);
    } else if (act === 'photo-compare') {
      e.preventDefault();
      reload().then(compare);
    } else if (act === 'photo-del') {
      e.preventDefault();
      if (!global.confirm('删掉这张照片？')) return;
      remove(el.dataset.id).then(function () { return reload(); }).then(function () {
        renderAlbum();
        UI.toast('已删除');
      });
    } else if (act === 'photo-save') {
      e.preventDefault();
      var ta = document.querySelector('[data-input="photo-note"]');
      var id = el.dataset.id;
      var rec = cache.filter(function (x) { return x.id === id; })[0];
      if (!rec) return;
      rec.note = ta ? ta.value.trim() : '';
      put(rec).then(function () {
        UI.toast('已保存');
        return reload();
      }).then(renderAlbum);
    }
  });

  global.FitPhotos = { add: add, all: all, remove: remove, reload: reload };
})(window);

</script>
<script>
/* js/features/cycle.js */
/* 训练搭子 · 周期记录（经期）
   她可以标记哪几天在经期：今天页会出现"轻一点"的入口，也会算下次大概什么时候。
   他那边只在「她允许」的情况下看到一句温和的提示，不带任何细节。 */
(function (global) {
  'use strict';

  var Core = global.FitCore, Store = global.FitStore, App = global.FitApp, UI = global.FitUI;
  var esc = UI.esc;

  /* ---------------- 今天页顶部 ---------------- */
  App.registerFeature({
    id: 'cycle-today',
    label: '周期提示',
    where: 'today-top',
    render: function (ctx) {
      var me = UI.who();
      var iso = ctx && ctx.iso ? ctx.iso : UI.view.date;
      var today = Core.todayISO();
      var out = '';

      if (me === 'her') {
        var on = Store.isCycleDay('her', iso);
        var idx = Store.cycleDayIndex('her', iso);
        if (on) {
          out += '<div class="cycle-strip on">' +
            '<span class="cs-icon">🌸</span>' +
            '<div class="cs-main"><b>经期第 ' + idx + ' 天</b><small>今天可以轻一点，练不练都算数</small></div>' +
            '<div class="cs-btns">' +
              '<button class="chip-btn" data-act="cycle-light">轻松点</button>' +
              '<button class="chip-btn ghost" data-act="cycle-toggle" data-iso="' + iso + '">标记结束</button>' +
            '</div>' +
          '</div>';
        } else if (iso <= today) {
          out += '<button class="cycle-strip idle" data-act="cycle-toggle" data-iso="' + iso + '">' +
            '<span class="cs-icon">🌸</span><span class="cs-idle-txt">来例假了？点一下标这天</span>' +
          '</button>';
        }
      } else if (me === 'him') {
        var c = Store.cycleOf('her');
        if (c.visible && Store.isCycleDay('her', today)) {
          out += '<div class="cycle-strip him">' +
            '<span class="cs-icon">🌸</span>' +
            '<div class="cs-main"><b>她这几天在经期</b><small>训练可以轻一点，多递水、少催她</small></div>' +
          '</div>';
        }
      }

      return out;
    }
  });

  /* ---------------- 我的：设置 ---------------- */
  App.registerFeature({
    id: 'cycle-me',
    label: '周期记录',
    where: 'me',
    render: function () {
      if (UI.who() !== 'her') return '';
      var c = Store.cycleOf('her');
      var info = Store.cycleInfo('her', Core.todayISO());
      var rows = '';
      if (info.has) {
        rows += '<div class="kv"><span>上次开始</span><b>' + Core.fmtMD(info.lastStart) + '</b></div>' +
          '<div class="kv"><span>下次预计</span><b>' + Core.fmtMD(info.next) + '</b></div>' +
          '<div class="kv"><span>已记录</span><b>' + info.total + ' 天</b></div>';
      } else {
        rows += '<p class="hint">还没有记录。今天页上方点「来例假了？点一下标今天」就会开始算。</p>';
      }
      return '<section class="card">' +
        '<div class="lc-head"><b>周期记录</b><span>' + (c.visible ? '他能看到一句提示' : '他看不到') + '</span></div>' +
        rows +
        '<label class="field-row"><span class="fr-label">平均周期</span>' +
          '<input type="number" min="20" max="45" data-bind="cycle-avg" value="' + (c.avg || 28) + '">' +
          '<span class="fr-hint">天</span>' +
        '</label>' +
        '<label class="field-row"><span class="fr-label">让他看到</span>' +
          '<button class="switch ' + (c.visible ? 'on' : '') + '" data-act="cycle-visible" aria-label="切换"></button>' +
        '</label>' +
        (info.has ? '<div class="btn-grid" style="margin-top:10px"><button class="btn-ghost danger" data-act="cycle-clear">清除周期记录</button></div>' : '') +
        '<p class="hint">他那边只会看到「她这几天在经期，训练可以轻一点」，看不到具体日期和天数。</p>' +
      '</section>';
    }
  });

  /* ---------------- 事件 ---------------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) return;
    var act = el.dataset.act;
    if (act.indexOf('cycle') !== 0) return;

    if (act === 'cycle-toggle') {
      e.preventDefault();
      var iso = el.dataset.iso || UI.view.date;
      var nowOn = Store.toggleCycleDay('her', iso);
      UI.render();
      UI.toast(nowOn ? '已标记：这天在经期' : '已取消标记');
    } else if (act === 'cycle-light') {
      e.preventDefault();
      var log = Store.ensureDay('her', UI.view.date);
      if (!log || log.kind === 'rest') { UI.toast('今天本来就是休息日'); return; }
      var changed = 0;
      (log.exercises || []).forEach(function (ex) {
        if (ex.sets > 1) { Store.setExerciseField('her', UI.view.date, ex.id, 'sets', ex.sets - 1); changed++; }
      });
      var note = (log.note ? log.note + ' ' : '') + '（经期，组数减一）';
      Store.setDayNote('her', UI.view.date, note);
      UI.render();
      UI.toast(changed ? '已把 ' + changed + ' 个动作各减一组，练得动就照常' : '今天动作已经是最少了');
    } else if (act === 'cycle-visible') {
      e.preventDefault();
      var was = Store.cycleOf('her').visible;
      Store.setCycleSetting('her', 'visible', !was);
      UI.render();
      UI.toast(was ? '已关闭：他看不到提示' : '已开启：他会看到一句提示');
    } else if (act === 'cycle-clear') {
      e.preventDefault();
      if (!global.confirm('清除所有周期记录？')) return;
      Store.setCycleSetting('her', 'days', []);
      UI.render();
      UI.toast('已清除');
    }
  });

  /* 平均周期长度 */
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (!el.dataset || el.dataset.bind !== 'cycle-avg') return;
    var v = Math.max(20, Math.min(45, Number(el.value) || 28));
    Store.setCycleSetting('her', 'avg', v);
    UI.render();
  });
})(window);

</script>
<script>
/* js/boot.js */
/* ==========================================================================
   训练搭子 · 启动与事件 boot.js
   --------------------------------------------------------------------------
   所有点击都走这里的一个事件委托：<button data-act="xxx">。
   新功能想加自己的按钮，只要在 features/ 里注册就自动生效（见 registry.js）。
   ========================================================================== */
(function (global) {
  'use strict';

  var Core = global.FitCore, Data = global.FitData, Store = global.FitStore, App = global.FitApp, UI = global.FitUI;
  var S = UI.sheets;

  /* ---------- 主题 ---------- */
  var mql = global.matchMedia ? global.matchMedia('(prefers-color-scheme: dark)') : null;
  function applyTheme() {
    var mode = Store.state.settings.theme || 'auto';
    var dark = mode === 'dark' || (mode === 'auto' && mql && mql.matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? '#0f1117' : '#f4f5f9');
  }
  if (mql && mql.addEventListener) {
    mql.addEventListener('change', function () { if ((Store.state.settings.theme || 'auto') === 'auto') applyTheme(); });
  }

  /* ---------- 工具 ---------- */
  function download(name, text, type) {
    try {
      var blob = new Blob([text], { type: type || 'application/json;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(function () { a.remove(); URL.revokeObjectURL(url); }, 600);
      return true;
    } catch (e) {
      UI.toast('这个浏览器不支持直接下载，试试「复制备份文本」');
      return false;
    }
  }

  function copyText(text) {
    UI.copy(text).then(function (ok) {
      UI.toast(ok ? '备份已复制，粘到微信发给自己就行' : '复制失败，请手动导出文件', 2600);
    });
  }

  /* ---------- 主事件 ---------- */
  function onClick(e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) return;
    var act = el.dataset.act;
    var k = UI.who(), iso = UI.view.date;

    switch (act) {
      /* 导航 */
      case 'tab': {
        var t = el.dataset.tab;
        if (t === UI.view.tab) { global.scrollTo({ top: 0, behavior: 'smooth' }); break; }
        UI.view.tab = t;
        UI.view.sorting = false;
        UI.render();
        try { history.replaceState(null, '', '#' + t); } catch (err) {}
        global.scrollTo(0, 0);
        break;
      }
      case 'gender': {
        var w = el.dataset.who;
        if (w === k) break;
        S.closeTimer();
        UI.view.sorting = false;
        Store.setActive(w);
        UI.closeAll();
        UI.render();
        UI.toast('已切换到 ' + Store.state.profiles[w].name + ' 的计划');
        break;
      }
      case 'prevday': UI.view.sorting = false; UI.view.date = Core.addDays(iso, -1); syncCalMonth(); UI.render(); break;
      case 'nextday': UI.view.sorting = false; UI.view.date = Core.addDays(iso, 1); syncCalMonth(); UI.render(); break;
      case 'gotoday': UI.view.sorting = false; UI.view.date = Core.todayISO(); syncCalMonth(); UI.render(); break;
      case 'cal-prev': shiftMonth(-1); break;
      case 'cal-next': shiftMonth(1); break;
      case 'cal-day': {
        var d = el.dataset.iso;
        if (!d) break;
        UI.view.sorting = false;
        UI.view.date = d;
        UI.view.tab = 'today';
        syncCalMonth();
        UI.render();
        global.scrollTo(0, 0);
        break;
      }
      case 'theme': {
        var mode = el.dataset.theme;
        Store.setSetting('theme', mode);
        applyTheme();
        UI.render();
        break;
      }

      /* 训练动作 */
      case 'set': {
        var exId = el.dataset.ex, idx = Number(el.dataset.idx);
        var before = Store.getDay(k, iso, false);
        var willOn = !(before && Store.findEx(before, exId) && Store.findEx(before, exId).done[idx]);
        Store.toggleSet(k, iso, exId, idx);
        el.classList.toggle('on', willOn);
        var span = el.querySelector('span');
        if (span) span.textContent = willOn ? '✓' : String(idx + 1);
        var card = el.closest('.ex');
        var log = Store.getDay(k, iso, false);
        if (card && log) {
          var ex = Store.findEx(log, exId);
          if (ex) {
            var all = (ex.done || []).every(Boolean) && ex.done.length;
            card.classList.toggle('is-done', !!all);
            if (willOn && all) UI.toast(ex.name + ' 完成 ✓', 1200);
          }
        }
        UI.refreshTodayLight();
        if (willOn && navigator.vibrate) { try { navigator.vibrate(12); } catch (err) {} }
        break;
      }
      case 'tip': {
        var card2 = el.closest('.ex');
        if (card2) card2.classList.toggle('open');
        break;
      }
      case 'sort-start':
        UI.view.sorting = true;
        UI.render();
        break;
      case 'sort-done': {
        var listEl = document.getElementById('ex-list');
        var ids = listEl ? Array.prototype.map.call(listEl.children, function (c) { return c.dataset.ex; }) : [];
        if (ids.length) Store.reorderExercises(k, iso, ids);
        UI.view.sorting = false;
        UI.render();
        UI.toast('顺序已保存');
        break;
      }
      case 'pick-lib': S.openLibrary(); break;
      case 'sheet-lib': S.openLibrary({ onPick: S.addExRowFromLib }); break;
      case 'open-library': S.openLibrary({ browse: true }); break;
      case 'lib-group': S.libGroup(el.dataset.group); break;
      case 'lib-tip': S.libTip(el.dataset.name); break;
      case 'lib-add': S.libAdd(el.dataset.name); break;

      /* 同步 */
      case 'sync-setup': S.openSyncSheet(); break;
      case 'sync-create': S.syncCreate(); break;
      case 'sync-gist-create': S.syncGistCreate(); break;
      case 'sync-join': S.syncJoin(); break;
      case 'sync-use-origin': S.syncUseOrigin(); break;
      case 'sync-copy': S.syncCopyPair(); break;
      case 'sync-copy-pair': S.syncCopyPair(); break;
      case 'sync-new-token': S.openTokenUpdate(); break;
      case 'sync-do-update-token': S.saveNewToken(); break;
      case 'sync-selfcheck': S.selfCheck(); break;
      case 'sync-now':
        UI.toast('正在同步…', 900);
        global.FitSync.now({ silent: false }).then(function (r) {
          UI.render();
          UI.toast(r && r.error ? '同步失败：' + r.error : '同步完成', 2200);
        });
        break;
      case 'sync-off':
        if (global.confirm('断开同步？这台手机上的记录不会丢，只是不再和对方同步。')) {
          global.FitSync.disconnect();
          UI.render();
          UI.toast('已断开同步');
        }
        break;
      case 'edit-ex': e.preventDefault(); S.openExerciseSheet(k, iso, el.dataset.ex); break;
      case 'save-ex': S.saveExercise(el.dataset.ex); break;
      case 'del-ex': if (global.confirm('删掉这个动作？')) S.deleteExercise(el.dataset.ex); break;
      case 'add-ex': {
        var log2 = Store.ensureDay(k, iso);
        var ex2 = Store.addExercise(k, iso, { name: '新动作', sets: 3, reps: '12', unit: '次', rest: Store.state.settings.restSeconds });
        UI.render();
        S.openExerciseSheet(k, iso, ex2.id);
        break;
      }

      /* 休息日 */
      case 'rest-item': Store.toggleRestItem(k, iso, el.dataset.id); UI.render(); break;

      /* 打卡 */
      case 'checkin': S.openCheckinSheet(k, iso); break;
      case 'mood': S.setMoodPending(el.dataset.mood); break;
      case 'do-checkin': S.doCheckin(); break;
      case 'uncheck':
        if (global.confirm('撤销今天的打卡？')) { Store.setCheckIn(k, iso, false); UI.render(); }
        break;

      /* 编辑整天 */
      case 'edit-day': S.openDaySheet(k, iso, 'day'); break;
      case 'edit-template': S.openDaySheet(k, iso, 'template'); break;
      case 'plan-day': {
        var dow = Number(el.dataset.dow);
        var monday = Core.mondayOf(Core.todayISO());
        S.openDaySheet(k, Core.addDays(monday, dow), 'template');
        break;
      }
      case 'sync-template': {
        var ctx = S.dayCtx;
        Store.saveAsTemplate(ctx.profile, ctx.iso);
        UI.closeModal();
        UI.render();
        UI.toast('以后每个' + Core.dowName(ctx.iso) + '都按这套来');
        break;
      }
      case 'day-kind': S.setDayKind(el.dataset.kind); break;
      case 'sheet-add-ex': e.preventDefault(); S.addExRow(); break;
      case 'sheet-add-rest': e.preventDefault(); S.addRestRow(); break;
      case 'sheet-del-ex': {
        var row = el.closest('[data-exrow]');
        if (row) row.remove();
        break;
      }
      case 'sheet-del-rest': {
        var r = el.closest('[data-restrow]');
        if (r) r.remove();
        break;
      }
      case 'save-day': S.saveDaySheet(); break;
      case 'reset-template': {
        var ctx2 = S.dayCtx;
        if (ctx2) {
          Store.clearTemplate(ctx2.profile, ctx2.dow);
          UI.closeModal();
          UI.render();
          UI.toast('已恢复系统默认安排');
        }
        break;
      }

      /* 计时器 */
      case 'timer': e.preventDefault(); S.openTimer(el.dataset.sec || Store.state.settings.restSeconds); break;
      case 'timer-toggle': S.toggleTimer(); break;
      case 'timer-plus': S.timerAdjust(15); break;
      case 'timer-minus': S.timerAdjust(-15); break;
      case 'timer-set': S.timerSet(el.dataset.sec); break;
      case 'timer-done': UI.closeModal(); S.closeTimer(); break;

      /* 我们 */
      case 'task': Store.toggleTask(iso, el.dataset.who); UI.render(); break;
      case 'cheer': {
        var input = document.querySelector('[data-input="msg"]');
        if (input) { input.value = el.dataset.text; input.focus(); }
        break;
      }
      case 'del-msg':
        break;

      /* 数据 */
      case 'export': {
        var stamp = Core.todayISO();
        download('训练搭子-备份-' + stamp + '.json', Store.exportJSON());
        UI.toast('备份已导出');
        break;
      }
      case 'copy': copyText(Store.exportJSON()); break;
      case 'import': S.openImport(); break;
      case 'do-import': S.doImport(); break;
      case 'reset':
        if (global.confirm('清空全部数据？训练记录、留言都会消失，建议先导出备份。')) {
          Store.reset(false);
          UI.view.date = Core.todayISO();
          UI.render();
          UI.toast('已清空');
        }
        break;

      /* 通用 */
      case 'close-modal': UI.closeModal(); if (UI.isModalOpen()) S.closeTimer(); break;
      case 'onboard-save': S.saveOnboarding(); break;
      default:
        break;
    }
  }

  function syncCalMonth() {
    var d = Core.parseISO(UI.view.date);
    UI.view.calYear = d.getFullYear();
    UI.view.calMonth = d.getMonth();
  }
  function shiftMonth(delta) {
    var m = UI.view.calMonth + delta;
    var y = UI.view.calYear;
    if (m < 0) { m = 11; y--; }
    if (m > 11) { m = 0; y++; }
    UI.view.calMonth = m;
    UI.view.calYear = y;
    UI.render();
  }

  /* ---------- 表单 ---------- */
  function onSubmit(e) {
    var form = e.target.closest ? e.target.closest('[data-form]') : null;
    if (!form) return;
    e.preventDefault();
    var kind = form.dataset.form;
    if (kind === 'msg') {
      var input = form.querySelector('[data-input="msg"]');
      if (!input) return;
      var text = input.value.trim();
      if (!text) return;
      Store.addMessage(UI.who(), text);
      UI.render();
      setTimeout(function () {
        var c = document.querySelector('.chat');
        if (c) c.scrollIntoView({ behavior: 'smooth', block: 'center' });
        var i2 = document.querySelector('[data-input="msg"]');
        if (i2) i2.focus();
      }, 60);
    }
  }

  /* ---------- 输入 ---------- */
  var noteTimer = null;
  function onChange(e) {
    var el = e.target;
    var bind = el.dataset ? el.dataset.bind : null;
    if (!bind) return;
    if (bind === 'weight') {
      Store.setExerciseField(UI.who(), UI.view.date, el.dataset.ex, 'weight', el.value.trim());
    } else if (bind === 'day-note') {
      Store.setDayNote(UI.who(), UI.view.date, el.value.trim());
    } else if (bind === 'name') {
      var n = el.value.trim() || (el.dataset.who === 'him' ? '他' : '她');
      Store.setProfileField(el.dataset.who, 'name', n);
      UI.render();
    } else if (bind === 'start-date') {
      if (el.value) { Store.setSetting('startDate', el.value); UI.render(); UI.toast('开始日期已更新'); }
    } else if (bind === 'rest-seconds') {
      Store.setSetting('restSeconds', Core.clamp(Number(el.value) || 90, 0, 600));
    }
  }

  function onInput(e) {
    var el = e.target;
    if (!el.dataset) return;
    if (el.dataset.input === 'lib-q') { S.libSearch(el.value); return; }
    if (el.dataset.bind !== 'day-note') return;
    clearTimeout(noteTimer);
    noteTimer = setTimeout(function () {
      Store.setDayNote(UI.who(), UI.view.date, el.value.trim());
    }, 500);
  }

  /* ---------- 拖动排序 ---------- */
  function initSort() {
    var list = document.getElementById('ex-list');
    if (!list || list.dataset.dragReady === '1') return;
    list.dataset.dragReady = '1';
    var drag = null;

    list.addEventListener('pointerdown', function (e) {
      if (drag) return;
      var card = e.target.closest ? e.target.closest('.ex') : null;
      if (!card) return;
      if (e.target.closest('input, textarea, button, a')) return;
      drag = { card: card, startY: e.clientY, pointerId: e.pointerId };
      card.classList.add('dragging');
      try { card.setPointerCapture(e.pointerId); } catch (err) {}
      e.preventDefault();
    });

    list.addEventListener('pointermove', function (e) {
      if (!drag || e.pointerId !== drag.pointerId) return;
      var card = drag.card;
      var dy = e.clientY - drag.startY;
      card.style.transform = 'translateY(' + dy + 'px)';
      var rect = card.getBoundingClientRect();
      var mid = rect.top + rect.height / 2;
      var cards = Array.prototype.slice.call(list.children);
      var idx = cards.indexOf(card);
      var neighbor = null;
      if (dy > 6 && idx > -1 && idx < cards.length - 1) {
        var n = cards[idx + 1], nr = n.getBoundingClientRect();
        if (mid > nr.top + nr.height / 2) neighbor = n;
      } else if (dy < -6 && idx > 0) {
        var p = cards[idx - 1], pr = p.getBoundingClientRect();
        if (mid < pr.top + pr.height / 2) neighbor = p;
      }
      if (neighbor) {
        if (dy > 0) list.insertBefore(neighbor, card);
        else list.insertBefore(card, neighbor);
        drag.startY = e.clientY;
        card.style.transform = '';
      }
    });

    function endDrag() {
      if (!drag) return;
      drag.card.classList.remove('dragging');
      drag.card.style.transform = '';
      drag = null;
    }
    list.addEventListener('pointerup', endDrag);
    list.addEventListener('pointercancel', endDrag);
  }

  /* ---------- 周计划拖动换天 ---------- */
  function initPlanSort() {
    var list = document.getElementById('plan-list');
    if (!list || list.dataset.ready === '1') return;
    list.dataset.ready = '1';
    var drag = null;

    list.addEventListener('pointerdown', function (e) {
      var h = e.target.closest ? e.target.closest('.drag-h') : null;
      if (!h) return;
      var row = h.closest('.plan-row');
      if (!row) return;
      drag = { from: Number(row.dataset.dow), to: null, row: row };
      row.classList.add('dragging');
      try { row.setPointerCapture(e.pointerId); } catch (err) {}
      e.preventDefault();
    });

    list.addEventListener('pointermove', function (e) {
      if (!drag) return;
      var rows = Array.prototype.slice.call(list.children);
      var over = null;
      rows.forEach(function (r) {
        var b = r.getBoundingClientRect();
        if (e.clientY >= b.top && e.clientY <= b.bottom) over = r;
      });
      rows.forEach(function (r) {
        r.classList.toggle('drop-target', !!over && r === over && r !== drag.row);
      });
      drag.to = over ? Number(over.dataset.dow) : null;
    });

    function endDrag() {
      if (!drag) return;
      var from = drag.from, to = drag.to, row = drag.row;
      row.classList.remove('dragging');
      Array.prototype.slice.call(list.children).forEach(function (r) { r.classList.remove('drop-target'); });
      drag = null;
      if (to != null && to !== from) {
        Store.swapPlanDay(from, to);
        UI.render();
        UI.toast('周' + Core.WEEK_CN[from] + ' 和 周' + Core.WEEK_CN[to] + ' 换过来了');
      }
    }
    list.addEventListener('pointerup', endDrag);
    list.addEventListener('pointercancel', endDrag);
  }

  /* ---------- 键盘 ---------- */
  function onKey(e) {
    if (e.key === 'Escape' && UI.isModalOpen()) { UI.closeModal(); S.closeTimer(); }
  }

  /* ---------- 启动 ---------- */
  var KNOWN_TABS = ['today', 'calendar', 'us', 'me'];
  function readHash() {
    var h = (global.location.hash || '').replace(/^#/, '');
    if (!h) return;
    var known = KNOWN_TABS.concat(App.tabs().map(function (x) { return x.id; }));
    if (known.indexOf(h) > -1) UI.view.tab = h;
  }

  function boot() {
    Store.init();
    App.store = Store;
    App.core = Core;
    App.data = Data;
    App.ui = UI;

    applyTheme();
    UI.view.date = Core.todayISO();
    readHash();
    syncCalMonth();
    UI.render();

    App.on('tab', function () {
      if (UI.view.sorting) initSort();
      initPlanSort();
    });

    /* 同步拉到新数据后，安静地重绘一次（别打断正在输入的人） */
    App.on('sync:applied', function () {
      var ae = document.activeElement;
      if (ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)) return;
      if (UI.isModalOpen()) return;
      UI.render();
    });

    document.addEventListener('click', onClick);
    document.addEventListener('submit', onSubmit);
    document.addEventListener('change', onChange);
    document.addEventListener('input', onInput);
    document.addEventListener('keydown', onKey);
    global.addEventListener('hashchange', function () {
      readHash();
      UI.render();
      global.scrollTo(0, 0);
    });

    var fab = document.getElementById('fab');
    if (fab) {
      fab.addEventListener('click', function (ev) {
        ev.preventDefault();
        S.openTimer(Store.state.settings.restSeconds || 90);
      });
    }

    global.addEventListener('pagehide', function () { Store.saveNow(); });
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') Store.saveNow();
    });

    if (!Store.storageOK) {
      UI.toast('浏览器不让本地保存，数据可能会丢', 4000);
    }

    if (!Store.state.settings.onboarded) {
      setTimeout(function () { S.openOnboarding(); }, 420);
    }

    App.emit('boot', { state: Store.state });

    /* 双人同步：有配置就自动开始（轮询 + 本地改动后推送） */
    if (global.FitSync) {
      try { global.FitSync.start(); } catch (err) { console.warn('[sync]', err); }
    }

    /* 离线缓存（需要 https 或 localhost，file:// 打开会自动跳过） */
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('sw.js').catch(function () { /* 不影响使用 */ });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})(window);

</script>
</body>
</html>
